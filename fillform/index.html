<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>แบบฟอร์มข้อมูลวางแผนการเงิน — S41 Financial Clinic</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ── theme เดียวกับ health.s41clinic.com (Step 1) ── */
:root{
  --cream:#F5F2EC; --white:#FFFFFF;
  --navy:#002366; --navy2:#1a3a6e; --navy-soft:#E9EDF5;
  --gold:#C8A94A; --gold2:#E8D08A; --gold-soft:#FBF6E6;
  --gray:#9B9B9B; --gray2:#E5E1D8; --gray3:#F3F0EA;
  --text:#1C1C2E; --muted:#7A7A8C; --red:#E05252; --green:#3E8E6E;
  --serif:'Cormorant Garamond',Georgia,serif;
  --thai:'Sarabun','Noto Sans Thai',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--text);font-family:var(--thai);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 12px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:52px;height:52px;display:block}
.brand .wm{font-size:11px;font-weight:800;color:var(--navy);letter-spacing:3.5px;text-transform:uppercase;line-height:1.3}
.brand .wm small{display:block;font-size:10px;letter-spacing:1.2px;color:var(--muted);font-weight:600;text-transform:none}
.step-ind{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.step-ind b{color:var(--navy);font-size:14px}
.steps{display:flex;gap:4px;margin-bottom:16px}
.step{flex:1;height:3px;border-radius:2px;background:var(--gray2);transition:all .4s}
.step.on{background:var(--gold)} .step.cur{background:var(--navy)}

.card{background:#fff;border:1px solid var(--gray2);border-radius:20px;padding:24px 20px;box-shadow:0 4px 48px rgba(0,35,102,.07);animation:up .4s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:22px;font-weight:800;color:var(--navy);line-height:1.35;margin-bottom:4px}
h2{font-size:20px;font-weight:800;color:var(--navy);line-height:1.35;margin-bottom:4px}
.sub{font-size:13.5px;color:var(--muted);margin-bottom:14px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.sec{margin-top:16px}
.sec-h{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800;margin:14px 0 6px}
.f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--gray2)}
.f:last-child{border-bottom:0}
.f label{flex:1;font-size:15px;line-height:1.35;font-weight:500}
.f label small{display:block;color:var(--gray);font-size:11.5px;font-weight:400}
.f .in{display:flex;align-items:center;gap:6px;flex:0 0 auto}
input[type=text],input[type=number],select{font-family:var(--thai);font-size:16px;color:var(--text);background:var(--gray3);border:1px solid var(--gray2);border-radius:12px;padding:9px 11px;outline:none;min-height:42px}
input:focus,select:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(200,169,74,.18)}
input.money{width:138px;text-align:right;font-weight:600}
input.num{width:74px;text-align:center;font-weight:600}
input.txt{width:100%}
.unit{font-size:12px;color:var(--gray);width:44px}
.f.stack{flex-direction:column;align-items:stretch;gap:6px}
.f.stack .in{width:100%}
.f.stack input.txt{flex:1}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1.5px solid var(--gray2);background:#fff;border-radius:999px;padding:8px 14px;font-size:14.5px;cursor:pointer;user-select:none;font-family:var(--thai);color:var(--text);min-height:40px;font-weight:500;transition:all .15s}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip:active{transform:scale(.98)}

.sub-card{border:1.5px solid var(--gray2);border-radius:14px;padding:10px 12px;margin-top:10px;background:#FCFBF8}
.sub-card .t{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
.sub-card .t button{border:0;background:none;color:var(--red);font-size:12.5px;cursor:pointer;font-family:var(--thai);letter-spacing:0;text-transform:none;font-weight:600}

.btn{font-family:var(--thai);border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;min-height:50px;transition:all .15s}
.btn.primary{background:var(--navy);color:#fff;flex:1}
.btn.primary:active{background:var(--navy2)}
.btn.ghost{background:#fff;border:1.5px solid var(--gray2);color:var(--navy)}
.btn.soft{background:var(--gold-soft);color:var(--navy);border:1.5px solid var(--gold2);font-weight:600;font-size:14.5px;width:100%;margin-top:14px}
.btn.add{background:#fff;border:1.5px dashed var(--navy2);color:var(--navy);font-weight:600;font-size:14.5px;width:100%;margin-top:10px;min-height:44px}
.btn:disabled{opacity:.45;cursor:default}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(245,242,236,.96);backdrop-filter:blur(8px);border-top:1px solid var(--gray2);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav .row{max-width:560px;margin:0 auto;display:flex;gap:10px}
.saved{font-size:11.5px;color:var(--gray);text-align:center;margin-top:6px;min-height:14px}

.banner{background:var(--gold-soft);border:1px solid var(--gold2);border-radius:14px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;color:var(--text)}
.banner b{color:var(--navy)}
.note{background:var(--navy-soft);border-left:3px solid var(--navy);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px;color:#243a5e}
.ok{background:#EAF4EF;border-left:3px solid var(--green);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px;color:#2b5c47}
.warn{background:#FBECEC;border-left:3px solid var(--red);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px;color:#7a3434}
ul.tips{padding-left:18px;font-size:14.5px;margin-top:8px}
ul.tips li{margin:4px 0}
.summary{margin-top:10px;font-size:14.5px}
.summary div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--gray2)}
.summary div b{color:var(--navy)}
.center{text-align:center}
.two{display:flex;gap:10px;margin-top:14px}
.two .btn{flex:1;font-size:14px;padding:11px 8px;min-height:46px}
.ver{font-size:11px;color:var(--gray);text-align:center;margin-top:18px}
.hidden{display:none!important}
@media (max-width:380px){ input.money{width:118px} .f label{font-size:14.5px} }

/* ── สำเนา PDF (พิมพ์) ── */
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  body{background:#fff;font-size:11pt}
  .wrap,.nav{display:none!important}
  #printArea{display:block;color:#1C1C2E;font-family:var(--thai)}
  .ph{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #002366;padding-bottom:8pt;margin-bottom:10pt}
  .ph .l{display:flex;align-items:center;gap:10pt}
  .ph img{width:44pt;height:44pt}
  .ph .wm{font-size:9pt;font-weight:800;letter-spacing:3pt;color:#002366;text-transform:uppercase}
  .ph .wm small{display:block;font-size:8pt;letter-spacing:1pt;color:#7A7A8C;font-weight:600;text-transform:none}
  .ph .r{text-align:right;font-size:9pt;color:#7A7A8C}
  .ph .r b{display:block;font-size:13pt;color:#002366}
  .pt{font-size:15pt;font-weight:800;color:#002366;margin:0 0 2pt}
  .ps{font-size:9.5pt;color:#7A7A8C;margin-bottom:10pt}
  .pg{page-break-inside:avoid;margin-bottom:9pt}
  .pg h3{font-size:10pt;letter-spacing:1.5pt;text-transform:uppercase;color:#C8A94A;border-bottom:1px solid #E5E1D8;padding-bottom:2pt;margin-bottom:3pt;font-weight:800}
  .pg table{width:100%;border-collapse:collapse;font-size:10pt}
  .pg td{padding:2pt 0;border-bottom:1px dotted #E5E1D8;vertical-align:top}
  .pg td.v{text-align:right;font-weight:600;width:38%}
  .pg table.wide td.v{width:58%}
  .pg table.pol{font-size:9pt}
  .pg table.pol th{text-align:right;font-weight:700;color:#7A7A8C;font-size:8pt;padding:0 0 2pt 4pt;border-bottom:1px solid #E5E1D8}
  .pg table.pol th:first-child,.pg table.pol td:first-child{text-align:left;padding-left:0}
  .pg table.pol td{text-align:right;padding:2pt 0 2pt 4pt;font-weight:600}
  .pg td.u{color:#9B9B9B;font-size:8.5pt;width:14%;padding-left:6pt}
  .pg .empty{color:#9B9B9B;font-style:italic;font-size:9.5pt}
  .pg h3{margin-top:2pt}
  .pg .tot td{border-top:1px solid #002366;border-bottom:0;font-weight:800;color:#002366}
  .cols{display:flex;gap:14pt}
  .cols .pg{flex:1;min-width:0}
  .pf{margin-top:12pt;border-top:1px solid #E5E1D8;padding-top:6pt;font-size:8.5pt;color:#7A7A8C;line-height:1.5}
}
</style>
</head>

/* ---------- ลำดับหน้าจอ ---------- */
const SCREENS=[
  {id:'intro'},
  {id:'me',     n:'ข้อมูลตัวเอง'},
  {id:'family', n:'ครอบครัว'},
  {id:'income', n:'รายรับ',                money:'income'},
  {id:'fixed',  n:'รายจ่ายผ่อน / คงที่',   money:'fixed'},
  {id:'vary',   n:'รายจ่ายใช้ชีวิต',        money:'vary'},
  {id:'save',   n:'เงินออม',                money:'save'},
  {id:'assets', n:'ทรัพย์สิน',              money:'assets'},
  {id:'liab',   n:'หนี้คงค้าง',             money:'liab'},
  {id:'ins',    n:'ประกันที่มี'},
  {id:'goals',  n:'เป้าหมาย'},
  {id:'done'},
];
const N_STEPS=SCREENS.length-2;

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const fmt=n=>Number(n||0).toLocaleString('en-US');
const numOf=v=>{ const n=Number(String(v==null?'':v).replace(/[^\d.]/g,'')); return isFinite(n)?n:0; };
const num=id=>numOf(V[id]);
const txt=id=>String(V[id]==null?'':V[id]).trim();
function moneyInput(id,ph){ return `<input type="text" class="money" inputmode="numeric" id="${id}" value="${esc(V[id]||'')}" placeholder="${ph||'0'}" oninput="onMoney(this)" autocomplete="off">`; }
function onMoney(el){ const raw=el.value.replace(/[^\d]/g,''); el.value=raw?Number(raw).toLocaleString('en-US'):''; V[el.id]=el.value; saveSoon(); }
function onVal(el){ V[el.id]=el.value; saveSoon(); }
function chipSet(key,val,el){ V[key]=val; el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el)); saveSoon(); if(el.dataset.rerender) render(); }
function chips(key,opts,rerender){ return `<div class="chips">${opts.map(([v,l])=>`<button type="button" class="chip ${V[key]===v?'on':''}" ${rerender?'data-rerender="1"':''} onclick="chipSet('${key}','${v}',this)">${l}</button>`).join('')}</div>`; }

/* ---------- บันทึกอัตโนมัติ (ในเครื่องลูกค้าเท่านั้น) ---------- */
let saveT=null;
function saveSoon(){ clearTimeout(saveT); saveT=setTimeout(saveNow,300); }
function saveNow(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({v:VERSION,at:Date.now(),cur,V,KIDS,PARENTS,POLICIES,GOALS,ref:REF}));
    const back=localStorage.getItem(LS_KEY);
    $('savedMsg').textContent = back ? 'บันทึกในเครื่องแล้ว '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : 'บันทึกในเครื่องไม่สำเร็จ';
  }catch(e){ $('savedMsg').textContent='เบราว์เซอร์นี้บันทึกอัตโนมัติไม่ได้ — กรอกให้จบในครั้งเดียว'; }
}
function loadSaved(){
  try{ const raw=localStorage.getItem(LS_KEY); if(!raw) return false;
    const d=JSON.parse(raw); if(!d||!d.V) return false;
    V=d.V||{}; KIDS=d.KIDS||[]; PARENTS=d.PARENTS||[]; POLICIES=d.POLICIES||[]; GOALS=d.GOALS||[]; cur=Math.min(d.cur||0,SCREENS.length-1);
    const when=new Date(d.at||Date.now());
    $('resume').innerHTML=`กรอกต่อจากที่ค้างไว้ (${when.toLocaleDateString('th-TH')} ${when.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}) &nbsp;·&nbsp; <a href="#" onclick="clearAll();return false" style="color:var(--carrier)">เริ่มใหม่</a>`;
    $('resume').classList.remove('hidden');
    return true;
  }catch(e){ return false; }
}
function clearAll(){ if(!confirm('ล้างข้อมูลที่กรอกไว้ทั้งหมด แล้วเริ่มใหม่?')) return; try{ localStorage.removeItem(LS_KEY); }catch(e){} V={};KIDS=[];PARENTS=[];POLICIES=[];GOALS=[];cur=0; $('resume').classList.add('hidden'); render(); }

/* ---------- ตรวจว่าอยู่ใน browser ในแอป (LINE/Facebook) ---------- */
function inAppBrowser(){ const ua=navigator.userAgent||''; return /Line\//i.test(ua)?'LINE':/FBAN|FBAV|FB_IAB/i.test(ua)?'Facebook':/Instagram/i.test(ua)?'Instagram':''; }

/* ═══════════════ RENDER ═══════════════ */
function render(){
  const S=SCREENS[cur]; const box=$('screen'); let h='';
  const stepNo=cur>=1&&cur<=N_STEPS?cur:0;
  $('stepInd').innerHTML = stepNo?`<b>${stepNo}</b> / ${N_STEPS} · ${S.n}`:(cur===0?'':'เสร็จแล้ว');
  $('steps').innerHTML = Array.from({length:N_STEPS},(_,i)=>`<div class="step ${i+1<cur?'on':i+1===cur?'cur':''}"></div>`).join('');

  if(S.id==='intro') h=renderIntro();
  else if(S.id==='me') h=renderMe();
  else if(S.id==='family') h=renderFamily();
  else if(S.money) h=renderMoney(S.money);
  else if(S.id==='ins') h=renderIns();
  else if(S.id==='goals') h=renderGoals();
  else if(S.id==='done') h=renderDone();
  box.innerHTML=h;

  /* nav */
  let nav='';
  if(S.id==='intro') nav=`<button class="btn primary" onclick="go(1)">เริ่มกรอก</button>`;
  else if(S.id==='done') nav=`<button class="btn ghost" onclick="go(-1)">ย้อนกลับ</button><button class="btn primary" onclick="downloadFile()">บันทึกไฟล์ .json ส่งให้ที่ปรึกษา</button>`;
  else nav=`<button class="btn ghost" onclick="go(-1)">ย้อนกลับ</button><button class="btn primary" onclick="go(1)">${cur===N_STEPS?'ไปหน้าสรุป':'ถัดไป'}</button>`;
  $('navRow').innerHTML=nav;
  window.scrollTo({top:0,behavior:'instant'});
  const ia=inAppBrowser();
  if(ia && S.id==='done'){ $('inapp').innerHTML=`<b>คุณกำลังเปิดจากแอป ${ia}</b> — การบันทึกไฟล์อาจไม่ทำงาน ให้กดเมนู ⋯ มุมขวาบน แล้วเลือก "เปิดในเบราว์เซอร์" (Safari/Chrome) ข้อมูลที่กรอกไว้จะยังอยู่`; $('inapp').classList.remove('hidden'); }
  else $('inapp').classList.add('hidden');
}
function go(d){ cur=Math.max(0,Math.min(SCREENS.length-1,cur+d)); saveNow(); render(); }
function skipScreen(rows){ rows.forEach(r=>{ V[r[0]]=''; }); go(1); }

  const gl=GOALS.filter(g=>numOf(g.amt)>0);
  let goals=gl.length?'<table>'+gl.map(g=>row((g.ico||'')+' '+esc(g.name||'เป้าหมาย'),fmt(numOf(g.amt))+' ฿ · อีก '+numOf(g.yrs)+' ปี')).join('')+'</table>':'<div class="empty">ไม่ได้กรอก</div>';
  if(FOC[V.cfocus]||txt('cnote')) goals+=`<table class="wide">${FOC[V.cfocus]?row('อยากให้ช่วยดูเป็นพิเศษ',FOC[V.cfocus]):''}${txt('cnote')?row('เรื่องที่อยากบอกที่ปรึกษา',esc(txt('cnote'))):''}</table>`;
  goals=`<div class="pg"><h3>เป้าหมาย</h3>${goals}</div>`;
  $('printArea').innerHTML=`
    <div class="ph"><div class="l"><img src="${LOGO_SRC}" alt=""><div class="wm">Signature 41<small>Financial Clinic · Customized for One</small></div></div>
      <div class="r"><b>${esc(name)}</b>สำเนาข้อมูลวางแผนการเงิน · ${dateTh}</div></div>
    <div class="pt">แบบฟอร์มข้อมูลวางแผนการเงิน (Money MRI)</div>
    <div class="ps">สำเนาสำหรับผู้กรอก · ตัวเลขเป็นค่าประมาณตามที่กรอกด้วยตนเอง · ที่ปรึกษาจะตรวจสอบและเติมส่วนที่ขาดในนัดหมาย</div>
    <div class="cols">${me}${fam}</div>
    <div class="cols">${moneyGrp('income')}${moneyGrp('fixed')}</div>
    <div class="cols">${moneyGrp('vary')}${moneyGrp('save')}</div>
    <div class="cols">${moneyGrp('assets')}${moneyGrp('liab')}</div>
    ${ins}${goals}
    <div class="pf">เอกสารนี้เป็นสำเนาข้อมูลที่ผู้กรอกบันทึกไว้เอง ไม่ใช่รายงานวิเคราะห์ · ข้อมูลถูกเก็บในเครื่องของผู้กรอกจนกว่าจะส่งไฟล์ให้ที่ปรึกษา · S41 Client Form v${VERSION} · Signature 41 Financial Clinic · health.s41clinic.com</div>`;
}
function savePdf(){
  renderPrint();
  setStatus('note','เปิดหน้าต่างพิมพ์ของเครื่องแล้ว — เลือก <b>"บันทึกเป็น PDF" / "Save as PDF"</b> (iPhone: กดปุ่มแชร์ในหน้าตัวอย่าง → บันทึกไปที่ไฟล์) · ถ้าไม่มีอะไรขึ้น เบราว์เซอร์นี้ไม่รองรับการพิมพ์ ให้เปิดใน Safari/Chrome');
  setTimeout(()=>{ try{ window.print(); }catch(e){ setStatus('warn','เปิดหน้าต่างพิมพ์ไม่ได้: '+esc(e.message)); } },50);
}

/* ═══════════════ สร้างไฟล์ (โครงเดียวกับ Step 2 v2.6.4 · stage:'client') ═══════════════ */
const EDU_LEVELS=[['อนุบาล',3,3],['ประถม',6,6],['มัธยม',6,12],['ป.ตรี',4,18],['ป.โท',2,22]];
const EDU_FEE={'อนุบาล':[15000,80000,350000],'ประถม':[20000,120000,500000],'มัธยม':[25000,150000,650000],'ป.ตรี':[40000,150000,400000],'ป.โท':[100000,200000,350000]};
const eduGoalId=(kidId,lvl)=>{ const str='E'+kidId+'|'+lvl; let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))>>>0; } return 900000000+(h%99000000); };

function buildClientFile(){
  const age=num('cage')||35, ra=Math.max(num('cret')||60, age+1), life=85;
  const nm=txt('cname')||'ลูกค้าใหม่';
  const est=[];

  const detail={
    assets:{ liquid:{savings:0,fixedDep:0,moneyFund:0}, liquidExtra:[],
      invest:{bond:0,stock:0,mutualFund:0,rmf:0,pvd:0,insCash:0,gold:0}, investExtra:[],
      personal:{jewelry:0,car:0,property:0}, personalExtra:[] },
    liab:{ short:{utility:0,creditCard:0,otherShort:0}, long:{carLoan:0,homeLoan:0,otherLong:0} },
    cashflow:{ income:{bonus:0,interest:0,rental:0,other:0}, incomeExtra:[],
      fixed:{homeLoanPay:0,carLoanPay:0,creditCardPay:0,lifeIns:0,carIns:0,condoFee:0,socialSec:0,pvdContrib:0}, fixedExtra:[],
      var:{living:0,food:0,utility:0,phone:0,medical:0,tax:0,transport:0,personalCare:0,otherPersonal:0,recreation:0,charity:0}, varExtra:[],
      savings:{normal:0,retire:0,rmf:0,tesg:0}, savingExtra:[] }
  };
  const setPath=(obj,path,val)=>{ const p=path.split('.'); let o=obj; for(let i=0;i<p.length-1;i++) o=o[p[i]]; o[p[p.length-1]]=val; };
  let filled=0;
  Object.values(MONEY_SCREENS).forEach(M=>M.rows.forEach(([id,label,per,snap])=>{
    const raw=num(id); if(!raw) return; filled++;
    if(snap.startsWith('special')) return;
    const v=(snap==='cashflow.income.bonus')?raw:(per==='y'?raw/12:raw);
    setPath(detail,snap,Math.round(v*100)/100);
  }));
  /* กันนับเบี้ยซ้ำ: MRI นับเบี้ยจากทะเบียนกรมธรรม์เป็นรายจ่ายอยู่แล้ว
     → ช่อง "เบี้ยรวมทุกเล่ม" ในงบกระแส เหลือเฉพาะส่วนที่เกินจากเล่มที่ลูกค้ากรอกในทะเบียน */
  const premSum=POLICIES.reduce((t,p)=>t+numOf(p.premium),0);
  if(premSum>0 && num('ff_lifeIns')>0){
    const rest=Math.max(0,num('ff_lifeIns')-premSum);
    detail.cashflow.fixed.lifeIns=Math.round(rest/12*100)/100;
    est.push('เบี้ยรวมที่ลูกค้ากรอก '+fmt(num('ff_lifeIns'))+' ฿/ปี · เบี้ยในทะเบียนกรมธรรม์ '+fmt(premSum)+' ฿/ปี → ช่อง "เบี้ยประกันชีวิต" ในงบกระแสตั้งเป็นส่วนต่าง '+fmt(rest)+' ฿/ปี กันนับซ้ำ (เมื่อลงทะเบียนครบทุกเล่มแล้ว ตั้งช่องนี้เป็น 0)');
  }

  /* ผู้วางแผน + รายได้ */
  const incomes=[];
  const salaryM=num('fi_salary');
  if(salaryM>0) incomes.push({ id:'i1', ico:'💼', name:'เงินเดือน / รายได้หลัก', monthly:salaryM, startAge:age, endAge:Math.max(ra-1,age), growth:3, color:'#C8635A' });
  else est.push('ลูกค้าไม่ได้กรอกเงินเดือน/รายได้หลัก — ต้องถามก่อนทำแผน');
  const carrier={ id:'c-primary', name:nm, age, life, retireAge:ra, retireMode:'items', incomes };
  if(num('cretexp')>0){ carrier.retireExpense=num('cretexp'); carrier.retireMode='custom'; }
  else est.push('ลูกค้าไม่ได้ระบุเงินใช้หลังเกษียณ — MRI ใช้โหมด "เลือกตามรายการ" จากงบกระแสเงินสดที่กรอก');
  if(num('fi_pension')>0){ carrier.pensionMonthly=num('fi_pension'); est.push('รายได้หลังเกษียณ '+fmt(num('fi_pension'))+' ฿/เดือน ตามที่ลูกค้าคาด — ยืนยันแหล่งที่มา/ระยะเวลา'); }
  const HOSP={gov:[5000000,'รพ.รัฐ / ห้องพิเศษ'],mid:[15000000,'รพ.เอกชนทั่วไป'],hi:[25000000,'รพ.เอกชนชั้นนำ']};
  if(HOSP[V.chosp]) carrier.healthTarget=HOSP[V.chosp][0];
  const carriers=[carrier];

  /* ผู้พึ่งพิง */
  const dependents=[]; const eduPlan={}; const eduGoals=[];
  if(V.cmar==='married'){
    if(V.spinc==='no'){
      dependents.push({ id:'d-sp', parent:'c-primary', name:txt('spname')||'คู่ชีวิต', age:num('spage')||age, kind:'spouse', monthly:num('spmon')||0, life:85 });
    } else if(V.spinc==='yes'){
      est.push('คู่ชีวิต "'+(txt('spname')||'-')+'" อายุ '+(num('spage')||'-')+' มีรายได้ของตัวเอง — ยังไม่ได้เพิ่มเป็นผู้วางแผนคนที่ 2 ใน MRI (เพิ่มได้ถ้าจะวางแผนร่วมกัน)');
    }
  }
  const nk=parseInt(V.nkids||'0')||0;
  for(let i=0;i<nk;i++){ const k=KIDS[i]||{}; const kAge=numOf(k.age);
    const id='d-k'+(i+1);
    dependents.push({ id, parent:'c-primary', name:(k.name||'').trim()||('บุตรคนที่ '+(i+1)), age:kAge, kind:'child', monthly:numOf(k.mon), endAge:k.upto==='master'?24:22 });
    const tier=parseInt(k.tier||'1')||0; const plan={pick:{},custom:{}};
    EDU_LEVELS.forEach(([lvl,yrs,start])=>{
      if(lvl==='ป.โท' && k.upto!=='master') return;
      plan.pick[lvl]=tier;
      const perYear=EDU_FEE[lvl][tier]; const rem=Math.max(0,Math.min(yrs,start+yrs-Math.max(kAge,start)));
      if(rem<=0) return;
      eduGoals.push({ id:eduGoalId(id,lvl), name:'ค่าเทอม '+lvl, ico:'🎓', amt:-(perYear*rem), age:Math.round(age+Math.max(0,start-kAge)), eduYears:rem, rank:500+Math.round(age+Math.max(0,start-kAge)), parent:id, split:false, eduAuto:true, eduKid:id });
    });
    eduPlan[id]=plan;
  }
  if(nk) est.push('ค่าเทอมใช้ตารางมาตรฐาน S41 ตามแนวโรงเรียนที่ลูกค้าเลือก ('+KIDS.slice(0,nk).map(k=>(k.name||'ลูก')+'='+['รัฐ','เอกชน','นานาชาติ'][parseInt(k.tier||'1')||0]).join(', ')+') — ปรับรายชั้นได้ที่หน้าทุนการศึกษาบุตร');
  const np=parseInt(V.npar||'0')||0;
  for(let i=0;i<np;i++){ const p=PARENTS[i]||{}; const pa=numOf(p.age)||65;
    dependents.push({ id:'d-p'+(i+1), parent:'c-primary', name:(p.name||'').trim()||('ผู้ใหญ่ที่ดูแล '+(i+1)), age:pa, kind:'parent', monthly:numOf(p.mon), life:Math.max(85,pa+1) });
  }

  /* เป้าหมาย */
  const goals=eduGoals.slice();
  GOALS.forEach((g,i)=>{ const amt=numOf(g.amt); if(!(amt>0)) return;
    const yrs=Math.max(0,numOf(g.yrs)); goals.push({ id:Date.now()+i, name:(g.name||'').trim()||'เป้าหมาย', ico:g.ico||'🎯', amt:-amt, age:Math.round(age+yrs), parent:'c-primary', split:false }); });

  /* กรมธรรม์ + คุ้มครอง */
  const policies=POLICIES.map((p,i)=>({ id:Date.now()+100+i, company:p.company||'', name:(p.name||'').trim(), no:'', saleAge:'', start:'', payUntil:String(p.payUntil||'').trim(), maturity:'', owner:'c-primary',
    life:numOf(p.life), premium:numOf(p.premium), health:numOf(p.health), accMed:0, hospCash:0, hospCancer:0, cancer:0, ciMid:0, ciSevere:numOf(p.ciSevere), ciCrit:0, care:0, paDeath:0, saving:0, annuity:0, surrender:0 }));
  const protection={ lifeCov:policies.reduce((t,p)=>t+p.life,0), retireFund:0 };
  if(HOSP[V.chosp]) protection.hospital=HOSP[V.chosp][1];
  const roomHave=Math.max(0,...POLICIES.map(p=>numOf(p.room)),num('welfroom'));
  if(roomHave>0) protection.roomRateHave=roomHave;
  if(policies.length) est.push('ทะเบียนกรมธรรม์ '+policies.length+' เล่ม กรอกโดยลูกค้าเฉพาะช่องหลัก (เบี้ย/ทุนชีวิต/วงเงินรักษา/โรคร้าย) — เติมช่องอื่นจากรูปตารางความคุ้มครอง');
  else est.push('ลูกค้าระบุว่าไม่มีกรมธรรม์ (หรือยังไม่ได้กรอก) — ยืนยันอีกครั้ง');
  if(V.welf==='group') est.push('มีประกันกลุ่มบริษัท: ค่าห้อง '+fmt(num('welfroom'))+' ฿/คืน · วงเงินรักษา '+fmt(num('welfmed'))+' ฿ — ใส่ไว้ที่ค่าห้องที่มีแล้ว ยังไม่ได้ลงทะเบียนกรมธรรม์');
  est.push('ยังไม่ได้ทำแบบประเมินความเสี่ยง — พอร์ตใน MRI เป็นค่าเริ่มต้น "ปานกลาง" ทำแบบประเมินก่อนคุยแผนลงทุน');
  if(!filled) est.push('ลูกค้าไม่ได้กรอกตัวเลขงบการเงินเลย');

  const talk={};
  const JOB={emp:'พนักงานบริษัท',gov:'ราชการ / รัฐวิสาหกิจ',own:'ธุรกิจส่วนตัว',free:'ฟรีแลนซ์',other:'อื่น ๆ'};
  const FOC={retire:'เกษียณ',protect:'คุ้มครองครอบครัว',debt:'จัดการหนี้',invest:'ลงทุน / ต่อยอด',edu:'ทุนการศึกษาลูก',tax:'ภาษี',all:'ดูภาพรวมทั้งหมด'};
  if(JOB[V.cjob]) talk['อาชีพ']=JOB[V.cjob];
  if(FOC[V.cfocus]) talk['อยากให้ช่วยดูเป็นพิเศษ']=FOC[V.cfocus];
  if(txt('cnote')) talk['เรื่องที่ลูกค้าอยากบอก']=txt('cnote');
  if(V.welf) talk['สวัสดิการที่ทำงาน']=({none:'ไม่มี',sso:'ประกันสังคมอย่างเดียว',group:'ประกันกลุ่มบริษัท'})[V.welf];

  const visit={
    source:'S41 Client Form v'+VERSION, visitDate:new Date().toISOString().slice(0,10),
    advisor:'', advisorRef:REF, filledBy:'client',
    goalPriority:FOC[V.cfocus]?[FOC[V.cfocus]]:[],
    budgetMonthly:0, lifeInsuranceSum:protection.lifeCov, educationFundNeeded:0, educationFundPrepared:0,
    riskProfile:null, gaps:{}, talk, estimates:est,
    note:'ไฟล์นี้ลูกค้ากรอกเองผ่านแบบฟอร์ม (ไม่ได้เจอตัว) — ตรวจตัวเลขกับลูกค้าก่อนสรุปแผน · ทะเบียนกรมธรรม์กรอกเฉพาะช่องหลัก'
  };
  return {
    stage:'client',
    app:'S41 Signature 41 Planner', version:'3.8.1', savedAt:new Date().toISOString(),
    s41:{ clientId:clientId(), name:nm },
    state:{
      axisMin:Math.max(age-1,0), axisMax:life+2, snapAge:age, inflation:3,
      planMode:'combined', splitRatio:50, uiMode:'advance',
      assume:{ salaryG:3, inf:3, eduInf:5, medInf:8, preRet:5, postRet:3, sdPort:8.9 },
      portfolio:{ levels:{conservative:3,moderate:5,aggressive:7}, preRetire:'moderate', postRetire:'conservative' },
      ports:[], carriers, dependents, goals, eduPlan, navLog:[],
      snap:{ policies, detail, protection },
      _visit:visit
    },
    _visit:visit
  };
}
function clientId(){ if(!V._cid){ V._cid='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); saveSoon(); } return V._cid; }
function fileName(){
  const safe=String(txt('cname')||'ลูกค้าใหม่').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'_').slice(0,40)||'ลูกค้าใหม่';
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `S41_Client_${safe}_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
}
function makeBlob(){ return new Blob([JSON.stringify(buildClientFile(),null,1)],{type:'application/json'}); }
function setStatus(cls,msg){ const s=$('sendStatus'); if(s) s.innerHTML=`<div class="${cls}">${msg}</div>`; }

function downloadFile(){
  const name=fileName();
  try{
    const url=URL.createObjectURL(makeBlob());
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },2000);
    setStatus('note','สั่งบันทึกไฟล์ <b>'+esc(name)+'</b> แล้ว — อยู่ในโฟลเดอร์ "ดาวน์โหลด" (iPhone: แอป Files › ดาวน์โหลด) ส่งไฟล์นี้ให้ที่ปรึกษาตามช่องทางที่คุณสะดวก · ถ้าไม่มีไฟล์ขึ้น แสดงว่าเบราว์เซอร์นี้บล็อกการดาวน์โหลด ให้เปิดลิงก์ใน Safari/Chrome แล้วลองใหม่ (ข้อมูลที่กรอกยังอยู่)');
  }catch(e){ setStatus('warn','ดาวน์โหลดไม่สำเร็จ: '+esc(e.message)+' — ลองเปิดลิงก์ใน Safari/Chrome'); }
}

loadSaved();
render();
