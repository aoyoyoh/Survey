<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>แบบฟอร์มข้อมูลวางแผนการเงิน — S41 Financial Clinic</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ── theme เดียวกับ health.s41clinic.com (Step 1) ── */
:root{
  --cream:#F5F2EC; --white:#FFFFFF;
  --navy:#002366; --navy2:#1a3a6e; --navy-soft:#E9EDF5;
  --gold:#C8A94A; --gold2:#E8D08A; --gold-soft:#FBF6E6;
  --gray:#9B9B9B; --gray2:#E5E1D8; --gray3:#F3F0EA;
  --text:#1C1C2E; --muted:#7A7A8C; --red:#E05252; --green:#3E8E6E;
  --serif:'Cormorant Garamond',Georgia,serif;
  --thai:'Sarabun','Noto Sans Thai',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--cream);color:var(--text);font-family:var(--thai);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 12px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:52px;height:52px;display:block}
.brand .wm{font-size:11px;font-weight:800;color:var(--navy);letter-spacing:3.5px;text-transform:uppercase;line-height:1.3}
.brand .wm small{display:block;font-size:10px;letter-spacing:1.2px;color:var(--muted);font-weight:600;text-transform:none}
.step-ind{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.step-ind b{color:var(--navy);font-size:14px}
.steps{display:flex;gap:4px;margin-bottom:16px}
.step{flex:1;height:3px;border-radius:2px;background:var(--gray2);transition:all .4s}
.step.on{background:var(--gold)} .step.cur{background:var(--navy)}
.step.skip{background:repeating-linear-gradient(90deg,var(--gray) 0 4px,transparent 4px 8px)}   /* v1.7: หน้าที่ผ่านมาแล้วแต่ยังไม่มีข้อมูล — ไม่ขึ้นสีทองเหมือนหน้าที่กรอกแล้ว */

.card{background:#fff;border:1px solid var(--gray2);border-radius:20px;padding:24px 20px;box-shadow:0 4px 48px rgba(0,35,102,.07);animation:up .4s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:22px;font-weight:800;color:var(--navy);line-height:1.35;margin-bottom:4px}
h2{font-size:20px;font-weight:800;color:var(--navy);line-height:1.35;margin-bottom:4px}
.sub{font-size:13.5px;color:var(--muted);margin-bottom:14px}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.sec{margin-top:16px}
.sec-h{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800;margin:14px 0 6px}
.f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--gray2)}
.f:last-child{border-bottom:0}
.f label{flex:1;font-size:15px;line-height:1.35;font-weight:500}
.f label small{display:block;color:var(--gray);font-size:11.5px;font-weight:400}
.f .in{display:flex;align-items:center;gap:6px;flex:0 0 auto}
input[type=text],input[type=number],select{font-family:var(--thai);font-size:16px;color:var(--text);background:var(--gray3);border:1px solid var(--gray2);border-radius:12px;padding:9px 11px;outline:none;min-height:42px}
input:focus,select:focus{border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(200,169,74,.18)}
input.money{width:138px;text-align:right;font-weight:600}
input.num{width:74px;text-align:center;font-weight:600}
input.txt{width:100%}
.unit{font-size:12px;color:var(--gray);width:44px}
.f.stack{flex-direction:column;align-items:stretch;gap:6px}
.f.stack .in{width:100%}
.f.stack input.txt{flex:1}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1.5px solid var(--gray2);background:#fff;border-radius:999px;padding:8px 14px;font-size:14.5px;cursor:pointer;user-select:none;font-family:var(--thai);color:var(--text);min-height:40px;font-weight:500;transition:all .15s}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip:active{transform:scale(.98)}

.sub-card{border:1.5px solid var(--gray2);border-radius:14px;padding:10px 12px;margin-top:10px;background:#FCFBF8}
.sub-card .t{font-size:12px;font-weight:800;color:var(--navy);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
.sub-card .t button{border:0;background:none;color:var(--red);font-size:12.5px;cursor:pointer;font-family:var(--thai);letter-spacing:0;text-transform:none;font-weight:600}

.btn{font-family:var(--thai);border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;min-height:50px;transition:all .15s}
.btn.primary{background:var(--navy);color:#fff;flex:1}
.btn.primary:active{background:var(--navy2)}
.btn.ghost{background:#fff;border:1.5px solid var(--gray2);color:var(--navy)}
.btn.soft{background:var(--gold-soft);color:var(--navy);border:1.5px solid var(--gold2);font-weight:600;font-size:14.5px;width:100%;margin-top:14px}
.btn.add{background:#fff;border:1.5px dashed var(--navy2);color:var(--navy);font-weight:600;font-size:14.5px;width:100%;margin-top:10px;min-height:44px}
.btn:disabled{opacity:.45;cursor:default}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(245,242,236,.96);backdrop-filter:blur(8px);border-top:1px solid var(--gray2);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.nav .row{max-width:560px;margin:0 auto;display:flex;gap:10px}
.saved{font-size:11.5px;color:var(--gray);text-align:center;margin-top:6px;min-height:14px}

.banner{background:var(--gold-soft);border:1px solid var(--gold2);border-radius:14px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;color:var(--text)}
.banner b{color:var(--navy)}
.note{background:var(--navy-soft);border-left:3px solid var(--navy);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px;color:#243a5e}
.ok{background:#EAF4EF;border-left:3px solid var(--green);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px;color:#2b5c47}
.warn{background:#FBECEC;border-left:3px solid var(--red);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px;color:#7a3434}
ul.tips{padding-left:18px;font-size:14.5px;margin-top:8px}
ul.tips li{margin:4px 0}
.summary{margin-top:10px;font-size:14.5px}
.summary div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--gray2)}
.summary div span{flex:0 0 auto}
.summary div b{color:var(--navy);text-align:right}
.center{text-align:center}
.two{display:flex;gap:10px;margin-top:14px}
.two .btn{flex:1;font-size:14px;padding:11px 8px;min-height:46px}
.ver{font-size:11px;color:var(--gray);text-align:center;margin-top:18px}
.hidden{display:none!important}
@media (max-width:380px){ input.money{width:118px} .f label{font-size:14.5px} }
@media (max-width:340px){ input.money{width:104px} .f{gap:8px} .f label{min-width:0;overflow-wrap:anywhere} header{gap:6px} .step-ind{white-space:normal} }   /* v1.7 (m-14): จอ 320px หน้า "รายจ่ายผ่อน / คงที่" กว้างเกินจอ 2px เพราะป้ายขั้นตอนไม่ยอมตัดบรรทัด */
.answered{font-size:13px;color:#2b5c47;background:#EAF4EF;border-radius:10px;padding:8px 12px;margin-top:10px}
.answered a{color:var(--navy)}
.dflt{font-size:12px;color:#8a6a1f;margin-top:4px}
.dflt:empty{display:none}
@media (max-width:420px){ .f.polf{flex-wrap:wrap;row-gap:4px} .f.polf label{flex:1 1 100%} .f.polf .in{margin-left:auto} }   /* v1.7b (AB2-20): การ์ดกรมธรรม์บนจอแคบ — ป้ายเต็มบรรทัด ช่องกรอกขึ้นบรรทัดถัดไป (เดิมป้ายตัด 3–4 บรรทัด) */

/* ── สำเนา PDF (พิมพ์) ── */
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  body{background:#fff;font-size:11pt}
  .wrap,.nav{display:none!important}
  #printArea{display:block;color:#1C1C2E;font-family:var(--thai)}
  .ph{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #002366;padding-bottom:8pt;margin-bottom:10pt}
  .ph .l{display:flex;align-items:center;gap:10pt}
  .ph img{width:44pt;height:44pt}
  .ph .wm{font-size:9pt;font-weight:800;letter-spacing:3pt;color:#002366;text-transform:uppercase}
  .ph .wm small{display:block;font-size:8pt;letter-spacing:1pt;color:#7A7A8C;font-weight:600;text-transform:none}
  .ph .r{text-align:right;font-size:9pt;color:#7A7A8C}
  .ph .r b{display:block;font-size:13pt;color:#002366}
  .pt{font-size:15pt;font-weight:800;color:#002366;margin:0 0 2pt}
  .ps{font-size:9.5pt;color:#7A7A8C;margin-bottom:10pt}
  .pg{page-break-inside:avoid;margin-bottom:9pt}
  .pg h3{font-size:10pt;letter-spacing:1.5pt;text-transform:uppercase;color:#C8A94A;border-bottom:1px solid #E5E1D8;padding-bottom:2pt;margin-bottom:3pt;font-weight:800}
  .pg table{width:100%;border-collapse:collapse;font-size:10pt}
  .pg td{padding:2pt 0;border-bottom:1px dotted #E5E1D8;vertical-align:top}
  .pg td.v{text-align:right;font-weight:600;width:38%}
  .pg table.wide td.v{width:58%}
  .pg table.pol{font-size:9pt}
  .pg table.pol th{text-align:right;font-weight:700;color:#7A7A8C;font-size:8pt;padding:0 0 2pt 4pt;border-bottom:1px solid #E5E1D8}
  .pg table.pol th:first-child,.pg table.pol td:first-child{text-align:left;padding-left:0}
  .pg table.pol td{text-align:right;padding:2pt 0 2pt 4pt;font-weight:600}
  .pg td.u{color:#9B9B9B;font-size:8.5pt;width:15%;padding-left:5pt;white-space:nowrap}   /* v1.7: หน่วยในแถวรวมไม่ตัดบรรทัด ("฿/" ขึ้นบรรทัดใหม่) */
  .pg.flow{page-break-inside:auto}
  .pg.flow tr{page-break-inside:avoid}
  .pg .dn{color:#8a6a1f;font-weight:400;font-size:8.5pt}
  .pbox{border:1px solid #E8D08A;background:#FBF6E6;padding:5pt 7pt;font-size:9pt;margin-bottom:9pt;page-break-inside:avoid}
  .pbox b{color:#002366}
  .pg .empty{color:#9B9B9B;font-style:italic;font-size:9.5pt}
  .pg h3{margin-top:2pt}
  .pg .tot td{border-top:1px solid #002366;border-bottom:0;font-weight:800;color:#002366}
  .cols{display:flex;gap:14pt}
  .cols .pg{flex:1;min-width:0}
  .pf{margin-top:12pt;border-top:1px solid #E5E1D8;padding-top:6pt;font-size:8.5pt;color:#7A7A8C;line-height:1.5}
}
</style>
</head>

/* v1.6: ช่องเงินรับเฉพาะจำนวนเต็มบาท — เดิมลบทุกอย่างที่ไม่ใช่ตัวเลขทิ้ง: พิมพ์ "45000.00" ได้ 4,500,000 · วาง "1,234,567.89" ได้ 123,456,789 · เลขไทยหายทั้งช่อง
   ตอนนี้: จุดทศนิยมและเลขหลังจุดไม่ถูกรับ (พิมพ์) · เลขที่วาง/เติมมาพร้อมทศนิยมถูกปัดเป็นบาท · เลขไทยแปลงเป็นเลขอารบิก */
function thaiDigits(s){ return String(s==null?'':s).replace(/[๐-๙]/g,d=>'๐๑๒๓๔๕๖๗๘๙'.indexOf(d)); }
function moneyClean(v){
  let t=thaiDigits(v).replace(/[,\s฿]/g,'');
  const m=t.match(/^(\d+)\.(\d*)$/);
  if(m) t=m[1];   /* v1.7b (AB2-13): ตัดเศษสตางค์ทิ้งเหมือนตอนพิมพ์ (เดิมวาง "1500.50" ได้ 1,501 แต่พิมพ์ได้ 1,500) */
  return t.replace(/[^\d]/g,'').replace(/^0+(?=\d)/,'').slice(0,12);   /* สูงสุด 12 หลัก (เดิมรับ 20 หลัก ตัวเลขเพี้ยนเพราะเกินความละเอียด) */
}
/* v1.7: ช่องอายุ / จำนวนปี รับเฉพาะจำนวนเต็ม 0–999 — เดิมเป็น type=number: "35.5" ส่งอายุ 35.5 · "-35" กลายเป็น 35 · "1e2" กลายเป็น 12 · ปีเป้าหมาย "-2" กลายเป็น 2
   ตอนนี้สิ่งที่เห็นในช่อง = สิ่งที่ลงไฟล์เสมอ (เลขที่วางมาพร้อมทศนิยมถูกตัดเหลือจำนวนเต็ม) */
/* v1.7b (AB2-15): เดิมตัดเหลือ 3 หลักเงียบ ๆ ("2569" → 256) — ตอนนี้รับได้ 4 หลัก แล้วตรวจช่วงที่ใช้ได้ (ชุดเดียวกับหมอเงิน 2.1) และบอกบนจอเมื่อใช้ไม่ได้ */
function intClean(v){ let t=thaiDigits(v).replace(/[,\s]/g,''); const m=t.match(/^(\d+)\.\d*$/); if(m) t=m[1]; return t.replace(/[^\d]/g,'').slice(0,4); }
const intOf=v=>{ const t=intClean(v); return t?parseInt(t,10):0; };
const blank=v=>String(v==null?'':v).trim()==='';
/* ช่วงที่ใช้ได้ (ตรงกับหมอเงิน 2.1): อายุ / อายุเกษียณ 1–110 · ใช้เงินถึงอายุ 2–120 · อายุลูก 0–60 · อายุผู้ใหญ่/คู่ชีวิต 1–110 · เป้าหมายอีก 0–60 ปี */
const RANGE={age:[1,110,'อายุ'],ret:[1,110,'อายุ'],life:[2,120,'อายุ'],kid:[0,60,'อายุลูก'],adult:[1,110,'อายุ'],yrs:[0,60,'จำนวนปี']};
const inRange=(kind,n)=>n>=RANGE[kind][0]&&n<=RANGE[kind][1];
/* ค่าที่กรอกไว้แต่อยู่นอกช่วง → ข้อความเตือนบนจอ ('' = ว่างหรือใช้ได้) */
function rangeMsg(kind,v){ if(blank(intClean(v))) return ''; const n=intOf(v); if(inRange(kind,n)) return '';
  const R=RANGE[kind]; return '⚠ '+n+' ใช้ไม่ได้ — '+R[2]+'ต้องอยู่ระหว่าง '+R[0]+'–'+R[1]+(kind==='yrs'?' ปี':'')+' · ระบบจะไม่ใช้ค่านี้ (ถือว่ายังไม่ได้กรอก) และบอกที่ปรึกษา'; }
function intInput(id,ph){ return `<input type="text" class="num int" inputmode="numeric" maxlength="4" id="${id}" value="${esc(V[id]||'')}" placeholder="${ph||''}" oninput="onInt(this)" autocomplete="off">`; }
/* v1.7b (AB2-13/14): ตัวอักษรที่ไม่ใช่ตัวเลข (เช่น "-" "e" ".") ถูกตัดทิ้ง — เดิมตัดเงียบ ๆ ("-35" → 35 · "1e2" → 12) ตอนนี้บอกใต้ช่อง */
function flashHint(el,msg){ try{ const row=el.closest('.f')||el.parentNode; let h=row.nextElementSibling;

function badChars(raw,money){ const t=thaiDigits(raw).replace(/[,\s฿]/g,''); return money?/[^\d.]/.test(t):/[^\d]/.test(t.replace(/^(\d+)\.\d*$/,'$1')); }

  return a>e?'อายุเกินช่วงเรียนที่ตั้งไว้ (ถึง '+e+' ปี) — ไม่มีค่าเทอม · ค่าเลี้ยงดูที่กรอกจะนับแค่ปีนี้ ที่ปรึกษาจะถามว่ายังดูแลต่อถึงเมื่อไร':''; }
/* v1.7b (AB2-13): หลังกด "." ตัวเลขที่พิมพ์ต่อ (ส่วนสตางค์) ไม่ถูกรับ — เดิมไม่บอกอะไร และยังบล็อกต่อแม้ย้ายเคอร์เซอร์ไปที่อื่นแล้ว

const isNumField=el=>!!(el&&el.classList&&(el.classList.contains('money')||el.classList.contains('int')));

    if(el._dec && /^[\d๐-๙]$/.test(e.data)){ e.preventDefault(); flashHint(el,'ตัวเลขหลังจุดไม่ถูกรับ (รับเฉพาะจำนวนเต็ม) — ถ้าจะพิมพ์ต่อ ลบหรือคลิกในช่องก่อน'); return; }

function cleanMoney(el){ const rawIn=el.value; const raw=moneyClean(rawIn); el.value=raw?Number(raw).toLocaleString('en-US'):'';
  if(badChars(rawIn,true)) flashHint(el,'ช่องนี้รับเฉพาะตัวเลข (จำนวนเต็มบาท) — เครื่องหมายหรือตัวอักษรอื่น (เช่น - e) ไม่ถูกรับ ตรวจตัวเลขในช่องอีกครั้ง');
  else if(/\.\d*[1-9]/.test(thaiDigits(rawIn))) flashHint(el,'ช่องนี้รับเฉพาะจำนวนเต็มบาท — ตัดสตางค์ (ตัวเลขหลังจุด) ออกแล้ว');
  else if(thaiDigits(rawIn).replace(/\..*$/,'').replace(/[^\d]/g,'').replace(/^0+(?=\d)/,'').length>12) flashHint(el,'ตัวเลขยาวเกิน 12 หลัก — รับไว้แค่ 12 หลักแรก ตรวจอีกครั้ง');

   v1.7: สามสถานะ — กรอกแล้ว N รายการ / ตอบว่าไม่มี (กดปุ่มเอง) / ยังไม่มีรายการที่มียอดเงิน */
const moneyCount=k=>MONEY_SCREENS[k].rows.filter(r=>num(r[0])>0).length;

/* v1.7: อายุของแผน — ที่เดียว ใช้ทั้งไฟล์ หน้าจอ และสำเนา PDF (ตัวเลขจำนวนปีจึงตรงกันทุกที่)
   อายุเกษียณ (ra) = ปีสุดท้ายที่ทำงาน · ปีออม = ra − อายุ + 1 (รวมปีนี้) · ปีที่ใช้เงินเกษียณ = life − ra (อายุ ra+1 … life)
   ไม่ได้กรอก: อายุ 35 · เกษียณ 60 · สิ้นสุดแผน 85 = ค่าตั้งต้นของเครื่องมือ (why บอกว่าเป็นค่าตั้งต้นหรือถูกปรับ) */
/* v1.7b (C2-05): ค่าที่อยู่นอกช่วง (อายุ/อายุเกษียณ 1–110 · ใช้เงินถึง 2–120) ถือว่าไม่ได้กรอก ใช้ค่าตั้งต้น + บอกบนจอและในไฟล์ (เหมือนหมอเงิน 2.1 retAges)
   ageBad/raBad/lifeBad = ตัวเลขที่กรอกแต่ใช้ไม่ได้ (0 = ไม่มี) */
function planAges(){
  const ageIn=intOf(V.cage), raIn=intOf(V.cret), lifeIn=intOf(V.clife);
  const ageBad=(!blank(intClean(V.cage))&&!inRange('age',ageIn))?ageIn:null, raBad=(!blank(intClean(V.cret))&&!inRange('ret',raIn))?raIn:null, lifeBad=(!blank(intClean(V.clife))&&!inRange('life',lifeIn))?lifeIn:null;
  const ageT=ageBad===null?ageIn:0, raT=raBad===null?raIn:0, lifeT=lifeBad===null?lifeIn:0;
  const age=ageT>0?ageT:35;
  let ra, raWhy='';
  if(raT>0){ ra=raT; if(raT<age){ ra=age; raWhy='typedLow'; } }
  else { ra=60; raWhy='default'; if(60<age){ ra=age; raWhy='defaultLow'; } }
  let life, lifeWhy='';
  if(lifeT>0){ life=lifeT; if(lifeT<=ra){ life=ra+1; lifeWhy='typedLow'; } }
  else { life=85; lifeWhy='default'; if(85<=ra){ life=ra+1; lifeWhy='defaultLow'; } }
  /* v1.7b (C2-06): อายุที่ใช้เงินถึงไม่เกินอายุเกษียณ → ไฟล์ตั้ง life = ra+1 ตามกติกา แต่จำนวนปีที่ใช้เงินบนจอ/PDF ขึ้น "—" (ไม่นับ 1 ปีที่ระบบตั้งเอง) เหมือน 2.1 */
  const lifeAdj=(lifeWhy==='typedLow'||lifeWhy==='defaultLow');
  return {ageT,raT,lifeT,ageBad,raBad,lifeBad,age,ra,life,raWhy,lifeWhy,lifeAdj,saveYrs:ra-age+1,useYrs:life-ra};
}
/* จำนวนปีที่ใช้เงินหลังเกษียณ สำหรับแสดงผล — "—" เมื่ออายุขัดกัน */
function useYrsTxt(A){ return A.lifeAdj?'—':String(A.useYrs); }

  if(A.raBad!==null) bad.push('อายุที่ทำงานปีสุดท้ายที่กรอก ('+A.raBad+') ใช้ไม่ได้ — ต้องอยู่ระหว่าง 1–110 ปี');
  if(A.lifeBad!==null) bad.push('อายุที่ใช้เงินถึงที่กรอก ('+A.lifeBad+') ใช้ไม่ได้ — ต้องอยู่ระหว่าง 2–120 ปี');

  if(!A.ageT){ s=badH+'กรอกอายุปัจจุบันก่อน ระบบจึงจะนับจำนวนปีให้ได้';
    if(!A.raT) n.push('ช่อง "ทำงานถึงอายุ" '+(A.raBad!==null?'ใช้ไม่ได้':'ว่าง')+' — ระบบจะใช้ 60 ซึ่งเป็นค่าตั้งต้น และบอกที่ปรึกษาว่าเป็นค่าตั้งต้น');

    if(!A.lifeT) n.push('ช่อง "ใช้เงินถึงอายุ" '+(A.lifeBad!==null?'ใช้ไม่ได้':'ว่าง')+' — ระบบจะใช้ 85 ซึ่งเป็นค่าตั้งต้น และบอกที่ปรึกษาว่าเป็นค่าตั้งต้น');
    return s+(n.length?'<span class="dflt"><br>'+n.join('<br>')+'</span>':''); }
  s=badH+'ออมได้อีก <b>'+A.saveYrs+' ปี</b> (อายุ '+A.age+(A.ra>A.age?'–'+A.ra:'')+' รวมปีนี้) · '+(A.lifeAdj?'ใช้เงินหลังเกษียณ <b>— ปี</b> ('+(A.lifeWhy==='typedLow'?'อายุที่กรอกขัดกัน':'ยังไม่ได้กรอกอายุที่ใช้เงินถึง')+')':'ใช้เงินหลังเกษียณ <b>'+A.useYrs+' ปี</b> (อายุ '+(A.ra+1)+(A.life>A.ra+1?'–'+A.life:'')+')');
  if(A.ageT<15) n.push('อายุ '+A.ageT+' ปี — ตรวจว่าพิมพ์ถูกหรือไม่');
  if(A.raWhy==='default') n.push((A.raBad!==null?'อายุที่ทำงานปีสุดท้ายใช้ไม่ได้':'ยังไม่ได้กรอกอายุที่ทำงานปีสุดท้าย')+' — ใช้ 60 ซึ่งเป็นค่าตั้งต้น และบอกที่ปรึกษาว่าเป็นค่าตั้งต้น');
  if(A.raWhy==='defaultLow') n.push((A.raBad!==null?'อายุที่ทำงานปีสุดท้ายใช้ไม่ได้':'ยังไม่ได้กรอกอายุที่ทำงานปีสุดท้าย')+' และค่าตั้งต้น 60 น้อยกว่าอายุปัจจุบัน — ใช้ '+A.age+' (ปีนี้เป็นปีสุดท้ายที่ทำงาน) ไปก่อน');
  if(A.raWhy==='typedLow') n.push('อายุที่กรอก ('+A.raT+') น้อยกว่าอายุปัจจุบัน — ไฟล์จะใช้ '+A.age+' (ปีนี้เป็นปีสุดท้ายที่ทำงาน) และแจ้งที่ปรึกษาให้ยืนยัน');
  if(A.lifeWhy==='default') n.push((A.lifeBad!==null?'อายุที่ใช้เงินถึงใช้ไม่ได้':'ยังไม่ได้กรอกอายุที่ใช้เงินถึง')+' — ใช้ 85 ซึ่งเป็นค่าตั้งต้น และบอกที่ปรึกษาว่าเป็นค่าตั้งต้น');
  if(A.lifeWhy==='defaultLow') n.push((A.lifeBad!==null?'อายุที่ใช้เงินถึงใช้ไม่ได้':'ยังไม่ได้กรอกอายุที่ใช้เงินถึง')+' และค่าตั้งต้น 85 ไม่เกินอายุเกษียณ — ไฟล์ตั้งเป็น '+A.life+' ไปก่อน (ยังไม่นับจำนวนปีที่ใช้เงิน) กรุณากรอกอายุที่ใช้เงินถึง');
  if(A.lifeWhy==='typedLow') n.push('อายุที่ใช้เงินถึงที่กรอก ('+A.lifeT+') ไม่เกินอายุเกษียณ ('+A.ra+') — ไฟล์จะใช้ '+A.life+' และแจ้งที่ปรึกษาให้ยืนยัน (ยังไม่นับจำนวนปีที่ใช้เงิน)');
  return s+(n.length?'<span class="dflt"><br>'+n.join('<br>')+'</span>':'');

/* v1.7b (AB2-17): แตะปุ่มที่เลือกอยู่ซ้ำ = ยกเลิกการเลือก (กลับเป็น "ไม่ได้ตอบ") — เดิมกดผิดแล้วล้างไม่ได้ */

/* ---------- บันทึกอัตโนมัติ (ในเครื่องลูกค้าเท่านั้น) ---------- */
let saveT=null;
function saveSoon(){ clearTimeout(saveT); saveT=setTimeout(saveNow,300); }
/* v1.7: LAST_SAVE_OK = ผลการบันทึกร่างครั้งล่าสุด (null = ยังไม่เคยลอง) — ข้อความที่บอกว่า "ข้อมูลยังอยู่" อ้างได้เฉพาะเมื่อเป็น true
   ตรวจโดยอ่านกลับแล้วเทียบกับที่เขียน (เดิมดูแค่ว่ามีอะไรอยู่ในที่เก็บ — ร่างเก่าที่ค้างอยู่ก็ผ่าน) */
let LAST_SAVE_OK=null;
/* v1.7b (AB2-04 / NEW_RULES §F): GATE = มีร่างของลูกค้าที่บันทึกไว้ และผู้เปิดยังไม่ได้เลือก "กรอกต่อ" หรือ "เริ่มใหม่" — ระหว่างนี้ไม่แสดงช่องกรอกและไม่เขียนทับร่าง
   FOREIGN = แท็บอื่นบันทึกร่างของลูกค้าอีกคนทับที่เก็บเดียวกัน — หน้านี้หยุดบันทึกร่าง ไม่ให้ข้อมูลสองคนปนกัน */
let GATE=null, FOREIGN=false;
function saveNow(){
  clearTimeout(saveT); saveT=null;
  if(GATE) return;
  if(FOREIGN){ LAST_SAVE_OK=false; $('savedMsg').textContent='หยุดบันทึกร่างแล้ว — มีแท็บอื่นกรอกข้อมูลของอีกคน (ดูข้อความด้านบน)'; return; }
  if(!V._cid && draftHasContent()) V._cid='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);   /* รหัสลูกค้าของร่างนี้ — ใช้แยกร่างของคนละคน */
  try{
    const payload=JSON.stringify({v:VERSION,at:Date.now(),cur,V,KIDS,PARENTS,POLICIES,GOALS,ref:REF});
    localStorage.setItem(LS_KEY, payload);
    LAST_SAVE_OK = localStorage.getItem(LS_KEY)===payload;
    $('savedMsg').textContent = LAST_SAVE_OK ? 'บันทึกร่างในเครื่องนี้แล้ว '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : 'บันทึกร่างในเครื่องไม่สำเร็จ — กรอกให้จบในครั้งเดียว';
  }catch(e){ LAST_SAVE_OK=false; $('savedMsg').textContent='เบราว์เซอร์นี้บันทึกอัตโนมัติไม่ได้ — กรอกให้จบในครั้งเดียว'; }
}
/* v1.7 (m-12): ปิดหน้า / สลับแอป ภายใน 0.3 วินาทีหลังพิมพ์ ค่าล่าสุดเคยหาย — บันทึกทันทีเมื่อหน้าถูกซ่อนหรือปิด */
window.addEventListener('pagehide',()=>{ if(saveT) saveNow(); });
/* v1.7b: อีกแท็บเขียนร่างของลูกค้าคนอื่น (รหัสลูกค้าต่างกัน) หรือล้างร่าง → หน้านี้หยุดบันทึก และบอกผู้ใช้ */
window.addEventListener('storage',e=>{ if(e.key!==LS_KEY || GATE) return;
  let other=null; try{ other=e.newValue?JSON.parse(e.newValue):null; }catch(x){}
  const oc=other&&other.V&&other.V._cid;
  if(e.newValue===null ? draftHasContent() : (oc && V._cid && oc!==V._cid)){
    FOREIGN=true; clearTimeout(saveT); saveT=null; LAST_SAVE_OK=false;
    const who=other&&other.V&&String(other.V.cname||'').trim();
    $('resume').innerHTML='<b>หยุดบันทึกร่างในหน้านี้แล้ว</b> — '+(e.newValue===null?'มีแท็บอื่นล้างข้อมูลที่บันทึกไว้':'มีแท็บอื่นกำลังกรอกข้อมูลของ'+(who?' <b>'+esc(who)+'</b>':'อีกคน'))+' · ข้อมูลบนหน้านี้ยังอยู่บนจอ แต่จะไม่ถูกบันทึกเป็นร่าง — ถ้าจะใช้ข้อมูลหน้านี้ ให้กดบันทึกไฟล์ .json จากหน้าตรวจก่อนส่งก่อนปิด';
    $('resume').classList.remove('hidden'); $('savedMsg').textContent='หยุดบันทึกร่างแล้ว'; }
});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden' && saveT) saveNow(); });
/* เบราว์เซอร์นี้เก็บร่างได้ไหม — ลองเขียน/อ่านจริง (ใช้กับข้อความหน้าแรก) */
function storageWorks(){ try{ const k=LS_KEY+'_t', v=String(Date.now()); localStorage.setItem(k,v); const ok=localStorage.getItem(k)===v; localStorage.removeItem(k); return ok; }catch(e){ return false; } }
/* v1.7b (AB2-08): "ร่างยังเก็บอยู่" จริงหรือไม่ — บันทึกครั้งล่าสุดสำเร็จ หรือ (ยังไม่ได้บันทึกหลังเปิดหน้า) ร่างในที่เก็บตรงกับข้อมูลบนจอทุกช่อง
   เดิมดูแค่ LAST_SAVE_OK ซึ่งเป็น null หลังเปิดหน้าใหม่ → ขึ้นว่า "เก็บร่างไม่ได้" ทั้งที่เพิ่งเปิดร่างมาจากที่เก็บ */
function draftKept(){
  if(FOREIGN) return false;
  if(LAST_SAVE_OK!==null && !saveT) return LAST_SAVE_OK===true;
  try{ const d=JSON.parse(localStorage.getItem(LS_KEY)||'null'); return !!d && JSON.stringify([d.V,d.KIDS,d.PARENTS,d.POLICIES,d.GOALS])===JSON.stringify([V,KIDS,PARENTS,POLICIES,GOALS]); }catch(e){ return false; }
}
function draftHasContent(){
  return Object.keys(V).some(k=>k.charAt(0)!=='_' && !blank(V[k])) || [KIDS,PARENTS,POLICIES,GOALS].some(a=>Array.isArray(a)&&a.length>0);
}
/* v1.7: ร่างที่บันทึกด้วยรุ่นก่อน 1.7 — แปลงครั้งเดียวตอนเปิด */
function migrateDraft(d){
  const ver=String(d.v||'0').split('.').map(n=>parseInt(n,10)||0);
  if(!(ver[0]<1 || (ver[0]===1 && (ver[1]||0)<7))) return;
  /* ดอกเบี้ย / เงินปันผล เดิมกรอกเป็นต่อเดือน → ช่องใหม่เป็นต่อปี: คูณ 12 แล้วแจ้งลูกค้าให้ตรวจ (เก็บยอดเดิมไว้ใน _intOldM) */
  const im=numOf(V.fi_interest);
  if(im>0 && blank(V._intOldM)){ V._intOldM=String(im); V.fi_interest=(im*12).toLocaleString('en-US'); }
  /* ช่องอายุ / จำนวนปี: ตัดให้เป็นจำนวนเต็มแบบเดียวกับช่องใหม่ */
  ['cage','cret','spage'].forEach(k=>{ if(!blank(V[k])) V[k]=intClean(V[k]); });
  /* แนวโรงเรียน / ระดับที่ส่งเรียน: รุ่นเดิมเลือก "เอกชน · ป.ตรี" ให้ล่วงหน้า จึงแยกไม่ออกว่าลูกค้าเลือกเองหรือไม่
     ค่าที่ไม่ใช่ค่าตั้งต้น = ลูกค้าเลือกเองแน่ (true) · ค่าที่ตรงกับค่าตั้งต้น = 'old' (ไม่ทราบ — ให้ลูกค้าแตะยืนยัน ไฟล์เขียนว่าไม่ทราบ) */
  KIDS.forEach(k=>{ if(!k) return; if(!blank(k.age)) k.age=intClean(k.age); if(k.tierSet==null) k.tierSet=(String(k.tier)!=='1')?true:'preset'; if(k.tierSet==='old'){ k.tierSet='preset'; k.tier='1'; } if(k.uptoSet==null) k.uptoSet=(k.upto==='master')?true:'old'; });
  /* บริษัทประกัน: รุ่นเดิมเลือก AIA ให้ล่วงหน้าเมื่อกดเพิ่มกรมธรรม์ — เล่มที่ยังเป็น AIA ติดธงไว้ให้ที่ปรึกษายืนยัน */
  POLICIES.forEach(q=>{ if(q && q.company==='AIA' && q.coOld==null) q.coOld=true; });
  PARENTS.forEach(p=>{ if(p && !blank(p.age)) p.age=intClean(p.age); });
  GOALS.forEach(g=>{ if(g && !blank(g.yrs)) g.yrs=intClean(g.yrs); });
}
function loadSaved(){
  try{ const raw=localStorage.getItem(LS_KEY); if(!raw) return false;
    const d=JSON.parse(raw); if(!d||!d.V) return false;
    if(!REF && d.ref) REF=String(d.ref).slice(0,40);   /* v1.6: เปิดร่างต่อโดยไม่มี ?ref= ในลิงก์ ก็ยังส่งรหัสที่ปรึกษาเดิม */
    V=d.V||{}; KIDS=d.KIDS||[]; PARENTS=d.PARENTS||[]; POLICIES=d.POLICIES||[]; GOALS=d.GOALS||[]; cur=Math.min(d.cur||0,SCREENS.length-1);
    try{ migrateDraft(d); }catch(e){}
    /* v1.7 (m-12): ป้าย "กรอกต่อจากที่ค้างไว้" ขึ้นเฉพาะเมื่อมีข้อมูลที่กรอกไว้จริง (เดิมขึ้นแม้ยังไม่ได้พิมพ์อะไร) */
    if(!draftHasContent()) return true;
    if(!V._cid) V._cid='c'+Number(d.at||0).toString(36)+'o';   /* ร่างรุ่นเก่าไม่มีรหัสลูกค้า — ตั้งจากเวลาที่บันทึก (ทุกแท็บได้รหัสเดียวกัน) */
    /* v1.7b (AB2-04): เดิมเปิดร่างต่อให้อัตโนมัติ (ไปหน้าที่ค้าง พร้อมตัวเลขของคนเดิม) — คนที่สองที่เปิดลิงก์เดียวกันพิมพ์ทับแล้วได้ไฟล์ที่ปนข้อมูลสองคน
       ตอนนี้ต้องเลือกก่อน: กรอกต่อของคนนี้ / เริ่มใหม่ (ล้างทั้งหมด) — ระหว่างนั้นไม่มีช่องให้พิมพ์ */
    GATE={at:d.at||0, cur};
    return true;
  }catch(e){ return false; }
}
function gateWhen(){ const w=new Date(GATE.at||Date.now()); return w.toLocaleDateString('th-TH')+' '+w.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }
function renderGate(){
  const nm=txt('cname'), A=planAges();
  return `<h2>มีข้อมูลที่กรอกค้างไว้ในเครื่องนี้</h2>
  <div class="sub">บันทึกไว้เมื่อ ${esc(gateWhen())}</div>
  <div class="summary"><div><span>ข้อมูลของ</span><b>${nm?esc(nm):'ไม่ได้กรอกชื่อ'}${A.ageT?' · อายุ '+A.ageT+' ปี':''}</b></div></div>
  <div class="note">ถ้า<b>เป็นข้อมูลของคุณ</b> กด "กรอกต่อ" · ถ้า<b>ไม่ใช่ของคุณ</b> (เช่น ใช้เครื่องร่วมกับคนอื่น) กด "เริ่มใหม่" — ข้อมูลเดิมทั้งหมดจะถูกล้าง เพื่อไม่ให้ข้อมูลสองคนปนกันในไฟล์เดียว</div>
  ${!blank(V._intOldM)&&V._intAck!=='1'?`<div class="note">${intNoteText()}</div>`:''}

  <div class="two"><button class="btn ghost" id="gateNew" onclick="gateNew()">ไม่ใช่ของฉัน — ล้างทั้งหมดแล้วเริ่มใหม่</button></div>`;
}
let RESUMED=false;

function gateNew(){ const g=GATE; GATE=null; if(!clearAll()){ GATE=g; render(); } }
/* แถบด้านบนหลังเลือก "กรอกต่อ" — บอกว่ากำลังกรอกของใคร + ทางเริ่มใหม่ (ไม่แสดงในหน้าตรวจก่อนส่ง ซึ่งมีลิงก์ล้างข้อมูลของตัวเองอยู่แล้ว) */

    +(!blank(V._intOldM)&&V._intAck!=='1'?`<span id="intNoteR"><br>${intNoteText()}</span>`:'');
  $('resume').classList.toggle('hidden', SCREENS[cur].id==='done'); }
/* ข้อความแจ้งว่าหน่วยของช่องดอกเบี้ย/ปันผลเปลี่ยน และยอดเดิมถูกแปลงแล้ว (โชว์จนกว่าลูกค้าจะกด "รับทราบ") */
function intNoteText(){ const o=numOf(V._intOldM); return `<b>หน่วยของช่อง "ดอกเบี้ย / เงินปันผล" เปลี่ยนจากต่อเดือนเป็นต่อปี</b> — ยอดที่เคยกรอก ${fmt(o)} ฿/เดือน ระบบคูณ 12 เป็น ${fmt(o*12)} ฿/ปี ให้แล้ว กรุณาตรวจช่องนี้ในหน้ารายรับ`; }
function ackInt(){ V._intAck='1'; saveNow(); ['intNote','intNoteR'].forEach(id=>{ const a=$(id); if(a) a.remove(); }); }
function clearAll(){ const nm=txt('cname'); if(!confirm('ล้างข้อมูลที่กรอกไว้ทั้งหมด'+(nm?' (ของ '+nm+')':'')+' แล้วเริ่มใหม่?')) return false; clearTimeout(saveT); saveT=null; LAST_SAVE_OK=null; RESUMED=false;
  /* v1.7b: ถ้าแท็บอื่นกำลังใช้ที่เก็บร่างกับลูกค้าอีกคน (FOREIGN) ไม่ลบร่างของแท็บนั้น และหน้านี้ยังไม่บันทึกร่างต่อ */
  let gone=true; if(FOREIGN) gone='foreign'; else { try{ localStorage.removeItem(LS_KEY); gone=(localStorage.getItem(LS_KEY)===null); }catch(e){ gone=null; } }
  V={};KIDS=[];PARENTS=[];POLICIES=[];GOALS=[];cur=0; $('resume').classList.add('hidden');

  try{ $('savedMsg').textContent=gone===true?'':gone==='foreign'?'ล้างหน้าจอแล้ว · ไม่ได้ลบร่างของแท็บอื่น และหน้านี้ยังไม่บันทึกร่าง (มีแท็บอื่นใช้อยู่)':gone===false?'ล้างหน้าจอแล้ว แต่ลบร่างที่เก็บในเบราว์เซอร์นี้ไม่สำเร็จ':'ล้างหน้าจอแล้ว · เบราว์เซอร์นี้ไม่ให้เข้าถึงที่เก็บร่าง จึงตรวจไม่ได้ว่ามีร่างเก่าค้างอยู่หรือไม่'; }catch(e){} render(); return true; }

/* ---------- ตรวจว่าอยู่ใน browser ในแอป (LINE/Facebook) ---------- */
function inAppBrowser(){ const ua=navigator.userAgent||''; return /Line\//i.test(ua)?'LINE':/FBAN|FBAV|FB_IAB/i.test(ua)?'Facebook':/Instagram/i.test(ua)?'Instagram':''; }

/* ═══════════════ RENDER ═══════════════ */
function render(keepScroll){
  /* v1.6: กดตัวเลือก/เพิ่ม/ลบรายการ ไม่เด้งกลับบนสุดของหน้า (เดิมเด้งทุกครั้ง — บนมือถือปุ่มที่เพิ่งกดหลุดจอ) · เปลี่ยนหน้าเท่านั้นที่ขึ้นบนสุด */
  const _y=window.scrollY||0;
  if(GATE){ $('stepInd').innerHTML=''; $('steps').innerHTML=''; $('screen').innerHTML=renderGate(); $('navRow').innerHTML=''; $('resume').classList.add('hidden'); $('inapp').classList.add('hidden'); window.scrollTo({top:0,behavior:'instant'}); return; }

  $('stepInd').innerHTML = stepNo?`<b>${stepNo}</b> / ${N_STEPS} · ${S.n}`:(cur===0?'':'ตรวจก่อนส่ง');
  $('steps').innerHTML = Array.from({length:N_STEPS},(_,i)=>{ const st=scrState(SCREENS[i+1]);
    return `<div class="step ${i+1===cur?'cur':i+1<cur?(st==='empty'?'skip':'on'):''}" title="${esc(SCREENS[i+1].n)}: ${st==='filled'?'มีข้อมูลแล้ว':st==='none'?'ตอบว่าไม่มี':'ยังไม่มีข้อมูล'}"></div>`; }).join('');

  if(S.id==='intro') h=renderIntro();
  else if(S.id==='me') h=renderMe();
  else if(S.id==='family') h=renderFamily();
  else if(S.money) h=renderMoney(S.money);

  /* nav */

  else nav=`<button class="btn ghost" onclick="go(-1)">ย้อนกลับ</button><button class="btn primary" onclick="go(1)">${cur===N_STEPS?'ไปหน้าสรุป':'ถัดไป'}</button>`;
  $('navRow').innerHTML=nav;
  if(RESUMED) showResumeBar();
  window.scrollTo({top:(keepScroll?_y:0),behavior:'instant'});
  const ia=inAppBrowser();
  /* v1.6: เตือนตั้งแต่หน้าแรก และไม่สัญญาว่าข้อมูลจะตามไปเบราว์เซอร์อื่น (ข้อมูลที่กรอกเก็บอยู่ในเบราว์เซอร์ที่ใช้กรอกเท่านั้น) */
  if(ia && (S.id==='intro'||S.id==='done')){ $('inapp').innerHTML=(S.id==='intro'
      ? `<b>คุณกำลังเปิดจากแอป ${ia}</b> — การบันทึกไฟล์ในแอปนี้อาจไม่ทำงาน แนะนำให้เปิดในเบราว์เซอร์ก่อนเริ่มกรอก: กดเมนู ⋯ มุมขวาบน แล้วเลือก "เปิดในเบราว์เซอร์" (Safari/Chrome) · ข้อมูลที่กรอกในแอปนี้จะไม่ตามไปเบราว์เซอร์อื่น`
      : `<b>คุณกำลังเปิดจากแอป ${ia}</b> — การบันทึกไฟล์อาจไม่ทำงาน ลองกดบันทึกก่อน ถ้าไม่ได้ไฟล์ ${draftKept()?'ร่างที่กรอกยังเก็บอยู่ในแอปนี้ แต่จะไม่ตามไปเบราว์เซอร์อื่น':(storageWorks()&&!FOREIGN?'ร่างที่กรอกล่าสุดยังไม่ได้ถูกเก็บในแอปนี้ — อย่าปิดหน้านี้':'แอปนี้เก็บร่างที่กรอกไม่ได้ — อย่าปิดหน้านี้')} — แจ้งที่ปรึกษาเพื่อหาทางส่งข้อมูล`);   /* v1.7: บอกว่า "ยังอยู่" เฉพาะเมื่อบันทึกร่างครั้งล่าสุดสำเร็จจริง */

function go(d){ cur=Math.max(0,Math.min(SCREENS.length-1,cur+d)); saveNow(); render(); }
/* v1.3: ถ้าหน้านี้มีตัวเลขกรอกไว้แล้ว ถามก่อนล้าง — เดิมกด "ไม่มีรายการ — ข้ามไป" แล้วตัวเลขที่กรอกไว้หายเงียบ ๆ */
/* v1.7: ปุ่มนี้เดิมทำงานเหมือน "ถัดไป" ทุกอย่าง (ซ้ำกัน) และไฟล์แยกไม่ออกว่า "ไม่มี" หรือ "ข้าม"
   ตอนนี้ = คำตอบ "ไม่มีรายการในหน้านี้" ที่ถูกบันทึกจริง (V.none_<หน้า>) → หน้าสรุป สำเนา PDF และโน้ตในไฟล์บอกได้ว่าลูกค้าตอบเอง
   ส่วน "ถัดไป" = ไปต่อโดยไม่ได้ตอบ (ถ้าหน้าว่าง ไฟล์จะบอกว่า "ไม่ได้กรอก") */
function skipScreen(key){
  const rows=MONEY_SCREENS[key].rows;
  const n=rows.filter(r=>num(r[0])>0).length;
  if(n>0 && !confirm('หน้านี้มีตัวเลขที่กรอกไว้แล้ว '+n+' รายการ\n\nกด OK = ล้างตัวเลขในหน้านี้ แล้วบันทึกว่า "ไม่มี"\nกด Cancel = เก็บตัวเลขไว้ (แล้วกด "ถัดไป" แทน)')) return;
  rows.forEach(r=>{ V[r[0]]=''; }); V['none_'+key]='1'; go(1); }
const skipBtn=key=>`<button class="btn soft" onclick="skipScreen('${key}')">ไม่มีรายการในหน้านี้ — บันทึกว่า "ไม่มี" แล้วไปต่อ</button>`;
function unNone(key){ delete V['none_'+key]; saveNow(); render(true); }
function noIns(){ POLICIES=POLICIES.filter(polFilled); if(POLICIES.length) { render(true); return; } V.none_ins='1'; go(1); }
function addPolicy(){ delete V.none_ins; POLICIES.push({company:'',name:'',premium:'',payUntil:'',life:'',health:'',room:'',ciSevere:'',accMed:'',cash:''}); saveSoon(); render(true); }
/* สถานะของแต่ละหน้า: 'filled' = มีข้อมูลที่ลูกค้ากรอก/เลือก · 'none' = ลูกค้ากดตอบว่าไม่มี · 'empty' = ยังไม่มีอะไร (ใช้กับแถบขั้นตอน หน้าสรุป สำเนา PDF) */
function scrState(S){
  if(!S) return 'empty';
  if(S.money) return moneyCount(S.money)>0?'filled':(V['none_'+S.money]==='1'?'none':'empty');
  if(S.id==='me') return ['cname','cage','cret','clife','cretexp','chosp','chospname','cjob'].some(k=>!blank(V[k]))?'filled':'empty';
  if(S.id==='family') return ['cmar','nkids','npar'].some(k=>!blank(V[k]))?'filled':'empty';
  if(S.id==='ins') return (POLICIES.some(polFilled)||!blank(V.welf))?'filled':(V.none_ins==='1'?'none':'empty');
  if(S.id==='goals') return (GOALS.some(goalTouched)||!blank(V.cfocus)||!blank(V.cnote))?'filled':'empty';
  return 'empty';
}
const goalTouched=g=>!!g && (!blank(g.name)||!blank(g.amt)||!blank(g.yrs)||!blank(g.ico));

    ${sv?`<li>ระบบ<b>บันทึกร่างอัตโนมัติในเบราว์เซอร์นี้ของเครื่องคุณ</b> ปิดแล้วกลับมากรอกต่อได้ เมื่อเปิดลิงก์เดิมด้วยเบราว์เซอร์เดิมบนเครื่องเดิม</li>`
        :`<li><b>เบราว์เซอร์นี้บันทึกร่างอัตโนมัติไม่ได้</b> — ต้องกรอกให้จบในครั้งเดียว (หรือเปิดลิงก์ใน Safari / Chrome แบบปกติ)</li>`}

        <div class="chips">${[['0','รัฐ'],['1','เอกชน'],['2','นานาชาติ']].map(([v,l])=>`<button type="button" class="chip ${tierOn(k)&&k.tier===v?'on':''}" onclick="kidChip(${i},'tier','${v}')">${l}</button>`).join('')}</div>

      <div class="f stack"><label>ตั้งใจส่งเรียนถึง</label>

      <div class="f"><label>ค่าเลี้ยงดูลูกคนนี้<small>กิน ใช้ กิจกรรม — ไม่รวมค่าเทอม · ยอดนี้ไม่ต้องใส่ซ้ำในหน้ารายจ่าย</small></label><div class="in"><input type="text" class="money" inputmode="numeric" value="${esc(k.mon)}" oninput="onMoneyItem(this,KIDS,${i},'mon')" placeholder="0"><span class="unit">฿/เดือน</span></div></div>

  h+=`<div class="sec"><div class="sec-h">พ่อแม่ / ผู้ใหญ่ที่ต้องดูแล</div>${chips('npar',[['0','ไม่มี'],['1','1 คน'],['2','2 คน'],['3','3 คน'],['4','4 คน']],true)}</div>`;

      <div class="f"><label>ส่งให้ / จ่ายให้เดือนละ<small>ยอดนี้ไม่ต้องใส่ซ้ำในหน้ารายจ่าย</small></label><div class="in"><input type="text" class="money" inputmode="numeric" value="${esc(p.mon)}" oninput="onMoneyItem(this,PARENTS,${i},'mon')" placeholder="0"><span class="unit">฿/เดือน</span></div></div>

/* แนวโรงเรียนที่ใช้ได้: ลูกค้าเลือกเอง หรือฟอร์มเลือกไว้ให้ก่อน (v1.7c) */
function tierOn(k){ return !!k && (k.tierSet===true || k.tierSet==='preset'); }
function kidChip(i,key,v){ const k=KIDS[i]; const setK=key+'Set';
  if((k[setK]===true||k[setK]==='preset') && k[key]===v){ k[setK]=false; k[key]=(key==='tier'?'1':'bachelor'); }   /* แตะซ้ำ = ยกเลิก (AB2-17) */
  else { k[key]=v; k[setK]=true; }
  saveSoon(); render(true); }
/* ลบลูก/ผู้ใหญ่คนที่ i (ตัวกลางก็ได้) แล้วลดจำนวนลง 1 */
function removeKid(i){ const k=KIDS[i]||{}; const nm=(k.name||'').trim();
  if((nm||!blank(k.age)||!blank(k.mon)) && !confirm('ลบ "ลูกคนที่ '+(i+1)+(nm?' ('+nm+')':'')+'" และข้อมูลที่กรอกของคนนี้?')) return;
  KIDS.splice(i,1); const n=Math.max(0,(parseInt(V.nkids||'0')||0)-1); V.nkids=String(n); saveSoon(); render(true); }
function removeParent(i){ const p=PARENTS[i]||{}; const nm=(p.name||'').trim();
  if((nm||!blank(p.age)||!blank(p.mon)) && !confirm('ลบ "'+(nm||'ผู้ใหญ่คนที่ '+(i+1))+'" และข้อมูลที่กรอกของคนนี้?')) return;
  PARENTS.splice(i,1); const n=Math.max(0,(parseInt(V.npar||'0')||0)-1); V.npar=String(n); saveSoon(); render(true); }
function renderMoney(key){
  const M=MONEY_SCREENS[key];
  let h=`<h2>${M.title}</h2><div class="sub">${M.sub}</div>`;

  if(key==='income' && !blank(V._intOldM) && V._intAck!=='1') h+=`<div class="note" id="intNote">${intNoteText()} &nbsp;<a href="#" onclick="ackInt();return false" style="color:var(--navy);font-weight:700">รับทราบ</a></div>`;
  h+=M.rows.map(r=>`<div class="f"><label>${r[1]}${r[4]?`<small>${r[4]}</small>`:''}</label><div class="in">${moneyInput(r[0])}<span class="unit">${UNIT[r[2]]}</span></div></div>`).join('');
  h+=`<div class="hint" id="tot_${key}">${totText(key)}</div>`;
  if(key!=='income'){
    if(V['none_'+key]==='1' && moneyCount(key)===0) h+=`<div class="answered" id="ans_${key}">คุณตอบไว้ว่า <b>ไม่มีรายการในหน้านี้</b> &nbsp;·&nbsp; <a href="#" onclick="unNone('${key}');return false">ยกเลิกคำตอบนี้</a></div>`;
    else h+=skipBtn(key);
  }
  return h;
}

const GOAL_PRESETS=[['🏠','ซื้อบ้าน'],['🚗','ซื้อรถ'],['✈️','ท่องเที่ยวใหญ่'],['💍','แต่งงาน'],['🏢','เริ่มธุรกิจ'],['🎯','อื่น ๆ']];
/* v1.7 (m-13): ชื่อที่ลูกค้าพิมพ์เอง = ชื่อที่ไม่ว่างและไม่ใช่ชื่อของปุ่ม — ดูจากชื่อจริง ไม่ใช้ธง custom ที่ค้างหลังลบชื่อ
   กดปุ่มที่เลือกอยู่ซ้ำ = ยกเลิกการเลือก · เป้าหมายใหม่ไม่มีปุ่มไหนถูกเลือกไว้ก่อน (เดิม "อื่น ๆ" ติดสีตั้งแต่กดเพิ่ม) */
function goalChip(i,ico){ const g=GOALS[i]; if(!g) return;
  const isPreset=n=>GOAL_PRESETS.some(p=>p[1]===String(n||'').trim());
  const typed=!blank(g.name) && !isPreset(g.name);
  if(g.ico===ico){ g.ico=''; if(!typed) g.name=''; }
  else { g.ico=ico; if(!typed) g.name=GOAL_PRESETS.find(p=>p[0]===ico)[1]; }
  delete g.custom; saveSoon(); render(true); }

/* v1.7: ค่าตั้งต้นที่ไฟล์จะใช้แทนช่องที่ลูกค้ายังไม่ได้กรอก/เลือก — แสดงให้ลูกค้าเห็นก่อนส่ง (หน้าสรุป + สำเนา PDF ใช้รายการเดียวกัน)
   ทุกข้อมีโน้ตคู่กันในไฟล์ให้ที่ปรึกษา (ดู buildClientFile) */
function defaultsUsed(){
  const A=planAges(), d=[];
  const bd=(b,t)=>b!==null?' (ที่กรอก '+b+' ใช้ไม่ได้ — รับ '+t+')':'';
  if(!A.ageT) d.push('อายุปัจจุบัน — ใช้ 35 ปี'+bd(A.ageBad,'1–110'));
  if(A.raWhy==='default') d.push('ทำงานถึงอายุ — ใช้ 60 ปี'+bd(A.raBad,'1–110'));
  if(A.raWhy==='defaultLow') d.push('ทำงานถึงอายุ — ค่าตั้งต้น 60 น้อยกว่าอายุปัจจุบัน จึงใช้ '+A.ra+' ปี (ปีนี้เป็นปีสุดท้ายที่ทำงาน)'+bd(A.raBad,'1–110'));
  if(A.raWhy==='typedLow') d.push('ทำงานถึงอายุ — คุณกรอก '+A.raT+' ซึ่งน้อยกว่า'+(A.ageT?'อายุปัจจุบัน':'อายุตั้งต้น 35 (ยังไม่ได้กรอกอายุ)')+' จึงใช้ '+A.ra+' ปี (ปีนี้เป็นปีสุดท้ายที่ทำงาน)');
  if(A.lifeWhy==='default') d.push('ใช้เงินถึงอายุ — ใช้ 85 ปี'+bd(A.lifeBad,'2–120'));
  if(A.lifeWhy==='defaultLow') d.push('ใช้เงินถึงอายุ — ค่าตั้งต้น 85 ไม่เกินอายุเกษียณ จึงใช้ '+A.life+' ปี (ยังไม่นับจำนวนปีที่ใช้เงิน)'+bd(A.lifeBad,'2–120'));
  if(A.lifeWhy==='typedLow') d.push('ใช้เงินถึงอายุ — คุณกรอก '+A.lifeT+' ซึ่งไม่เกินอายุเกษียณ จึงใช้ '+A.life+' ปี (ยังไม่นับจำนวนปีที่ใช้เงิน)');
  if(V.cmar==='married' && V.spinc==='no' && !spAge()) d.push('อายุคู่ชีวิต — ใช้อายุเท่าคุณ ('+A.age+' ปี)'+(spBad()?' (ที่กรอก '+intOf(V.spage)+' ใช้ไม่ได้ — รับ 1–110)':''));
  const nk=parseInt(V.nkids||'0')||0, np=parseInt(V.npar||'0')||0;
  for(let i=0;i<nk;i++){ const k=KIDS[i]||{}; const t=[]; const tierOK=tierOn(k); if(k.tierSet==='preset') t.push('แนวโรงเรียน "เอกชน" — ฟอร์มเลือกไว้ให้ก่อน คุณยังไม่ได้เปลี่ยน');
    if(!kidAgeOK(k)) t.push((blank(intClean(k.age))?'ไม่ได้กรอกอายุ':'อายุที่กรอก ('+intOf(k.age)+') ใช้ไม่ได้ — รับ 0–60')+(tierOK?' จึงคิดค่าเทอมครบทุกชั้นเหมือนอายุ 0':' จึงใช้อายุ 0'));
    else if(intOf(k.age)>kidEnd(k)) t.push('อายุ '+intOf(k.age)+' เกินช่วงเรียน (ถึง '+kidEnd(k)+') — ไม่มีค่าเทอม และนับการดูแลถึงอายุ '+intOf(k.age)+' (ปีนี้) ไปก่อน');
    if(tierOK && k.uptoSet!==true) t.push(k.uptoSet==='old'?'ส่งเรียนถึง "ป.ตรี" มาจากร่างเดิม ยังไม่ได้ยืนยันว่าคุณเลือกเอง — คิดถึง ป.ตรี':'ไม่ได้เลือกส่งเรียนถึง — คิดค่าเทอมถึง ป.ตรี (ยังไม่รวม ป.โท)');
    if(t.length) d.push('ลูกคนที่ '+(i+1)+' — '+t.join(' · ')); }
  for(let i=0;i<np;i++){ const p=PARENTS[i]||{}; if(!(!blank(intClean(p.age))&&inRange('adult',intOf(p.age)))) d.push('ผู้ใหญ่ที่ดูแลคนที่ '+(i+1)+' — '+(blank(intClean(p.age))?'ไม่ได้กรอกอายุ':'อายุที่กรอก ('+intOf(p.age)+') ใช้ไม่ได้ — รับ 1–110 ·')+' ใช้ 65 ปี'); }
  GOALS.forEach(g=>{ if(!(numOf(g.amt)>0)) return; const bad=!blank(intClean(g.yrs))&&!inRange('yrs',intOf(g.yrs));
    if(blank(intClean(g.yrs))||bad) d.push('เป้าหมาย "'+((g.name||'').trim()||'เป้าหมายอื่น ๆ')+'" — '+(bad?'"อีก '+intOf(g.yrs)+' ปี" ใช้ไม่ได้ (รับ 0–60 ปี)':'ไม่ได้ระบุว่าอีกกี่ปี')+' ใช้ 5 ปี'); });
  return d;
}
/* v1.7b (C2-01): สิ่งที่ "ไม่ได้ใส่ในไฟล์" เพราะลูกค้ายังไม่ได้เลือก (ไม่ใช่ค่าตั้งต้น) — ตอนนี้คือค่าเทอมของลูกที่ยังไม่ได้เลือกแนวโรงเรียน */
function notIncluded(){ const nk=parseInt(V.nkids||'0')||0, out=[];
  for(let i=0;i<nk;i++){ const k=KIDS[i]||{}; if(tierOn(k)) continue; const kn=(k.name||'').trim();
    out.push('ค่าเทอมของลูกคนที่ '+(i+1)+(kn?' ('+kn+')':'')+' — '+(k.tierSet==='old'?'ร่างเดิมมี "เอกชน" ที่ฟอร์มรุ่นก่อนเลือกให้ล่วงหน้า ยังไม่ได้ยืนยัน':'ยังไม่ได้เลือกแนวโรงเรียน')); }
  return out; }
/* สถานะของหมวด: N รายการ / ตอบว่าไม่มี / ไม่ได้กรอก — ใช้ทั้งหน้าสรุปและสำเนา PDF */
function secStatus(key){ const n=moneyCount(key); return n>0?n+' รายการ':(V['none_'+key]==='1'?'ตอบว่าไม่มี':'ไม่ได้กรอก'); }
function famStatus(){ const nk=parseInt(V.nkids||'0')||0, np=parseInt(V.npar||'0')||0;
  return [ V.cmar==='married'?'มีคู่':V.cmar==='single'?'โสด':'สถานะ: ไม่ได้ตอบ',
    blank(V.nkids)?'ลูก: ไม่ได้ตอบ':(nk?'ลูก '+nk+' คน':'ไม่มีลูก'),
    blank(V.npar)?'ผู้ใหญ่ที่ต้องดูแล: ไม่ได้ตอบ':(np?'ดูแลผู้ใหญ่ '+np+' คน':'ไม่มีผู้ใหญ่ที่ต้องดูแล') ].join(' · '); }

/* ---------- หน้าสรุป + ส่ง ---------- */
function renderDone(){
  /* v1.7: ทุกบรรทัดบอกตามจริง — "โสด" เฉพาะเมื่อลูกค้าเลือกโสด · หมวดที่ว่างแยกเป็น "ตอบว่าไม่มี" กับ "ไม่ได้กรอก" · ค่าตั้งต้นขึ้นรายการให้เห็น
     เดิม: ไม่ได้ตอบสถานะ ขึ้น "โสด" · ไม่ได้กรอกอะไรเลยก็ขึ้น "0 รายการ" เหมือนตอบแล้ว · "ที่ปรึกษาจะได้รับข้อมูลชุดนี้" ทั้งที่ระบบไม่ได้ส่ง */
  const A=planAges();
  const name=txt('cname')||'ยังไม่ได้กรอกชื่อ';
  const missing=[];
  if(!txt('cname')) missing.push('ชื่อ'); if(!A.ageT) missing.push('อายุ');
  const polN=POLICIES.filter(polFilled).length;
  const gl=GOALS.filter(g=>numOf(g.amt)>0).length, glNo=GOALS.filter(g=>!(numOf(g.amt)>0)&&goalTouched(g)).length;
  const dfl=defaultsUsed();
  const mark=w=>!w?'':(/^typed/.test(w)?' (ปรับจากที่กรอก)':' (ค่าตั้งต้น)');
  return `<h2>ตรวจก่อนส่ง</h2><div class="sub">ข้อมูลชุดนี้จะอยู่ในไฟล์ที่คุณบันทึก — ที่ปรึกษาจะได้รับก็ต่อเมื่อคุณส่งไฟล์ให้</div>
  <div class="summary">
    <div><span>ชื่อ</span><b>${esc(name)}${A.ageT?' · '+A.ageT+' ปี':' · ไม่ได้กรอกอายุ'}</b></div>
    <div><span>แผน</span><b>ทำงานถึงอายุ ${A.ra}${mark(A.raWhy)} · ใช้เงินถึงอายุ ${A.life}${mark(A.lifeWhy)}${A.ageT?' · ออม '+A.saveYrs+' ปี · ใช้เงินหลังเกษียณ '+useYrsTxt(A)+' ปี'+(A.lifeAdj?(A.lifeWhy==='typedLow'?' (อายุที่กรอกขัดกัน)':' (ยังนับไม่ได้ — ยังไม่ได้กรอกอายุที่ใช้เงินถึง)'):''):''}</b></div>
    <div><span>ครอบครัว</span><b>${famStatus()}</b></div>
    <div><span>รายรับ</span><b>${moneyCount('income')?moneyCount('income')+' รายการ':'ไม่ได้กรอก'}</b></div>
    <div><span>รายจ่ายผ่อน / คงที่</span><b>${secStatus('fixed')}</b></div>
    <div><span>รายจ่ายใช้ชีวิต</span><b>${secStatus('vary')}</b></div>
    <div><span>เงินออม</span><b>${secStatus('save')}</b></div>
    <div><span>ทรัพย์สิน</span><b>${secStatus('assets')}</b></div>
    <div><span>หนี้คงค้าง</span><b>${secStatus('liab')}</b></div>
    <div><span>กรมธรรม์</span><b>${polN?polN+' เล่ม':(V.none_ins==='1'?'ตอบว่าไม่มี':'ไม่ได้กรอก')}</b></div>
    <div><span>เป้าหมาย</span><b>${gl?gl+' รายการ':(glNo?'':'ไม่ได้กรอก')}${glNo?(gl?' · ':'')+'ยังไม่ใส่ยอดเงิน '+glNo+' รายการ (ยังไม่เข้าแผน)':''}</b></div>
  </div>
  ${missing.length?`<div class="warn">ยังไม่ได้กรอก: ${missing.join(', ')} — บันทึกไฟล์ได้ แต่ที่ปรึกษาจะต้องถามเพิ่ม <a href="#" onclick="cur=1;render();return false" style="color:var(--navy)">กลับไปกรอก</a></div>`:''}
  ${!blank(V._intOldM)&&V._intAck!=='1'?`<div class="note" id="intNote">${intNoteText()} &nbsp;<a href="#" onclick="ackInt();return false" style="color:var(--navy);font-weight:700">รับทราบ</a></div>`:''}
  ${notIncluded().length?`<div class="warn" id="noIncBox"><b>ยังไม่ได้ใส่ในไฟล์ (ที่ปรึกษาจะถามเพิ่ม)</b><br>${notIncluded().map(x=>'• '+esc(x)).join('<br>')} <a href="#" onclick="cur=2;render();return false" style="color:var(--navy)">กลับไปเลือก</a></div>`:''}
  ${dfl.length?`<div class="note" id="dfltBox"><b>ช่องที่คุณยังไม่ได้กรอก — ไฟล์จะใช้ค่าตั้งต้นของระบบแทน และบอกที่ปรึกษาว่าเป็นค่าตั้งต้น ไม่ใช่คำตอบของคุณ</b><br>${dfl.map(x=>'• '+esc(x)).join('<br>')}</div>`:''}
  <div class="note"><b>มี 2 อย่างให้บันทึก</b><br>1. <b>ไฟล์ข้อมูล .json</b> — ไฟล์ชื่อ <b>${esc(fileName())}</b> · คุณเป็นคนส่งให้ที่ปรึกษาเองตามช่องทางที่สะดวก ระบบไม่ส่งอะไรออกจากเครื่องคุณ<br>2. <b>สำเนา PDF</b> — ไว้เก็บเองหรืออ่านทบทวน (ที่ปรึกษานำเข้าระบบจาก PDF ไม่ได้ ต้องใช้ .json)</div>
  <div id="sendStatus"></div>
  <div class="two"><button class="btn ghost" onclick="savePdf()">บันทึกสำเนา PDF ให้ตัวเอง</button></div>
  <div class="hint center" style="margin-top:14px"><a href="#" id="restartLink" onclick="clearAll();return false" style="color:var(--gray)">ล้างข้อมูลทั้งหมดแล้วเริ่มใหม่</a></div>`;
}

/* ═══════════════ สำเนา PDF สำหรับลูกค้า (window.print → บันทึกเป็น PDF) ═══════════════ */
function renderPrint(){
  /* v1.7: สำเนา PDF ใช้ตัวเลขชุดเดียวกับไฟล์ (planAges · payAgeOf) · ช่องที่ไม่ได้กรอกเขียนว่า "ไม่ได้กรอก/ไม่ได้ตอบ" · ค่าตั้งต้นติดป้าย
     หมวดว่างแยก "ไม่มี (ผู้กรอกตอบว่าไม่มี)" กับ "ไม่ได้กรอก" (เดิมรวมเป็น "ไม่ได้กรอก / ไม่มี") */
  const A=planAges();
  const name=txt('cname')||'ยังไม่ได้กรอกชื่อ';
  const d=new Date(); const dateTh=d.toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'});
  const row=(l,v,u)=>`<tr><td>${esc(l)}</td><td class="v">${v}</td><td class="u">${u||''}</td></tr>`;
  const dn=t=>` <span class="dn">(${t})</span>`;
  const moneyGrp=(key)=>{ const M=MONEY_SCREENS[key]; const rows=M.rows.filter(r=>num(r[0])>0);
    if(!rows.length) return `<div class="pg"><h3>${M.title}</h3><div class="empty">${V['none_'+key]==='1'?'ไม่มี (ผู้กรอกตอบว่าไม่มี)':'ไม่ได้กรอก'}</div></div>`;
    const totM=rows.filter(r=>r[3]!=='special.pension').reduce((t,r)=>t+(r[2]==='y'?num(r[0])/12:num(r[0])),0);   /* v1.6: ยอดรวมวันนี้ ไม่รวมรายได้หลังเกษียณ */
    const totX=rows.reduce((t,r)=>t+num(r[0]),0);
    const tot=(key==='assets'||key==='liab')?row('รวม',fmt(Math.round(totX)),'฿'):row(key==='income'&&rows.some(r=>r[3]==='special.pension')?'รวมต่อเดือนวันนี้ (รายปี ÷ 12 · ไม่รวมรายได้หลังเกษียณ)':'รวมต่อเดือน (รายปี ÷ 12)',fmt(Math.round(totM)),'฿/เดือน');
    return `<div class="pg"><h3>${M.title}</h3><table>${rows.map(r=>row(r[1],fmt(num(r[0])),UNIT[r[2]])).join('')}<tr class="tot">${tot.replace(/^<tr>|<\/tr>$/g,'')}</tr></table></div>`; };
  const HOSP={gov:'รพ.รัฐ',mid:'เอกชนกลาง',hi:'เอกชนหรู'};
  const JOB={emp:'พนักงานบริษัท',gov:'ราชการ / รัฐวิสาหกิจ',own:'ธุรกิจส่วนตัว',free:'ฟรีแลนซ์',other:'อื่น ๆ'};
  const FOC={retire:'เกษียณ',protect:'คุ้มครองครอบครัว',debt:'จัดการหนี้',invest:'ลงทุน / ต่อยอด',edu:'ทุนการศึกษาลูก',tax:'ภาษี',all:'ดูภาพรวมทั้งหมด'};
  const raNote=A.raWhy==='default'?dn('ค่าตั้งต้น — ไม่ได้กรอก'):A.raWhy==='defaultLow'?dn('ไม่ได้กรอก · ค่าตั้งต้น 60 น้อยกว่าอายุปัจจุบัน'):A.raWhy==='typedLow'?dn('กรอก '+A.raT+' ซึ่งน้อยกว่าอายุปัจจุบัน'):'';
  const lifeNote=A.lifeWhy==='default'?dn('ค่าตั้งต้น — ไม่ได้กรอก'):A.lifeWhy==='defaultLow'?dn('ไม่ได้กรอก · ค่าตั้งต้น 85 ไม่เกินอายุเกษียณ'):A.lifeWhy==='typedLow'?dn('กรอก '+A.lifeT+' ซึ่งไม่เกินอายุเกษียณ'):'';
  let me=`<div class="pg"><h3>ข้อมูลตัวเอง</h3><table>
    ${row('ชื่อ',esc(name))}${A.ageT?row('อายุ',A.ageT,'ปี'):row('อายุ',(A.ageBad!==null?'ที่กรอก ('+A.ageBad+') ใช้ไม่ได้':'ไม่ได้กรอก')+dn('ไฟล์ใช้ 35 เป็นค่าตั้งต้น'))}
    ${row('ทำงานถึงอายุ (ปีสุดท้ายที่ทำงาน)',A.ra+raNote,'ปี')}${row('ใช้เงินถึงอายุ',A.life+lifeNote,'ปี')}
    ${A.ageT?row('เวลาออมก่อนเกษียณ (รวมปีนี้)',A.saveYrs,'ปี')+row('ช่วงใช้เงินหลังเกษียณ',useYrsTxt(A)+(A.lifeAdj?dn(A.lifeWhy==='typedLow'?'อายุที่กรอกขัดกัน':'ยังไม่ได้กรอกอายุที่ใช้เงินถึง'):''),'ปี'):''}
    ${num('cretexp')?row('เงินใช้หลังเกษียณ (ค่าเงินวันนี้)',fmt(num('cretexp')),'฿/เดือน'):''}
    ${HOSP[V.chosp]?row('ถ้าป่วยหนักอยากรักษาที่',HOSP[V.chosp]):''}${txt('chospname')?row('โรงพยาบาลที่อยากใช้',esc(txt('chospname'))):''}${JOB[V.cjob]?row('อาชีพ',JOB[V.cjob]):''}</table></div>`;
  let fam=''; const nk=parseInt(V.nkids||'0')||0, np=parseInt(V.npar||'0')||0;
  fam+=row('สถานะ',V.cmar==='married'?'มีคู่ / แต่งงาน':V.cmar==='single'?'โสด':'ไม่ได้ตอบ');
  if(V.cmar==='married') fam+=row('คู่ชีวิต',esc(txt('spname')||'-')+(spAge()?' · '+spAge()+' ปี':(spBad()?' · อายุที่กรอก ('+intOf(V.spage)+') ใช้ไม่ได้':''))+(V.spinc==='no'?' · พึ่งพารายได้เรา'+(num('spmon')?' '+fmt(num('spmon'))+' ฿/เดือน':''):V.spinc==='yes'?' · มีรายได้ของตัวเอง':' · ไม่ได้ตอบว่ามีรายได้ของตัวเองหรือไม่'));
  if(blank(V.nkids)) fam+=row('ลูก','ไม่ได้ตอบ'); else if(!nk) fam+=row('ลูก','ไม่มี');
  for(let i=0;i<nk;i++){ const k=KIDS[i]||{}; const tierOK=tierOn(k);
    fam+=row('ลูกคนที่ '+(i+1),esc(k.name||'-')+(blank(intClean(k.age))?' · ไม่ได้กรอกอายุ':kidAgeOK(k)?' · '+intOf(k.age)+' ปี':' · อายุที่กรอก ('+intOf(k.age)+') ใช้ไม่ได้')
      +(tierOK?' · '+['รัฐ','เอกชน','นานาชาติ'][parseInt(k.tier||'1')||0]+(k.tierSet==='preset'?dn('ฟอร์มเลือกไว้ให้ก่อน'):'')+' ถึง '+((k.uptoSet===true&&k.upto==='master')?'ป.โท':'ป.ตรี')+(k.uptoSet===true?'':dn(k.uptoSet==='old'?'ป.ตรี จากร่างเดิม — ยังไม่ได้ยืนยัน':'ไม่ได้เลือก — คิดถึง ป.ตรี'))
        :' · แนวโรงเรียน: '+(k.tierSet==='old'?'"เอกชน" จากร่างเดิม — ยังไม่ได้ยืนยัน':'ไม่ได้เลือก')+dn('ยังไม่มีค่าเทอมในไฟล์'))
      +(numOf(k.mon)?' · เลี้ยงดู '+fmt(numOf(k.mon))+' ฿/เดือน':'')); }
  if(blank(V.npar)) fam+=row('ผู้ใหญ่ที่ต้องดูแล','ไม่ได้ตอบ'); else if(!np) fam+=row('ผู้ใหญ่ที่ต้องดูแล','ไม่มี');
  for(let i=0;i<np;i++){ const p=PARENTS[i]||{}; const pOK=!blank(intClean(p.age))&&inRange('adult',intOf(p.age)); fam+=row('ดูแล: '+(p.name||'ผู้ใหญ่ '+(i+1)),(pOK?intOf(p.age)+' ปี':(blank(intClean(p.age))?'ไม่ได้กรอกอายุ':'อายุที่กรอก ('+intOf(p.age)+') ใช้ไม่ได้')+dn('ไฟล์ใช้ 65'))+(numOf(p.mon)?' · ส่งให้ '+fmt(numOf(p.mon))+' ฿/เดือน':'')); }
  /* v1.7 (m-14): ครอบครัวยาว (หลายคน) — พิมพ์เต็มความกว้างและยอมให้ตัดข้ามหน้าได้ (เดิมทั้งก้อนถูกดันไปหน้า 2 หน้า 1 เกือบว่าง) */
  const famLong=(nk+np)>=4;
  fam=`<div class="pg${famLong?' flow':''}"><h3>ครอบครัว</h3><table class="wide">${fam}</table></div>`;
  let ins='';
  const POLS=POLICIES.filter(polFilled);
  const payTxt=p=>{ const dg=thaiDigits(String(p.payUntil==null?'':p.payUntil)).replace(/[^\d]/g,''); if(!dg) return '—'; const c=payAgeOf(p.payUntil,A.age);
    return c===''?esc(dg)+' (อ่านไม่ออก)':(Number(dg)>120?c+' (ปี '+esc(dg)+')':c); };   /* v1.7 (m-14): พิมพ์อายุที่ไฟล์ใช้ ไม่ใช่เลขดิบที่กรอก (เช่น 2585) */
  const nz=v=>numOf(v)?fmt(numOf(v)):'—';
  if(!POLS.length) ins=`<div class="empty">${V.none_ins==='1'?'ไม่มี (ผู้กรอกตอบว่าไม่มีประกันของตัวเอง)':'ไม่ได้กรอก'}</div>`;
  else { ins='<table class="pol"><tr><th>เล่ม · บริษัท · แบบประกัน</th><th>เบี้ย/ปี</th><th>จ่ายถึงอายุ</th><th>ทุนชีวิต</th><th>รักษา/ปี</th><th>ห้อง/คืน</th><th>โรคร้าย</th><th>อุบัติเหตุ/ครั้ง</th><th>เงินสด</th></tr>'+
    POLS.map((p,i)=>`<tr><td>${i+1}. ${esc(((p.company||'')+' '+(p.name||'')).trim()||'ไม่ได้ระบุบริษัท / แบบประกัน')}${p.coOld?dn('บริษัทจากร่างเดิม — ยังไม่ได้ยืนยัน'):''}</td><td>${nz(p.premium)}</td><td>${payTxt(p)}</td><td>${nz(p.life)}</td><td>${nz(p.health)}</td><td>${nz(p.room)}</td><td>${nz(p.ciSevere)}</td><td>${nz(p.accMed)}</td><td>${nz(p.cash)}</td></tr>`).join('')+'</table>';
    const cashSum=POLS.reduce((t,p)=>t+numOf(p.cash),0);
    if(cashSum>0) ins+=`<table class="wide">${row('มูลค่าเงินสดรวมทุกเล่ม (ในไฟล์นับเป็นทรัพย์สิน)',fmt(cashSum),'฿')}</table>`; }
  const WELF={none:'ไม่มี',sso:'ประกันสังคมอย่างเดียว',group:'ประกันกลุ่มบริษัท'+(num('welfroom')?' · ค่าห้อง '+fmt(num('welfroom'))+' ฿/คืน':'')+(num('welfmed')?' · วงเงิน '+fmt(num('welfmed'))+' ฿'+({visit:'/ครั้ง',year:'/ปี'}[V.welfper]||''):'')};
  ins+=`<table class="wide">${row('สวัสดิการที่ทำงาน',WELF[V.welf]||'ไม่ได้ตอบ')}</table>`;
  ins=`<div class="pg"><h3>ประกันที่มี</h3>${ins}</div>`;
  const gl=GOALS.filter(g=>numOf(g.amt)>0), glNo=GOALS.filter(g=>!(numOf(g.amt)>0)&&goalTouched(g));
  const gName=g=>esc(((g.ico||'')+' '+((g.name||'').trim()||'เป้าหมายอื่น ๆ')).trim());
  let goals=(gl.length||glNo.length)?'<table class="wide">'+gl.map(g=>`<tr><td>${gName(g)}</td><td class="v">${fmt(numOf(g.amt))+' ฿ · อีก '+(blank(intClean(g.yrs))?'5 ปี'+dn('ไม่ได้ระบุ — ใช้ 5 ปีไปก่อน'):!inRange('yrs',intOf(g.yrs))?'5 ปี'+dn('ที่กรอก '+intOf(g.yrs)+' ปี ใช้ไม่ได้ (รับ 0–60) — ใช้ 5 ปีไปก่อน'):intOf(g.yrs)+' ปี')}</td><td class="u"></td></tr>`).join('')
      +glNo.map(g=>`<tr><td>${gName(g)}</td><td class="v">ยังไม่ได้ใส่ยอดเงิน — ยังไม่เข้าแผน</td><td class="u"></td></tr>`).join('')+'</table>':'<div class="empty">ไม่ได้กรอก</div>';
  if(FOC[V.cfocus]||txt('cnote')) goals+=`<table class="wide">${FOC[V.cfocus]?row('อยากให้ช่วยดูเป็นพิเศษ',FOC[V.cfocus]):''}${txt('cnote')?row('เรื่องที่อยากบอกที่ปรึกษา',esc(txt('cnote'))):''}</table>`;

function payAgeOf(raw,age){ const d=thaiDigits(String(raw==null?'':raw)).replace(/[^\d]/g,''); if(!d) return ''; const n=Number(d);
  const beNow=new Date().getFullYear()+543;
  let r=null;
  /* v1.7b (AB2-16): ปีที่ผ่านมาแล้ว เดิมถูกปัดเป็นอายุปัจจุบันเงียบ ๆ ("1999" → อายุ 40) — ตอนนี้แปลงตามจริง (น้อยกว่าอายุปัจจุบัน = จ่ายครบแล้ว) และไฟล์มีโน้ตให้ยืนยัน */
  if(n>=2400&&n<=2700) r=age+(n-beNow);
  else if(n>=1900&&n<2400) r=age+(n-(beNow-543));
  if(r!=null && r<0) r=null;
  else if(n>0&&n<=120) r=n;
  return (r!=null && r<=120) ? String(r) : ''; }   /* v1.6: ผลลัพธ์เกิน 120 ปี = อ่านไม่ออก ไม่ส่ง (เดิมได้อายุ 413) */

  /* v1.7 (m-09): ค่าห้องมีหลายแหล่ง ไฟล์เก็บได้ค่าเดียว (ค่าสูงสุด) — เขียนทุกค่าไว้ในโน้ต ไม่ให้ค่าที่เหลือหายเงียบ ๆ */
  { const rl=POLS.map((p,i)=>[i+1,numOf(p.room)]).filter(x=>x[1]>0).map(x=>'เล่มที่ '+x[0]+': '+fmt(x[1])); if(welfRoom>0) rl.push('ประกันกลุ่ม: '+fmt(welfRoom));
    if(rl.length>1) est.push('ค่าห้อง รพ. ต่อคืนที่ลูกค้ากรอก — '+rl.join(' · ')+' → "ค่าห้องที่มีแล้ว" ใช้ค่าสูงสุด '+fmt(roomHave)+' ฿/คืน (ไม่ได้บวกกัน) ตรวจว่าเบิกรวมกันได้หรือไม่'); }
  if(policies.length){ est.push('ทะเบียนกรมธรรม์ '+policies.length+' เล่ม กรอกโดยลูกค้าเฉพาะช่องหลัก (เบี้ย/จ่ายถึงอายุ/ทุนชีวิต/วงเงินรักษา/โรคร้าย/ค่ารักษาอุบัติเหตุ) — เติมช่องอื่นจากรูปตารางความคุ้มครอง');
    const coOld=POLS.map((p,i)=>p.coOld?i+1:0).filter(Boolean);
    if(coOld.length) est.push('กรมธรรม์เล่มที่ '+coOld.join(', ')+': บริษัท "AIA" มาจากร่างฟอร์มรุ่นเดิมซึ่งเลือก AIA ให้ล่วงหน้า — ไม่ทราบว่าลูกค้าเลือกเองหรือไม่ ต้องยืนยัน');
    const anon=policies.map((p,i)=>(!p.company&&!p.name)?i+1:0).filter(Boolean);
    if(anon.length) est.push('กรมธรรม์เล่มที่ '+anon.join(', ')+' ลูกค้าไม่ได้ระบุบริษัทและแบบประกัน — อาจเป็นยอดรวมของหลายเล่ม ต้องถาม');
    const noNum=POLS.map((p,i)=>polHasNum(p)?0:i+1).filter(Boolean);
    if(noNum.length) est.push('กรมธรรม์เล่มที่ '+noNum.join(', ')+' ลูกค้าระบุแค่'+'บริษัท/ชื่อแบบ ยังไม่มีตัวเลข (เบี้ย ทุน วงเงิน เป็น 0 ในทะเบียน) — ขอรูปตารางความคุ้มครองแล้วเติม'); }
  else est.push(V.none_ins==='1' ? 'ลูกค้ากดตอบว่าไม่มีประกันของตัวเอง — ยืนยันอีกครั้ง' : 'ลูกค้าไม่ได้กรอกกรมธรรม์ (ไม่ทราบว่าไม่มีหรือข้าม) — ต้องถาม');
  /* v1.7 (m-08): เดิมเขียน "ค่าห้อง 0 ฿/คืน · ใส่ไว้ที่ค่าห้องที่มีแล้ว" แม้ไม่ได้กรอกค่าห้อง หรือค่าห้องของกรมธรรม์สูงกว่า */
  if(V.welf==='group'){ const wm=num('welfmed');
    est.push('มีประกันกลุ่มบริษัท: ค่าห้อง '+(welfRoom>0?fmt(welfRoom)+' ฿/คืน':'ไม่ได้กรอก')+' · วงเงินรักษา '+(wm>0?fmt(wm)+' ฿'+({visit:'/ครั้ง',year:'/ปี'}[V.welfper]||' (ไม่ได้ระบุว่าต่อครั้งหรือต่อปี)'):'ไม่ได้กรอก')
      +(welfRoom>0?(welfRoom>=roomHave?' — ค่าห้องนี้ใส่ไว้ที่ "ค่าห้องที่มีแล้ว"':' — "ค่าห้องที่มีแล้ว" ใช้ค่าห้องจากกรมธรรม์ที่สูงกว่า ('+fmt(roomHave)+' ฿/คืน)'):'')+' · ประกันกลุ่มยังไม่ได้ลงทะเบียนกรมธรรม์'); }
  else if(blank(V.welf)) est.push('ลูกค้าไม่ได้ตอบเรื่องสวัสดิการที่ทำงาน');
  /* v1.5: ข้อความเดียวกับหมอเงิน v2.6.7 — ไม่มีแบบประเมินความเสี่ยงใน Step 2 แล้ว */
  est.push('ผลตอบแทนของแผนใน MRI ใช้พอร์ตเริ่มต้น "ปานกลาง" (ก่อนเกษียณ 5%/ปี · หลังเกษียณ 3%/ปี) — ปรับได้ที่หน้า Portfolio · แบบประเมินความเสี่ยงให้ลูกค้าทำตอนสมัครประกัน/กองทุน');
  if(salaryM>0) est.push('ฟอร์มไม่ได้ถามอัตราขึ้นเงินเดือน — ไฟล์ตั้งให้เงินเดือนโตปีละ 3% (ค่าตั้งต้น เท่ากับเงินเฟ้อของแผน) ปรับได้ที่บรรทัดรายได้ใน MRI');
  if(!filled) est.push('ลูกค้าไม่ได้กรอกตัวเลขงบการเงินเลย');

  const talk={};
  const JOB={emp:'พนักงานบริษัท',gov:'ราชการ / รัฐวิสาหกิจ',own:'ธุรกิจส่วนตัว',free:'ฟรีแลนซ์',other:'อื่น ๆ'};
  const FOC={retire:'เกษียณ',protect:'คุ้มครองครอบครัว',debt:'จัดการหนี้',invest:'ลงทุน / ต่อยอด',edu:'ทุนการศึกษาลูก',tax:'ภาษี',all:'ดูภาพรวมทั้งหมด'};
  const profile={}; if(JOB[V.cjob]) profile.job=JOB[V.cjob];   /* v1.3: อาชีพย้ายไปอยู่ใน profile (หัวข้อ "ข้อมูลลูกค้า" ของบันทึกนัด) */
  if(FOC[V.cfocus]) talk['อยากให้ช่วยดูเป็นพิเศษ']=FOC[V.cfocus];
  if(txt('cnote')) talk['เรื่องที่ลูกค้าอยากบอก']=txt('cnote');
  if(V.welf) talk['สวัสดิการที่ทำงาน']=({none:'ไม่มี',sso:'ประกันสังคมอย่างเดียว',group:'ประกันกลุ่มบริษัท'})[V.welf];

  /* v1.7: ไม่มีช่องชื่อ/เบอร์คนที่แนะนำต่อในฟอร์มนี้ และไม่มีคีย์นั้นในไฟล์ (อ้อย 1 ต.ค.: ไม่เก็บเป็นบันทึก) */
  const visit={
    source:'S41 Client Form v'+VERSION, visitDate:(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))(new Date()),   /* v1.6: วันที่ตามเวลาเครื่อง (เดิม UTC) */
    advisor:'', advisorRef:REF, filledBy:'client',
    /* v1.3: ข้อมูลเชิงคุณภาพให้ที่ปรึกษาเห็นใน MRI (ปุ่ม "บันทึกนัดที่ 1") */
    profile,
    /* v1.7 (m-07): เงินดูแลคู่ชีวิตส่งเฉพาะเมื่อคำตอบปัจจุบันคือ "ไม่มีรายได้" (เดิมค่าที่เคยพิมพ์ค้างไปกับ hasIncome:true) */
    spouse: V.cmar==='married' ? { name:txt('spname')||'', age:spAge()||0, hasIncome:(V.spinc==='yes'?true:V.spinc==='no'?false:null), supportMonthly:(V.spinc==='no'?num('spmon')||0:0) } : null,
    statedTaxYear:num('fv_tax')||0,
    hospitalPlan:{ label:HOSP[V.chosp]?HOSP[V.chosp][1]:'', roomNeed:0, roomHave:roomHave||0 },
    goalPriority:FOC[V.cfocus]?[FOC[V.cfocus]]:[],
    budgetMonthly:0, lifeInsuranceSum:protection.lifeCov, educationFundNeeded:0, educationFundPrepared:0,
    riskProfile:null, gaps:{}, talk, estimates:est,
    note:'ไฟล์นี้ลูกค้ากรอกเองผ่านแบบฟอร์ม — ตรวจตัวเลขกับลูกค้าก่อนสรุปแผน'+(policies.length?' · ทะเบียนกรมธรรม์กรอกเฉพาะช่องหลัก':'')   /* v1.7: ตัด "(ไม่ได้เจอตัว)" — ฟอร์มไม่รู้ว่าเจอตัวหรือไม่ */
  };
  return {
    stage:'client',
    app:'S41 Signature 41 Planner', version:'3.8.1', savedAt:new Date().toISOString(),
    s41:{ clientId:clientId(), name:nm },
    state:{
      axisMin:Math.max(age-1,0), axisMax:life+2, snapAge:age, inflation:3,
      snapYear:new Date().getFullYear(),   /* v1.3: ปีของข้อมูลชุดนี้ */
      _healthTierV2:true,                  /* v1.3: วงเงินสุขภาพเป็นชุด 5/15/25 ลบ. แล้ว — MRI ไม่ต้องเลื่อนระดับซ้ำ (บั๊กเดิม: รพ.รัฐ กลายเป็นเอกชนกลาง) */
      _retN:1,                             /* v1.7: อายุเกษียณในไฟล์นี้ = ปีสุดท้ายที่ทำงาน (กติกาใหม่) — MRI ไม่ต้องเลื่อนอายุให้ */
      planMode:'combined', splitRatio:50, uiMode:'advance',
      assume:{ salaryG:3, inf:3, eduInf:5, medInf:8, preRet:5, postRet:3, sdPort:8.9 },
      portfolio:{ levels:{conservative:3,moderate:5,aggressive:7}, preRetire:'moderate', postRetire:'conservative' },
      ports:[], carriers, dependents, goals, eduPlan, navLog:[],
      snap:{ policies, detail, protection },
      _visit:visit
    },
    _visit:visit
  };
}
function clientId(){ if(!V._cid){ V._cid='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); saveSoon(); } return V._cid; }
function fileName(){
  const safe=String(txt('cname')||'ลูกค้าใหม่').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'_').slice(0,40)||'ลูกค้าใหม่';
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `S41_Client_${safe}_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
}
function makeBlob(){ return new Blob([JSON.stringify(buildClientFile(),null,1)],{type:'application/json'}); }
function setStatus(cls,msg){ const s=$('sendStatus'); if(s) s.innerHTML=`<div class="${cls}">${msg}</div>`; }

function downloadFile(){
  const name=fileName();
  try{
    const url=URL.createObjectURL(makeBlob());
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },2000);
    /* v1.7 (m-06): ระบบสั่งเบราว์เซอร์ให้บันทึกได้ แต่ตรวจไม่ได้ว่าไฟล์ถูกบันทึกจริงหรืออยู่ที่ไหน — เดิมเขียนว่า "อยู่ในโฟลเดอร์ดาวน์โหลด" เป็นข้อเท็จจริง
       "(ข้อมูลที่กรอกยังอยู่)" บอกเฉพาะเมื่อบันทึกร่างครั้งล่าสุดสำเร็จจริง */
    saveNow();
    setStatus('note','สั่งเบราว์เซอร์ให้บันทึกไฟล์ <b>'+esc(name)+'</b> แล้ว — ระบบตรวจไม่ได้ว่าบันทึกสำเร็จหรือไม่ กรุณาเปิดดูว่ามีไฟล์จริงก่อนส่ง · ปกติไฟล์จะอยู่ในโฟลเดอร์ "ดาวน์โหลด" (iPhone: แอป Files › ดาวน์โหลด) แล้วส่งไฟล์นี้ให้ที่ปรึกษาตามช่องทางที่คุณสะดวก · ถ้าไม่มีไฟล์ แสดงว่าเบราว์เซอร์นี้บล็อกการดาวน์โหลด ให้เปิดลิงก์ใน Safari/Chrome แล้วลองใหม่'+(draftKept()?' (ร่างที่กรอกยังเก็บอยู่ในเบราว์เซอร์นี้)':' (เบราว์เซอร์นี้เก็บร่างไม่ได้ — อย่าปิดหน้านี้จนกว่าจะได้ไฟล์)'));
  }catch(e){ setStatus('warn','ดาวน์โหลดไม่สำเร็จ: '+esc(e.message)+' — ลองเปิดลิงก์ใน Safari/Chrome'); }
}

/* ---------- start ---------- */
loadSaved();
render();
</script>
