<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S41 จัดขบวนประกัน · Insurance Train</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@600&display=swap">
<style>
/* v2.3 · ใช้ CI เดียวกับหน้าคลินิก s41financialclinic.com — ครีม กรมท่า ทอง ลายเส้น ปุ่มแคปซูล */
:root{
 --washi:#F5F2EC; --sheet:#FFFFFF; --ink:#1C1C2E; --ai:#002366; --kin:#C8A94A; --kinT:#A68B33; --kinS:#F3EAD0;
 --line:#E5E1D8; --line2:#D9D3C7; --muted:#7A7A8C; --faint:#A9A7B3; --warn:#A5542F;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-font-smoothing:antialiased;background:var(--washi);font-family:Sarabun,'Noto Sans Thai',sans-serif;color:var(--ink);font-size:15px;line-height:1.55;font-variant-numeric:lining-nums tabular-nums}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;background:none}
:focus-visible{outline:2px solid var(--kin);outline-offset:2px}

/* ── หัว: ขบวนรถไฟลายเส้นบนรางเส้นเดียว ── */
header{position:sticky;top:0;z-index:5;background:rgba(245,242,236,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hwrap{max-width:760px;margin:0 auto;padding:12px 20px 10px;display:flex;flex-direction:column;gap:8px}
.top{max-width:760px;margin:0 auto;padding:22px 20px 0;display:flex;justify-content:space-between;align-items:center}
.top img{width:72px;display:block}
.top small{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.35}

.train{position:relative;display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.train::-webkit-scrollbar{display:none}
.train::after{content:"";position:absolute;left:0;right:0;bottom:7px;height:1px;background:var(--line2)}
.car{flex:none;position:relative;display:flex;flex-direction:column;align-items:center}
.box{height:34px;min-width:64px;padding:0 11px;border:1px solid var(--line2);border-radius:6px;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--faint);background:transparent;white-space:nowrap;transition:border-color .2s,color .2s}
.box .seal{width:7px;height:7px;border-radius:50%;border:1px solid var(--line2);flex:none}
.car.on .box{color:var(--ai);border-color:var(--c);background:var(--sheet);font-weight:500}
.car.on .box .seal{background:var(--c);border-color:var(--c)}
.car.loco .box{border-radius:16px 6px 6px 6px;border-color:var(--ai);color:var(--ai);font-weight:600;min-width:96px}
.car.solo{margin-left:14px}.car.solo .box{border-style:dashed}
.wheels{display:flex;gap:18px;margin-top:3px}.wheels i{width:7px;height:7px;border-radius:50%;border:1px solid var(--line2);background:var(--washi);display:block;position:relative;z-index:1}
.car.on .wheels i,.car.loco .wheels i{border-color:var(--c,var(--ai))}
.prog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.prog i{height:2px;background:var(--line);display:block}.prog i.on{background:var(--kin)}

/* ── หน้า ── */
main{max-width:760px;margin:0 auto;padding:36px 20px 64px}
.card{display:flex;flex-direction:column;gap:28px}
.head{display:flex;flex-direction:column;gap:6px;position:relative}
.head.num{padding-left:47px}
.head .no{position:absolute;left:0;top:2px;width:31px;height:31px;border-radius:50%;background:var(--sheet);border:1px solid var(--kin);color:var(--ai);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
.k{font-size:12px;letter-spacing:.06em;color:var(--kinT);font-weight:600}
.eyebrow{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.18em;color:var(--kin);text-transform:uppercase;font-weight:600}
h1{margin:0;font-size:26px;line-height:1.3;font-weight:600;color:var(--ai)}
.hero{width:220px;height:auto;display:block;margin:0 0 6px}
.sub{font-size:14px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>.lbl,.lbl{font-size:14.5px;font-weight:600;color:var(--ai);display:flex;flex-direction:column;gap:8px}
.lbl .hint{font-weight:400;color:var(--muted);font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;vertical-align:middle;margin-right:8px;position:relative;top:-1px}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* ปุ่ม */
.btn{min-height:50px;padding:0 24px;border-radius:999px;font-size:15.5px;font-weight:600;border:1px solid var(--ai);background:var(--ai);color:#fff}
.btn:hover{background:#001a4d}
.btn.ghost{background:var(--sheet);color:var(--ai);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ai)}
.row{display:flex;gap:10px}.row .btn{flex:1}.row .btn.ghost{flex:0 0 auto}
.opt,.chip{min-height:44px;padding:0 18px;border-radius:999px;font-size:14.5px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);line-height:1.25}
.opt.on,.chip.on{border-color:var(--ai);background:var(--ai);color:#fff}
.chip.on small{color:#C9D1E4}
.chip{padding-top:4px;padding-bottom:4px}
.chip small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;gap:6px}.seg .opt{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.inp,.money input,.sum input{font-size:16px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;width:100%;background:var(--sheet)}
.inp:focus,.money input:focus,.sum input:focus,select:focus{border-color:var(--ai);outline:none}
.money{display:flex;flex-direction:column;gap:6px}
.money .t{font-size:14.5px;font-weight:600;color:var(--ai)}
.money input{text-align:right;font-size:17px}
.money input::placeholder{color:var(--faint);font-size:15px}
.money small{font-size:12.5px;color:var(--muted)}
.moneys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}

/* รายการในขบวน: แผ่นเดียว คั่นเส้นบาง */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px}
.rrow{position:relative;display:flex;align-items:center;gap:16px;padding:16px 18px 16px 26px;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .bar{position:absolute;left:12px;top:16px;bottom:16px;width:2px;border-radius:1px}
.rrow .end{display:flex;align-items:center;gap:14px;flex:none}
.drop.ghost{visibility:hidden}
.rrow .mid{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.rrow .tag{font-size:12px;letter-spacing:.04em;color:var(--kinT);font-weight:600}
.rrow select{font-size:14.5px;font-weight:600;color:var(--ai);padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sheet);max-width:100%}
.sum{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.sum input{width:130px;font-size:15px;padding:8px 10px;text-align:right;color:var(--ink)}
.rrow .prem{width:96px;text-align:right;font-size:17px;font-weight:600;color:var(--ai)}
.rrow .prem small{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.rrow .prem.na{color:var(--faint);font-size:14px}
.drop{font-size:12.5px;color:var(--muted);border:0;padding:6px 2px;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.drop:hover{color:var(--warn)}
.cov{font-size:12.5px;color:var(--muted)}.cov .warn{color:var(--warn)}
.mini{display:inline-flex;gap:4px;margin:0 4px}
.mini button{min-width:30px;min-height:28px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;background:var(--sheet)}
.mini button.on{background:var(--ai);border-color:var(--ai);color:#fff}
.info{font-size:13px;color:var(--muted)}

/* ยอดรวม */
.total{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;padding:18px 0 0;border-top:1px solid var(--kin)}
.total .k{font-size:14px;color:var(--muted)}
.total .v{font-size:32px;font-weight:600;color:var(--ai)}
.total .v small{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}

.form{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.form span{flex:1;font-size:14.5px}
.pill{min-height:38px;padding:0 18px;border-radius:999px;font-size:13.5px;font-weight:600;border:1px solid var(--ai);background:var(--sheet);color:var(--ai)}
.pill:hover{background:var(--ai);color:#fff}
.pill.ok{border-color:var(--ai);background:var(--ai);color:#fff}.pill.fail{border-color:var(--warn);color:var(--warn)}

/* หน้าแรก */
.intro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.intro .it{display:flex;align-items:baseline;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.intro .it b{font-weight:600;color:var(--ai);font-size:15px;min-width:86px}
.intro .it span{font-size:13.5px;color:var(--muted)}
.locos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.loco3{padding:16px;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600;color:var(--ai);background:var(--sheet)}
.loco3 svg{width:44px;height:38px}
.loco3 span{font-size:12.5px;font-weight:400;color:var(--muted)}

/* หน้าเบี้ยถึง 99 */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tile{padding:16px 16px 16px 0;display:flex;flex-direction:column;gap:2px}
.tile+.tile{border-left:1px solid var(--line);padding-left:16px}
.tile small{font-size:12.5px;color:var(--muted)}.tile b{font-size:22px;font-weight:600;color:var(--ai)}
.tile.kin b{color:var(--kinT)}
.chartbox{display:flex;flex-direction:column;gap:12px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:8px;height:8px;border-radius:50%;display:inline-block}
.chart{position:relative;height:220px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--ink);padding:0 2px}
.chart .bar{flex:1;display:flex;flex-direction:column-reverse;gap:1px}.chart .bar i{display:block;border-radius:1px}
.axis{display:flex;gap:8px;padding:0 2px}.axis span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.hk{font-size:13px;min-height:32px;min-width:48px;border-radius:999px;border:1px solid var(--line);background:var(--sheet)}.hk.on{border-color:var(--ai);background:var(--ai);color:#fff}
.tbl{width:100%}
.tbl .tr{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-size:14px;border-top:1px solid var(--line)}
.tbl .th{font-size:12.5px;color:var(--muted);border-top:0;border-bottom:1px solid var(--ink)}
.tbl span{padding:8px 4px;text-align:right}.tbl span:first-child{text-align:left;color:var(--ai);font-weight:600}
.tbl .th span{font-weight:400;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.7;padding-left:12px;border-left:2px solid var(--kin)}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dl .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px}
.dl .btn small{font-size:12px;font-weight:400;opacity:.75}
.exp{display:flex;flex-direction:column;gap:10px;padding:18px 20px;border:1px dashed var(--kin);border-radius:14px;background:var(--sheet)}
.exp .t{font-size:15px;font-weight:600;color:var(--ai)}
.exp ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.75;color:var(--ink)}
.exp .r{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:640px){
 main{padding:24px 16px 48px}.hwrap{padding:10px 16px 8px}
 h1{font-size:23px}
 .top{padding:16px 16px 0}.top img{width:60px}
 .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
 .moneys,.intro,.locos{grid-template-columns:1fr}
 .tiles{grid-template-columns:1fr}.tile+.tile{border-left:0;border-top:1px solid var(--line);padding-left:0}
 .rrow{flex-direction:column;align-items:stretch;gap:12px;padding:14px 14px 14px 24px}.rrow .bar{left:10px;top:14px;bottom:14px}
 .rrow .mid{min-width:0}.rrow .end{justify-content:space-between;align-items:flex-end}.rrow .prem{width:auto;margin-left:auto}
 .box{min-width:0;padding:0 8px;font-size:12px}.car.loco .box{min-width:0}
 .dl{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{header{position:static}button,.exp,.hk,.drop,.mini{display:none!important}body{background:#fff}main{padding:0}}
</style>
</head>

function rate(series, age){ if(!series) return null; const i=age-series.lo; if(i<0||i>=series.v.length) return null; const v=series.v[i]; return (v===null||v===undefined)?null:v; }

function paBand(pl,a){ return a<=60?0:a<=65?1:a<=70?2:3; }

  .sort((x,y)=>(paPremAt(x,cls,a)-paPremAt(y,cls,a))||(y.ad-x.ad)); }

const paLabel=pl=>`${pl.k} · ค่ารักษา ${fmt(pl.me)} · ตาย/อวัยวะ ${fmt(pl.ad)}${pl.mc<pl.ad?' (มอเตอร์ไซค์ '+fmt(pl.mc)+')':''}${pl.mlb?' · ชดเชยรายเดือน '+fmt(pl.mlb):''}`;

function riderDef(k){
 const w=S.want;
 if(k==='w1') return {r:kidHealth()?'HHK':'HH',plans:(kidHealth()?HEALTH_KID:HEALTH_ADULT).map(x=>[x[0],x[1]]),plan:healthPlan(),planKey:'health'};

 if(k==='w4') return {r:'CFC',plans:[['CFC','Care for Cancer'],['HC','Health Cancer']],plan:w.cancerPlan,planKey:'cancerPlan',sumLabel:'ทุนประกัน',sum:w.cancer,sumKey:'cancer',min:100000,step:100000};

// ตารางอัตราของตู้นั้น (ใช้คิดเบี้ย + บอกช่วงอายุที่รับ)
function riderSeries(k){
 const d=riderDef(k); if(!d.r) return null; const sex=S.sex;
 if(k==='w1'){ const p=d.plan; if(p==='none') return null; let rk,pn; if(kidHealth()){rk='HHK';pn=p;} else {const sp=p.split(':');rk=sp[0];pn=sp[1];} const s=RATES.rider[rk]&&RATES.rider[rk].plans[pn]; return s?s[sex]:null; }
 if(k==='w2') return RATES.rider.HBX[sex];
 const R=RATES.rider[d.plan]; return R?R[sex]:null;
}
function riderPremAt(k,attained){
 if(k==='pa'){ const pl=paPlan(); return pl?paPremAt(pl,S.want.paCls,attained):null; }
 const d=riderDef(k), s=riderSeries(k); if(!s) return null; const r=rate(s,attained); if(r===null) return null;
 if(k==='w1') return r;
 if(k==='w2') return r*d.sum/1000;
 const R=RATES.rider[d.plan]; if(R.unit==='fixed') return r; return r*d.sum/1e6;
}

function coverOf(k){

 if(k==='w1'){ const t=HH_TIERS.find(x=>'HH:'+x[0]===d.plan); return {health:t?t[1]:0}; }

 if(k==='w6') return {paDeath:d.sum};
 if(k==='pa'){ const pl=paPlan(); return pl?{accMed:pl.me,paDeath:pl.ad}:{}; }
 return {};
}

function model(){
 const kid=isKid(), sex=S.sex, age=S.age;
 const included=k=>wanted(k);
 const allMain=MAIN_GROUPS.flatMap(x=>x[1]);
 const mainKey=allMain.includes(S.mainKey)?S.mainKey:'PLP20';
 const grp=MAIN_GROUPS.find(x=>x[1].includes(mainKey))[0];
 const sum=headSum(), term=mainTerm(mainKey,age), mp=mainPrem(mainKey,sex,age,sum);
 const yearAt=(y,withHike)=>{ const a=age+y; const main=(y<term&&mp!==null)?mp:0; const parts={}; let riders=0;
  ALL.forEach(k=>{ if(!included(k)) return; let v=riderPremAt(k,a); if(v===null) return; if(withHike&&(k==='w1'||k==='w2')&&S.hike>0) v*=Math.pow(1+S.hike,y); parts[k]=v; riders+=v; });
  return {age:a,main,riders,parts,total:main+riders}; };
 const years=[], base=[]; for(let y=0;age+y<=98;y++){ years.push(yearAt(y,true)); base.push(yearAt(y,false)); }
 const cov={life:sum,health:0,ciSevere:0,cancer:0,hospCash:0,paDeath:0,accMed:0};
 ALL.forEach(k=>{ if(!included(k)) return; const c=coverOf(k); for(const f in c) cov[f]+=c[f]; });
 const lvl={}; ALL.forEach(k=>lvl[k]=included(k)?2:0);
 return {kid,sex,age,lvl,included,mainKey,grp,sum,term,mp,years,base,cov,first:years.length?years[0].total:0};
}

 const none=ALL.filter(k=>!m.included(k)&&k!=='w6').map(k=>k==='pa'?'ค่ารักษาอุบัติเหตุ (PA)':CAT[k].name);

 <div class="total"><span class="k">เบี้ยปีแรกรวม</span><span class="v">${fmt(m.first)}<small>บาทต่อปี ≈ ${fmt(m.first/12)} ต่อเดือน</small></span></div>

 <div class="row"><button class="btn ghost" data-act="go" data-n="1">ย้อนกลับ</button><button class="btn" data-act="go" data-n="3">ดูเบี้ยถึงอายุ 99</button></div>`;

function step3(m){
 const kid=m.kid, years=m.years, age=m.age;
 const profile=(kid?'ลูก':'ลูกค้า')+(m.sex==='m'?'ชาย':'หญิง')+' อายุ '+age;
 const lifeTotal=years.reduce((t,x)=>t+x.total,0); const peak=years.reduce((p,x)=>x.total>p.total?x:p,{total:-1,age}); const after60=years.filter(x=>x.age>=60).reduce((t,x)=>t+x.total,0);
 const sample=years.filter((x,i)=>i%5===0); const max=Math.max(1,...sample.map(x=>x.total)); const sc=200/max; const n=Math.max(1,sample.length);
 const bars=sample.map(x=>`<div class="bar">${x.main>0?`<i style="height:${Math.max(1,Math.round(x.main*sc))}px;background:var(--ai)"></i>`:''}${ALL.map(k=>x.parts[k]?`<i style="height:${Math.max(1,Math.round(x.parts[k]*sc))}px;background:${CAT[k].color}"></i>`:'').join('')}</div>`).join('');
 const mark=(a,text,color,top)=>{const idx=(a-age)/5; if(idx<0||idx>n-1) return ''; const left=((idx+.5)/n*100).toFixed(1)+'%'; return `<div style="position:absolute;left:${left};top:${top}px;bottom:0;border-left:1px dashed ${color}"></div><div style="position:absolute;left:calc(${left} + 5px);top:${top}px;font-size:11.5px;color:${color}">${text}</div>`;};
 const legend=ALL.filter(k=>m.included(k)&&riderDef(k).r).map(k=>`<span><i class="sw" style="background:${CAT[k].color}"></i>${k==='pa'?'PA':CAT[k].name}</span>`).join('');
 const rows=sample.map((x,i)=>{const cum=years.slice(0,i*5+1).reduce((t,z)=>t+z.total,0); return `<div class="tr"><span>${x.age}</span><span style="color:var(--muted)">${x.main?fmt(x.main):'–'}</span><span style="color:var(--muted)">${x.riders?fmt(x.riders):'–'}</span><span style="font-weight:500">${fmt(x.total)}</span><span style="color:var(--muted)">${fmt(cum)}</span></div>`;}).join('');
 const c1=S.copied.pol, c2=S.copied.pf;
 const lbl=(st,t)=>st==='ok'?'คัดลอกแล้ว':st==='fail'?'คัดลอกไม่สำเร็จ':t;
 return `<div class="head num"><span class="no">3</span><span class="k">ประมาณการจากตารางอัตรา</span><h1>เบี้ยถึงอายุ 99</h1><div class="sub">${profile}</div></div>
 <div class="tiles"><div class="tile"><small>รวมทั้งชีวิต</small><b>${fmt(lifeTotal)}</b></div><div class="tile"><small>ปีที่เบี้ยสูงสุด</small><b>อายุ ${peak.age}</b><small>${fmt(peak.total)} บาทต่อปี</small></div><div class="tile kin"><small>จ่ายหลังอายุ 60</small><b>${fmt(after60)}</b><small>${lifeTotal?Math.round(after60/lifeTotal*100):0}% ของทั้งหมด</small></div></div>
 <div class="chartbox"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div class="legend"><span><i class="sw" style="background:var(--ai)"></i>หัว</span>${legend}</div><span style="font-size:11.5px;color:var(--muted)">สูงสุด ${fmt(max)} บาทต่อปี</span></div>
  <div class="chart">${mark(age+m.term,'จ่ายหัวครบ '+(age+m.term),'#1B2E5A',0)}${mark(60,'เกษียณ 60','#A88B4A',18)}${bars}</div><div class="axis">${sample.map(x=>`<span>${x.age}</span>`).join('')}</div>
  <div style="display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap;color:var(--muted)"><span>ถ้าเบี้ยสุขภาพขึ้นปีละ</span>${[[0,'0%'],[0.03,'3%'],[0.05,'5%']].map(h=>`<button class="hk ${S.hike===h[0]?'on':''}" data-act="hike" data-v="${h[0]}">${h[1]}</button>`).join('')}<span>(สมมติฐาน)</span></div></div>
 <div class="tbl"><div class="tr th"><span>อายุ</span><span>หัว</span><span>ตู้รวม</span><span>รวมต่อปี</span><span>สะสม</span></div>${rows}</div>
 <div class="note"><b>แหล่งอัตรา</b> ตารางอัตราเบี้ย S41 (Excel ${RATES_DATE}) อัตราฐาน ยังไม่รวมส่วนลดทุนและขั้นอาชีพ${m.included('pa')?' · PA จาก'+PA_DATE+' ขั้นอาชีพ '+S.want.paCls:''}<br><b>สมมติฐาน</b> เบี้ยหัวคงที่ตลอดระยะชำระ · เบี้ยตู้ตามอายุที่ถึงในแต่ละปี${S.hike?` · เบี้ยตู้ 1–2 ขึ้น ${Math.round(S.hike*100)}% ต่อปี`:''} · ตู้ที่ยังไม่มีอัตรา (PBCI, WPCI) ยังไม่รวม${m.included('pa')?' · PA หยุดเมื่อเกินอายุต่ออายุสูงสุดของแผน':''}<br>ประมาณการเบื้องต้น ไม่ใช่ใบเสนอขาย เบี้ยสุขภาพไม่การันตี</div>
 <div class="dl"><button class="btn" data-act="csv"><span>ดาวน์โหลด CSV</span><small>ตารางรายปี เปิดใน Excel ได้</small></button><button class="btn ghost" data-act="print"><span>พิมพ์ หรือบันทึก PDF</span><small>หน้านี้</small></button></div>
 <div class="exp"><div class="t">ใส่ขบวนนี้เข้า Money MRI (ไม่บังคับ)</div>
  <ol><li>ใน MRI กด <b>บันทึก Before</b> ก่อน เพราะขั้นต่อไปจะเพิ่มกรมธรรม์ที่เสนอเข้าทะเบียน</li>
  <li>หน้า IV ทะเบียนกรมธรรม์ กด <b>🤖 กรอกจากรูปด้วย AI</b> วาง <b>ก้อนที่ 1</b> กดเพิ่มเข้าทะเบียน แล้วเลือก "ของใคร"</li>
  <li>ที่เล่มนั้น กด 💸 แล้วกด <b>🤖 กรอกตารางเบี้ยจากรูปด้วย AI</b> วาง <b>ก้อนที่ 2</b> (เบี้ยตามอายุ ${age}–98 อัตราฐาน ไม่รวมสมมติฐานเบี้ยขึ้น)</li></ol>
  <div class="r"><button class="pill ${c1||''}" data-act="copy" data-v="pol">${lbl(c1,'คัดลอกก้อนที่ 1 ทุน')}</button><button class="pill ${c2||''}" data-act="copy" data-v="pf">${lbl(c2,'คัดลอกก้อนที่ 2 เบี้ยตามอายุ')}</button></div></div>
 <button class="btn ghost" data-act="go" data-n="2">ย้อนกลับไปแก้ขบวน</button>`;
}
function render(){
 const m=model();
 document.getElementById('hdr').innerHTML=header(m);
 document.getElementById('app').innerHTML=[step0,step1,step2,step3][S.step](m);
}
// ---------- ข้อมูลส่งเข้า Money MRI (ทางเลือก — คัดลอกไปวางในทะเบียนกรมธรรม์) ----------
function trainName(m){ const ks=ALL.filter(k=>m.included(k)&&riderDef(k).r&&k!=='pa').map(k=>k.slice(1)); const pl=m.included('pa')?paPlan():null; return ('ขบวนเสนอ · '+RATES.main[m.mainKey].name+(ks.length?' + ตู้ '+ks.join(','):'')+(pl?' + '+pl.k:'')).slice(0,60); }
function mriPolicyJSON(m){
 const c=m.cov;
 return JSON.stringify([{company:'AIA',name:trainName(m),no:'',saleAge:String(m.age),start:'',payUntil:'',maturity:'',
  life:Math.round(c.life),premium:Math.round(m.base[0]?m.base[0].total:0),health:Math.round(c.health),accMed:Math.round(c.accMed),hospCash:Math.round(c.hospCash),hospCancer:0,
  cancer:Math.round(c.cancer),ciMid:0,ciSevere:Math.round(c.ciSevere),ciCrit:0,care:0,paDeath:Math.round(c.paDeath),saving:0,annuity:0,surrender:0}]);
}
function mriPfJSON(m){
 const rows=[]; m.base.forEach(x=>{ const amt=Math.round(x.total); if(!(amt>0)) return; const last=rows[rows.length-1];
  if(last&&last.amt===amt&&last.to===x.age-1) last.to=x.age; else rows.push({from:x.age,to:x.age,amt}); });
 return JSON.stringify({name:trainName(m),rows});
}
// ---------- events ----------
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]'); if(!el) return;
 const a=el.dataset.act, v=el.dataset.v;
 if(a==='go'){ S.step=Number(el.dataset.n); S.copied={}; window.scrollTo(0,0); }
 else if(a==='who'){ if(S.who!==v){ S.who=v; S.age=v==='kid'?3:35; S.want.life=v==='kid'?300000:1000000; S.want.wp=(v==='kid'); S.want.health=v==='kid'?'Deduct 100K':'HH:5M'; S.want.hosp=0; S.want.ci=0; S.want.cancer=0; S.want.acc=0; S.want.accPlan='ADD'; S.want.accMed=0; S.want.paPlan=''; S.want.ciPlan='MPCI'; S.on={w1:true}; } }
 else if(a==='sex'){ S.sex=v; }
 else if(a==='health'){ S.want.health=v; S.on.w1=(v!=='none'); }
 else if(a==='wp'){ S.want.wp=(v===undefined)?!S.want.wp:v==='1'; }
 else if(a==='addw6'){ S.on.w6=true; if(!(S.want.acc>0)) S.want.acc=ACC_DEFAULT; }
 else if(a==='accMed'){ S.want.accMed=Number(v); S.want.paPlan=''; }
 else if(a==='paCls'){ S.want.paCls=Number(v); S.want.paPlan=''; }
 else if(a==='drop'){ if(v==='pa'){ S.want.accMed=0; S.want.paPlan=''; } else if(v==='w1'){ S.want.health='none'; S.on.w1=false; } else if(v==='w5') S.want.wp=false; else { S.on[v]=false; const key=Object.keys(WANT_CAR).find(x=>WANT_CAR[x]===v); if(key) S.want[key]=0; } }
 else if(a==='hike'){ S.hike=Number(v); }
 else if(a==='copy'){ const m=model(); const text=v==='form'?formText(isKid()):v==='pol'?mriPolicyJSON(m):mriPfJSON(m); copyText(text,ok=>{S.copied[v]=ok?'ok':'fail';render();}); return; }
 else if(a==='csv'){ downloadCSV(); return; }
 else if(a==='print'){ window.print(); return; }
 render();
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.want){ const k=t.dataset.want; S.want[k]=num(t.value); if(WANT_CAR[k]) S.on[WANT_CAR[k]]=S.want[k]>0; }   // เก็บค่าทันที · แสดงผลใหม่เมื่อออกจากช่อง
});
document.addEventListener('change',e=>{ const t=e.target;
 if(t.dataset.want){ render(); return; }
 if(t.dataset.inp==='age'){ S.age=Math.max(0,Math.min(80,Math.round(Number(t.value)||0))); render(); return; }
 if(t.dataset.inp==='payerAge'){ S.payerAge=Math.max(0,Math.round(Number(t.value)||0)); render(); return; }
 if(t.dataset.sum){ S.want[t.dataset.sum]=num(t.value); render(); return; }

function copyText(text,done){
 const legacy=()=>{try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok);}catch(e){done(false);}};
 try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>done(true),legacy); else legacy(); }catch(e){legacy();}
}

function downloadCSV(){
 const m=model();
 const ks=ALL.filter(k=>m.included(k)&&riderDef(k).r);
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const cols=['อายุ',q('หัวรถจักร ('+RATES.main[m.mainKey].name+' ทุน '+fmt(m.sum)+')')].concat(ks.map(k=>q(CAT[k].no+' '+CAT[k].name))).concat(['รวม/ปี','สะสม']);
 let cum=0; const lines=[cols.join(',')];
 m.years.forEach(x=>{ cum+=x.total; lines.push([x.age,Math.round(x.main)].concat(ks.map(k=>Math.round(x.parts[k]||0))).concat([Math.round(x.total),Math.round(cum)]).join(',')); });

 const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
 a.download=(isKid()?'ลูก':'ลูกค้า')+'_ขบวนประกัน_อายุ'+S.age+'_'+ddmmyy()+'.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
