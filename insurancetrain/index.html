<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S41 จัดขบวนประกัน · Insurance Train</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@600&display=swap">
<style>
/* v2.3 · ใช้ CI เดียวกับหน้าคลินิก s41financialclinic.com — ครีม กรมท่า ทอง ลายเส้น ปุ่มแคปซูล */
:root{
 --washi:#F5F2EC; --sheet:#FFFFFF; --ink:#1C1C2E; --ai:#002366; --kin:#C8A94A; --kinT:#A68B33; --kinS:#F3EAD0;
 --line:#E5E1D8; --line2:#D9D3C7; --muted:#7A7A8C; --faint:#A9A7B3; --warn:#A5542F;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-font-smoothing:antialiased;background:var(--washi);font-family:Sarabun,'Noto Sans Thai',sans-serif;color:var(--ink);font-size:16px;line-height:1.55;font-variant-numeric:lining-nums tabular-nums}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;background:none}
:focus-visible{outline:2px solid var(--kin);outline-offset:2px}

/* ── หัว: ขบวนรถไฟลายเส้นบนรางเส้นเดียว ── */
header{position:sticky;top:0;z-index:5;background:rgba(245,242,236,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hwrap{max-width:760px;margin:0 auto;padding:12px 20px 10px;display:flex;flex-direction:column;gap:8px}
.top{max-width:760px;margin:0 auto;padding:22px 20px 0;display:flex;justify-content:space-between;align-items:center}
.top img{width:72px;display:block}
.top small{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.35}

.train{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 3px;overflow:visible;padding:2px 0 2px}
.train::-webkit-scrollbar{display:none}
.car::after{content:"";position:absolute;left:-2px;right:-2px;bottom:3px;height:1px;background:var(--line2)}
.car{flex:1 1 auto;position:relative;display:flex;flex-direction:column;align-items:center}.car .box{width:100%;box-sizing:border-box;justify-content:center}
.box{height:34px;min-width:0;padding:0 7px;border:1px solid var(--line2);border-radius:6px;display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--ai);background:var(--sheet);white-space:nowrap;transition:border-color .2s,color .2s}
.box .seal{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line2);flex:none;background:transparent}
.car.on .box{font-weight:600;border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}.car.on .box .seal{border-color:var(--c)}
.car.on .box .seal{background:var(--c);border-color:var(--c)}
.car.loco .box{border-radius:16px 6px 6px 6px;border-color:var(--ai);color:var(--ai);font-weight:600}
.car.solo{margin-left:9px}.car.solo .box{border-style:dashed}.car.solo .box .seal{border-style:dashed}
.wheels{display:flex;gap:14px;margin-top:3px}.wheels i{width:7px;height:7px;border-radius:50%;border:1px solid var(--line2);background:var(--washi);display:block;position:relative;z-index:1}
.car.on .wheels i,.car.loco .wheels i{border-color:var(--c,var(--ai))}
.prog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.prog i{height:2px;background:var(--line);display:block}.prog i.on{background:var(--kin)}

/* ── หน้า ── */
main{max-width:760px;margin:0 auto;padding:36px 20px 64px}
.card{display:flex;flex-direction:column;gap:28px}
.head{display:flex;flex-direction:column;gap:6px;position:relative}
.head.num{padding-left:47px}
.head .no{position:absolute;left:0;top:2px;width:31px;height:31px;border-radius:50%;background:var(--sheet);border:1px solid var(--kin);color:var(--ai);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center}
.k{font-size:13px;letter-spacing:.06em;color:var(--kinT);font-weight:600}
.eyebrow{font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:.18em;color:var(--kin);text-transform:uppercase;font-weight:600}
h1{margin:0;font-size:28px;line-height:1.3;font-weight:600;color:var(--ai)}
.hero{width:100%;height:auto;display:block;margin:0 0 10px}
.sub{font-size:15px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>.lbl,.lbl{font-size:15.5px;font-weight:600;color:var(--ai);display:flex;flex-direction:column;gap:8px}
.lbl .hint{font-weight:400;color:var(--muted);font-size:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;vertical-align:middle;margin-right:8px;position:relative;top:-1px}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* ปุ่ม */
.btn{min-height:50px;padding:0 24px;border-radius:999px;font-size:15.5px;font-weight:600;border:1px solid var(--ai);background:var(--ai);color:#fff}
.btn:hover{background:#001a4d}
.btn.ghost{background:var(--sheet);color:var(--ai);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ai)}
.row{display:flex;gap:10px}.row .btn{flex:1}.row .btn.ghost{flex:0 0 auto}
.opt,.chip{min-height:46px;padding:0 18px;border-radius:999px;font-size:15.5px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);line-height:1.25}
.opt.on,.chip.on{border-color:var(--ai);background:var(--ai);color:#fff}
.chip.on small{color:#C9D1E4}
.chip{padding-top:4px;padding-bottom:4px}
.chip small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;gap:6px}.seg .opt{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.ids .lbl{justify-content:flex-start}
.ids .lt{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:22px;white-space:nowrap}
.ids .lt .hint{font-weight:400;color:var(--muted);font-size:13.5px}
.ids .lbl>.hint{font-size:13px}
.mode{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.mode button{font-size:12.5px;padding:2px 10px;border:0;background:var(--sheet);color:var(--muted);min-height:22px;white-space:nowrap}
.mode button.on{background:var(--ai);color:#fff}
.hrow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.hrow .hl{font-size:14.5px;font-weight:500;color:var(--ink);display:flex;flex-direction:column;line-height:1.3}
.hrow .hl small{font-size:12.5px;font-weight:400;color:var(--muted)}
.hrow+.hrow{margin-top:2px}
.inp,.money input,.sum input{font-size:16px;padding:10px 14px;min-height:46px;border:1px solid var(--line);border-radius:12px;width:100%;background:var(--sheet)}
.inp:focus,.money input:focus,.sum input:focus,select:focus{border-color:var(--ai);outline:none}
.money{display:flex;flex-direction:column;gap:6px}
.money .t{font-size:15.5px;font-weight:600;color:var(--ai)}
.money input{text-align:right;font-size:17px}
.money input::placeholder{color:var(--faint);font-size:15px}
.money small{font-size:13.5px;color:var(--muted)}
.moneys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}

/* รายการในขบวน: แผ่นเดียว คั่นเส้นบาง */
/* ขั้นที่ 2: การ์ดละตู้ */
.cards{display:flex;flex-direction:column;gap:8px}
.cardc{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px 18px}
.cardc.ghost{background:transparent;border-style:dashed}
.cardc .bar{position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 2px 2px 0}
.cardc .ch{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.cardc .ch b{font-size:14px;font-weight:600;color:var(--kinT);white-space:nowrap}
.cardc .ch .sub{font-size:13px;color:var(--muted);min-width:0;flex:1}
.cardc .ch .chr{margin-left:auto;white-space:nowrap}
.cardc.ghost .ch{margin:0}
.ln{display:grid;grid-template-columns:minmax(0,1fr) 118px 92px 28px;gap:4px 12px;align-items:center;padding:5px 0}
.ln+.ln{border-top:1px solid var(--line)}
.ln.sub{border-top:1px dashed var(--line);padding-top:4px}
.ln .sel{min-width:0}
.ln select{width:100%;font-size:15.5px;font-weight:600;color:var(--ai);padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
.ln .txt{font-size:15px;font-weight:500;color:var(--ink);line-height:1.3}.ln .txt.muted{color:var(--muted);font-weight:400;font-size:13.5px}.ln .txt.r{text-align:right;display:block}.ln .txt.warn{color:var(--warn)}
.ln .sumc input{width:100%;font-size:16px;padding:7px 10px;text-align:right;color:var(--ink);border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
.ln .sumc input::placeholder{color:var(--faint);font-size:13px}
.ln .prem{text-align:right;font-size:17px;font-weight:600;color:var(--ai);line-height:1.15}
.ln .prem small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.ln .prem.na{color:var(--faint);font-size:13.5px;font-weight:500}
.ln .act{display:flex;justify-content:flex-end}
.ln .note{grid-column:1/-1;font-size:13px;color:var(--muted);line-height:1.45;margin-top:-2px;border:0;padding:0}
.ln .note .warn{color:var(--warn)}
.x{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--muted);font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.x:hover{border-color:var(--warn);color:var(--warn)}
.addin{font-size:13.5px;font-weight:600;border:0;padding:0;background:none;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.addin:hover{text-decoration-color:currentColor}
.sum{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.sum input{width:130px;font-size:15px;padding:8px 10px;text-align:right;color:var(--ink)}
.drop{font-size:12px;color:var(--muted);border:0;padding:4px 0;text-decoration:underline;background:none}
.mini{display:inline-flex;gap:3px;margin:0 4px;vertical-align:middle}
.mini button{min-width:28px;min-height:26px;padding:0 8px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;background:var(--sheet)}
.mini button.on{background:var(--ai);border-color:var(--ai);color:#fff}
.info{font-size:14px;color:var(--muted);line-height:1.6}

/* ยอดรวม */
.total{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;padding:18px 0 0;border-top:1px solid var(--kin)}
.total .k{font-size:15px;color:var(--muted)}
.total .v{font-size:34px;font-weight:600;color:var(--ai)}
.total .v small{font-size:14px;font-weight:400;color:var(--muted);margin-left:6px}

.form{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.form span{flex:1;font-size:15.5px}
.pill{min-height:40px;padding:0 18px;border-radius:999px;font-size:14.5px;font-weight:600;border:1px solid var(--ai);background:var(--sheet);color:var(--ai)}
.pill:hover{background:var(--ai);color:#fff}
.pill.ok{border-color:var(--ai);background:var(--ai);color:#fff}.pill.fail{border-color:var(--warn);color:var(--warn)}

/* หน้าแรก */
.intro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.intro .it{display:flex;align-items:baseline;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.intro .it b{font-weight:600;color:var(--ai);font-size:16px;min-width:104px;white-space:nowrap}
.intro .it span{font-size:14.5px;color:var(--muted)}
.locos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.locos{grid-template-columns:repeat(4,minmax(0,1fr))}
.loco3{padding:16px;border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600;color:var(--ai);background:var(--sheet)}
.loco3 svg{width:44px;height:38px}
.loco3 span{font-size:13.5px;font-weight:400;color:var(--muted)}

/* หน้าเบี้ยถึง 99 */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tile{padding:16px 16px 16px 0;display:flex;flex-direction:column;gap:2px}
.tile+.tile{border-left:1px solid var(--line);padding-left:16px}
.tile small{font-size:13.5px;color:var(--muted)}.tile b{font-size:26px;font-weight:600;color:var(--ai)}
.tile b em{font-style:normal;font-size:15px;font-weight:400;color:var(--muted);margin-left:4px}
.adv{border-top:1px solid var(--line);padding-top:10px}
.adv summary{cursor:pointer;font-size:14.5px;color:var(--muted);list-style:none}
.adv summary::before{content:'▸ ';color:var(--kin)}
.adv[open] summary::before{content:'▾ '}
.tile.kin b{color:var(--kinT)}
.chartbox{display:flex;flex-direction:column;gap:12px}
.legend{display:flex;gap:14px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:8px;height:8px;border-radius:50%;display:inline-block}
.chart{position:relative;height:220px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--ink);padding:0 2px}
.chart .bar{flex:1;display:flex;flex-direction:column-reverse;gap:1px}.chart .bar i{display:block;border-radius:1px}
.axis{display:flex;gap:8px;padding:0 2px}.axis span{flex:1;text-align:center;font-size:12.5px;color:var(--muted)}
.hk{font-size:14px;min-height:34px;min-width:52px;border-radius:999px;border:1px solid var(--line);background:var(--sheet)}.hk.on{border-color:var(--ai);background:var(--ai);color:#fff}
.tbl{width:100%}
.tbl .tr{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));font-size:14px;border-top:1px solid var(--line)}
.tbl .th{font-size:12.5px;color:var(--muted);border-top:0;border-bottom:1px solid var(--ink)}
.tbl span{padding:8px 4px;text-align:right}.tbl span:first-child{text-align:left;color:var(--ai);font-weight:600}
.tbl .th span{font-weight:400;color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);line-height:1.7;padding-left:12px;border-left:2px solid var(--kin)}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dl .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60px}
.dl .btn small{font-size:13px;font-weight:400;opacity:.75}
.exp{display:flex;flex-direction:column;gap:10px;padding:18px 20px;border:1px dashed var(--kin);border-radius:14px;background:var(--sheet)}
.exp .t{font-size:15px;font-weight:600;color:var(--ai)}
.exp ol{margin:0;padding-left:20px;font-size:14.5px;line-height:1.75;color:var(--ink)}
.exp .r{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:640px){
 header{position:static}
 .train{gap:8px 3px}
 .car.solo{flex:0 0 auto}.car.solo .box{min-width:72px}
 main{padding:24px 16px 48px}.hwrap{padding:10px 16px 8px}
 h1{font-size:24px}
 .top{padding:16px 16px 0}.top img{width:60px}
 .grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
 .ids .age{grid-column:1/-1}
 .hrow{grid-template-columns:1fr;gap:6px}
 .moneys,.intro{grid-template-columns:1fr}.locos{grid-template-columns:repeat(2,minmax(0,1fr))}
 .tiles{grid-template-columns:1fr}.tile+.tile{border-left:0;border-top:1px solid var(--line);padding-left:0}
 .ln{grid-template-columns:minmax(0,1fr) 92px 28px;gap:4px 10px}
 .ln .sel{grid-column:1/-1}
 .ln .sumc{grid-column:1}.ln .prem{grid-column:2}.ln .act{grid-column:3}
 .ln .note{grid-column:1/-1}
 .cardc{padding:9px 12px 9px 16px}
 .info{font-size:12.5px}
 .info{font-size:12.5px}
 .box{min-width:0;padding:0 8px;font-size:12px}.car.loco .box{min-width:0}
 .dl{grid-template-columns:1fr}
}
@media (min-width:641px) and (max-width:820px){ .ln{grid-template-columns:minmax(0,1fr) 108px 84px 28px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#print{display:none}
@media print{
 @page{size:A4 portrait;margin:12mm 12mm 14mm}
 body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-size:12px;line-height:1.4}
 body>*:not(#print){display:none!important}
 #print{display:block;color:#1C1C2E}
 .pg{position:relative;min-height:0}
 .brk{break-before:page;page-break-before:always}
 .ph{display:flex;align-items:flex-start;gap:14px;padding-bottom:10px;border-bottom:1.5px solid #002366;margin-bottom:12px}
 .ph img{width:62px;display:block}
 .ph .pt{flex:1}.ph .pk{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.18em;color:#C8A94A;text-transform:uppercase;font-weight:600}
 .ph h1{margin:0;font-size:22px;color:#002366;font-weight:600;line-height:1.2}.ph .pw{font-size:13px;color:#5E5E70;margin-top:3px}
 .ph .pd{text-align:right;font-size:11px;color:#7A7A8C;line-height:1.5}
 table.comp{width:100%;border-collapse:collapse;font-size:12.5px}
 table.comp th{background:#002366;color:#fff;font-weight:600;padding:7px 8px;text-align:left;font-size:12px}
 table.comp td{padding:6px 7px;border-bottom:1px solid #E5E1D8;vertical-align:top}
 table.comp td.sw{width:4px;padding:0} table.comp td.nb{border-bottom-color:transparent}
 table.comp small{color:#6E6E80;font-size:10.5px}
 table.comp .r,th.r{text-align:right}.b{font-weight:600;color:#002366}
 table.comp tfoot td.tot{background:#F3EAD0;font-size:12px;padding:8px 7px;border-bottom:0}
 .ptiles{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 0 10px;border-top:1px solid #E5E1D8;border-bottom:1px solid #E5E1D8}
 .ptiles>div{padding:8px 10px 8px 0;display:flex;flex-direction:column;gap:1px}
 .ptiles>div+div{border-left:1px solid #E5E1D8;padding-left:10px}
 .ptiles small{font-size:11.5px;color:#6E6E80}.ptiles b{font-size:21px;color:#002366;font-weight:600}.ptiles .kin b{color:#A68B33}
 .pchart{margin:4px 0 10px}
 .pl{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:#5E5E70;margin-bottom:6px}.pl span{display:flex;align-items:center;gap:4px}.pl i{width:8px;height:8px;border-radius:50%;display:inline-block}.pl .mx{margin-left:auto}
 .pbars{display:flex;align-items:flex-end;gap:6px;height:172px;border-bottom:1px solid #1C1C2E;padding:0 2px}
 .pbar{flex:1;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;height:100%;position:relative}
 .pcol{display:flex;flex-direction:column-reverse;gap:1px}.pcol i{display:block}
 .pbar span{position:absolute;bottom:-14px;left:0;right:0;text-align:center;font-size:10px;color:#6E6E80}
 .pcap{font-size:9px;color:#7A7A8C;margin-top:18px}
 .pnotes{font-size:10.5px;color:#7A7A8C;line-height:1.55;padding-left:8px;border-left:2px solid #C8A94A;margin-top:8px}
 .pfoot{position:absolute;left:0;right:0;bottom:0;font-size:8.5px;color:#9A97A6;text-align:center;border-top:1px solid #E5E1D8;padding-top:4px}
 .pg:first-child{min-height:255mm;padding-bottom:10mm}
 .ph2{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid #002366;padding-bottom:6px;margin-bottom:6px}.ph2 b{font-size:15px;color:#002366;font-weight:600}.ph2 span{font-size:10px;color:#5E5E70}
 .psel{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:10px;color:#5E5E70;margin-bottom:8px}.psel i{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
 table.yr{width:100%;border-collapse:collapse;font-size:10.5px}
 table.yr thead{display:table-header-group}table.yr tfoot{display:table-footer-group}

 if(e.sum>0&&e.top>0&&Math.abs(e.top-e.sum*0.4)<0.5){ const c=rate(RATES.rider.CIP[sex],attained); return c===null?null:c*e.sum/1e6; }   // ชีต "CI Plus + CI Top Up" (1M + 400K) ตรงสัดส่วน
 const ra=rate(a,attained); if(ra===null) return null; let t=ra*(e.sum||0)/1e6; if(e.top>0){ const rb=rate(b,attained); if(rb===null) return null; t+=rb*e.top/1e6; } return t; }
function entryPending(e){ return ''; }
function entryPrem(e,attained){
 if(entryPending(e)) return null; if(isCipEntry(e)){ if(!(e.sum>0)) return null; return cipPrem(e,attained); } const srs=entrySeries(e); if(!srs) return null; const r=rate(srs,attained); if(r===null) return null;
 if(e.car==='w1') return r; if(e.car==='w2') return r*e.sum/1000;
 const R=RATES.rider[e.plan]; if(R.unit==='fixed') return r; return r*e.sum/1e6; }

 if(e.car==='w1'){ const t=HH_TIERS.find(x=>'HH:'+x[0]===e.plan); if(t) return {health:t[1]}; const hp={'HP:1M':1e6,'HP:5M':5e6,'HP:10M':10e6}[e.plan]; if(hp) return {health:hp}; if(e.plan.indexOf('IC:')===0) return {health:120e6}; return {health:0}; }
 if(e.car==='w2') return {hospCash:e.sum}; if(e.car==='w3') return {ciSevere:e.plan==='CIP'?(e.sum+e.top):e.sum};
 if(e.car==='w4') return {cancer:e.sum}; if(e.car==='w6') return {paDeath:e.sum}; if(e.car==='w7') return {care:e.sum}; return {}; }

const PBCI_SUMS=[100000,1000000];
function w5Info(){ const m={key:S.mainKey,sum:headSum(),term:mainTerm(S.mainKey,S.age)};
 if(isKid()){ const out={name:'PBCI',label:'PBCI · ยกเว้นเบี้ยเมื่อผู้จ่ายเบี้ยเสียชีวิตหรือเป็นโรคร้าย'};
  if(m.key!=='PL20') return Object.assign(out,{why:'ตาราง PBCI มีเฉพาะหัว 20Pay Life (20PLNP) — หัวนี้ยังไม่มีอัตรา'});
  if(!PBCI_SUMS.includes(m.sum)) return Object.assign(out,{why:'ตาราง PBCI มีเฉพาะทุนหัว 100,000 หรือ 1,000,000 — ทุน '+fmt(m.sum)+' ยังไม่มีอัตรา'});
  if(S.payerAge<20||S.payerAge>70) return Object.assign(out,{why:'ผู้ชำระเบี้ยต้องอายุ 20–70 ปี'});
  const srs=RATES.rider.PBCI.plans[String(m.sum)][S.sex]; const r=rate(srs,S.age);
  if(r===null) return Object.assign(out,{why:'ตาราง PBCI ไม่มีอัตราของอายุ '+S.age+' (รับ 0–15)'});
  const years=Math.max(0,Math.min(m.term,25-S.age,80-S.payerAge));
  return Object.assign(out,{prem:r,years,detail:'ทุนหัว '+fmt(m.sum)+' · เบี้ยเท่ากันทุกปี '+years+' ปี'}); }
 const out={name:'WPCI',label:'WPCI · ยกเว้นเบี้ยเมื่อเป็นโรคร้าย',wait:true};
 if(S.age<16||S.age>75) return Object.assign(out,{why:'WPCI รับอายุ 16–75 ปี'});
 return Object.assign(out,{why:'ยังไม่มีตารางอัตรา WPCI ไม่รวมในยอด',detail:'ทุน = เบี้ยหัว '+fmt(mainPrem(S.mainKey,S.sex,S.age,headSum()))+' บาท'}); }
function w5PremAt(attained){ const i=w5Info(); if(i.prem==null) return null; const y=attained-S.age; return (y>=0&&y<i.years)?i.prem:null; }
function carPremAt(k,attained){
 if(k==='w5') return w5PremAt(attained);
 if(k==='pa'){ const pl=paPlan(); return pl?paPremAt(pl,S.want.paCls,attained):null; }
 let t=null; entries(k).forEach(e=>{ const v=entryPrem(e,attained); if(v!==null) t=(t||0)+v; }); return t; }
function hasRate(k){ if(k==='pa') return !!paPlan(); if(k==='w5') return w5Info().prem!=null; return entries(k).some(e=>!entryPending(e)); }
function wanted(k){ if(k==='pa') return S.want.accMed>0; if(k==='w5') return !!S.want.wp; return entries(k).length>0; }
// ให้โค้ดเดิมที่เรียก riderDef(k).r ยังใช้ได้
function riderDef(k){ return {r:hasRate(k)?k:null}; }
function model(){
 const kid=isKid(), sex=S.sex, age=S.age;
 const included=k=>wanted(k);
 const allMain=MAIN_GROUPS.flatMap(x=>x[1]);
 const mainKey=allMain.includes(S.mainKey)?S.mainKey:'PLP20';
 const grp=MAIN_GROUPS.find(x=>x[1].includes(mainKey))[0];
 const sum=headSum(), term=mainTerm(mainKey,age), mp=mainPrem(mainKey,sex,age,sum);
 const yearAt=(y,withHike)=>{ const a=age+y; const main=(y<term&&mp!==null)?mp:0; const parts={}; let riders=0;
  ALL.forEach(k=>{ if(!included(k)) return; let v=carPremAt(k,a); if(v===null) return; if(withHike&&(k==='w1'||k==='w2')&&S.hike>0) v*=Math.pow(1+S.hike,y); parts[k]=v; riders+=v; });
  return {age:a,main,riders,parts,total:main+riders}; };
 const years=[], base=[]; for(let y=0;age+y<=98;y++){ years.push(yearAt(y,true)); base.push(yearAt(y,false)); }
 const cov={life:sum,health:0,ciSevere:0,cancer:0,hospCash:0,paDeath:0,accMed:0,care:0};
 ALL.forEach(k=>{ if(!included(k)) return; if(k==='pa'){ const pl=paPlan(); if(pl){ cov.accMed+=pl.me; cov.paDeath+=pl.ad; } return; } entries(k).forEach(e=>{ const c=entryCover(e); for(const f in c) cov[f]+=c[f]; }); });
 const lvl={}; ALL.forEach(k=>lvl[k]=included(k)?2:0);
 return {kid,sex,age,lvl,included,mainKey,grp,sum,term,mp,years,base,cov,first:years.length?years[0].total:0};
}

  <div class="tile kin"><small>เบี้ยต่อปีเมื่ออายุ 60 / 70</small><b>${kf.at60!=null?fmt(kf.at60):'–'}<em>/ ${kf.at70!=null?fmt(kf.at70):'–'}</em></b><small>เบี้ยตู้ปรับตามอายุ</small></div></div>
 <div class="chartbox"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div class="legend"><span><i class="sw" style="background:var(--ai)"></i>หัว</span>${legend}</div><span class="legend" style="gap:6px">${hz}</span></div>
  <div class="chart">${mark(kf.paidUp,'จ่ายหัวครบ '+kf.paidUp,'#1B2E5A',0)}${mark(60,'เกษียณ 60','#A88B4A',18)}${bars}</div><div class="axis">${sample.map(x=>`<span>${x.age}</span>`).join('')}</div>
  <div class="cov">เบี้ยรวมต่อปี ทุก 5 ปี · สูงสุดในช่วงนี้ ${fmt(max)} บาทต่อปี${S.hike?' · สมมติฐานเบี้ยตู้ 1–2 ขึ้น '+Math.round(S.hike*100)+'% ต่อปี':''}</div></div>
 <div class="note">อัตราฐาน ณ ${RATES_DATE} ยังไม่รวมส่วนลดทุนและขั้นอาชีพ · ประมาณการเบื้องต้น ไม่ใช่ใบเสนอขาย · เบี้ยสุขภาพไม่การันตี${m.included('pa')?' · PA ขั้นอาชีพ '+S.want.paCls:''}${m.mainKey==='CIPC'?' · CI ProCare ระยะชำระ 20 ปี (สมมติฐาน)':''}</div>
 <div class="dl"><button class="btn" data-act="xlsx"><span>ดาวน์โหลด Excel</span><small>สรุป + เบี้ยรายปีถึง 98 สำหรับที่ปรึกษา</small></button><button class="btn ghost" data-act="pdf"><span>บันทึก PDF</span><small>สรุปให้ลูกค้า + ตารางเบี้ยถึง 98</small></button></div>
 <div class="cov" id="dlmsg">${S.dlmsg||''}</div>
 <details class="adv"><summary>สำหรับที่ปรึกษา: สมมติฐานเบี้ยสุขภาพขึ้น · ส่งเข้า Money MRI</summary>
  <div style="display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap;color:var(--muted);margin:10px 0"><span>ถ้าเบี้ยตู้ 1–2 ขึ้นปีละ</span>${[[0,'0%'],[0.03,'3%'],[0.05,'5%']].map(h=>`<button class="hk ${S.hike===h[0]?'on':''}" data-act="hike" data-v="${h[0]}">${h[1]}</button>`).join('')}<span>(สมมติฐาน กระทบกราฟ ตาราง Excel และ PDF)</span></div>

  <li>หน้า IV ทะเบียนกรมธรรม์ กด <b>🤖 กรอกจากรูปด้วย AI</b> วาง <b>ก้อนที่ 1</b> กดเพิ่มเข้าทะเบียน แล้วเลือก "ของใคร"</li>
  <li>ที่เล่มนั้น กด 💸 แล้วกด <b>🤖 กรอกตารางเบี้ยจากรูปด้วย AI</b> วาง <b>ก้อนที่ 2</b> (เบี้ยตามอายุ ${age}–98 อัตราฐาน ไม่รวมสมมติฐานเบี้ยขึ้น)</li></ol>
  <div class="r"><button class="pill ${c1||''}" data-act="copy" data-v="pol">${lbl(c1,'คัดลอกก้อนที่ 1 ทุน')}</button><button class="pill ${c2||''}" data-act="copy" data-v="pf">${lbl(c2,'คัดลอกก้อนที่ 2 เบี้ยตามอายุ')}</button></div></div>
 </details>
 <button class="btn ghost" data-act="go" data-n="2">ย้อนกลับไปแก้ขบวน</button>`;
}
function render(){
 const m=model();
 document.getElementById('hdr').innerHTML=header(m);
 document.getElementById('app').innerHTML=[step0,step1,step2,step3][S.step](m);
}
// ---------- ข้อมูลส่งเข้า Money MRI (ทางเลือก — คัดลอกไปวางในทะเบียนกรมธรรม์) ----------
function trainName(m){ const ks=ALL.filter(k=>m.included(k)&&riderDef(k).r&&k!=='pa').map(k=>k.slice(1)); const pl=m.included('pa')?paPlan():null; return ('ขบวนเสนอ · '+RATES.main[m.mainKey].name+(ks.length?' + ตู้ '+ks.join(','):'')+(pl?' + '+pl.k:'')).slice(0,60); }
function mriPolicyJSON(m){
 const c=m.cov;
 return JSON.stringify([{company:'AIA',name:trainName(m),no:'',saleAge:String(m.age),start:'',payUntil:'',maturity:'',
  life:Math.round(c.life),premium:Math.round(m.base[0]?m.base[0].total:0),health:Math.round(c.health),accMed:Math.round(c.accMed),hospCash:Math.round(c.hospCash),hospCancer:0,
  cancer:Math.round(c.cancer),ciMid:0,ciSevere:Math.round(c.ciSevere),ciCrit:0,care:Math.round(c.care),paDeath:Math.round(c.paDeath),saving:0,annuity:0,surrender:0}]);
}
function mriPfJSON(m){
 const rows=[]; m.base.forEach(x=>{ const amt=Math.round(x.total); if(!(amt>0)) return; const last=rows[rows.length-1];
  if(last&&last.amt===amt&&last.to===x.age-1) last.to=x.age; else rows.push({from:x.age,to:x.age,amt}); });
 return JSON.stringify({name:trainName(m),rows});
}
// ---------- events ----------
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]'); if(!el) return;
 const a=el.dataset.act, v=el.dataset.v;
 if(a==='go'){ S.step=Number(el.dataset.n); S.copied={}; window.scrollTo(0,0); }
 else if(a==='who'){ if(S.who!==v){ S.who=v; S.age=v==='kid'?3:35; S.dob=''; S.want.life=v==='kid'?300000:1000000; S.want.wp=(v==='kid'); S.want.health=v==='kid'?'Deduct 100K':'HH:5M'; S.want.hosp=0; S.want.ci=0; S.want.cancer=0; S.want.acc=0; S.want.accPlan='ADD'; S.want.accMed=0; S.want.tpd=0; S.want.ciTop=0; S.extra=[]; S.want.paPlan=''; S.want.ciPlan='MPCI'; S.on={w1:true}; } }
 else if(a==='sex'){ S.sex=v; }
 else if(a==='ageMode'){ S.ageMode=v; if(v==='dob'&&S.dob){ const x=ageFromDob(S.dob); if(x!=null) S.age=x; } }
 else if(a==='health'){ S.want.health=v; S.on.w1=(v!=='none'); }
 else if(a==='wp'){ S.want.wp=(v===undefined)?!S.want.wp:v==='1'; }
 else if(a==='addw6'){ S.on.w6=true; if(!(S.want.acc>0)) S.want.acc=ACC_DEFAULT; }
 else if(a==='addx'){ addEntry(v); }
 else if(a==='dropx'){ removeEntry(el.dataset.car,v); }
 else if(a==='accMed'){ S.want.accMed=Number(v); S.want.paPlan=''; }
 else if(a==='paCls'){ S.want.paCls=Number(v); S.want.paPlan=''; }
 else if(a==='drop'){ if(v==='pa'){ S.want.accMed=0; S.want.paPlan=''; } else if(v==='w1'){ S.want.health='none'; S.on.w1=false; } else if(v==='w5') S.want.wp=false; else { S.on[v]=false; const key=Object.keys(WANT_CAR).find(x=>WANT_CAR[x]===v); if(key) S.want[key]=0; } }
 else if(a==='hike'){ S.hike=Number(v); }
 else if(a==='hz'){ S.horizon=Number(v); }
 else if(a==='copy'){ const m=model(); const text=v==='form'?formText(isKid()):v==='pol'?mriPolicyJSON(m):mriPfJSON(m); copyText(text,ok=>{S.copied[v]=ok?'ok':'fail';render();}); return; }
 else if(a==='csv'){ downloadCSV(); return; }
 else if(a==='xlsx'){ exportXlsx(); return; }
 else if(a==='pdf'){ printPDF(); return; }
 render();
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.want){ const k=t.dataset.want; S.want[k]=num(t.value); if(WANT_CAR[k]) S.on[WANT_CAR[k]]=S.want[k]>0; }   // เก็บค่าทันที · แสดงผลใหม่เมื่อออกจากช่อง
});
document.addEventListener('change',e=>{ const t=e.target;
 if(t.dataset.want){ render(); return; }
 if(t.dataset.inp==='age'){ S.age=Math.max(0,Math.min(80,Math.round(Number(t.value)||0))); render(); return; }
 if(t.dataset.inp==='payerAge'){ S.payerAge=Math.max(0,Math.round(Number(t.value)||0)); render(); return; }
 if(t.dataset.inp==='client'){ S.client=String(t.value||'').trim().slice(0,40); return; }
 if(t.dataset.inp==='dob'){ S.dob=String(t.value||''); const x=ageFromDob(S.dob); if(x!=null) S.age=x; render(); return; }
 if(t.dataset.sum){ S.want[t.dataset.sum]=num(t.value); render(); return; }
 if(t.dataset.esum){ setEntry(t.dataset.car,t.dataset.esum,'sum',num(t.value)); render(); return; }
 if(t.dataset.etop){ setEntry(t.dataset.car,t.dataset.etop,'top',num(t.value)); render(); return; }
 if(t.dataset.esel){ setEntry(t.dataset.car,t.dataset.esel,'plan',t.value); render(); return; }
 if(t.dataset.sel){ const k=t.dataset.sel; if(k==='pa'){ S.want.paPlan=t.value; render(); return; } if(k==='main') S.mainKey=t.value; render(); } });

function copyText(text,done){
 const legacy=()=>{try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');document.body.removeChild(ta);done(!!ok);}catch(e){done(false);}};
 try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(()=>done(true),legacy); else legacy(); }catch(e){legacy();}
}
function ddmmyy(){ const d=new Date(), p=n=>String(n).padStart(2,'0'); return p(d.getDate())+p(d.getMonth()+1)+String(d.getFullYear()+543).slice(-2); }
function downloadCSV(){
 const m=model();
 const ks=ALL.filter(k=>m.included(k)&&riderDef(k).r);
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const cols=['อายุ',q('หัวรถจักร ('+RATES.main[m.mainKey].name+' ทุน '+fmt(m.sum)+')')].concat(ks.map(k=>q(CAT[k].no+' '+CAT[k].name))).concat(['รวม/ปี','สะสม']);
 let cum=0; const lines=[cols.join(',')];
 m.years.forEach(x=>{ cum+=x.total; lines.push([x.age,Math.round(x.main)].concat(ks.map(k=>Math.round(x.parts[k]||0))).concat([Math.round(x.total),Math.round(cum)]).join(',')); });
 lines.push(''); lines.push(q('ประมาณการเบื้องต้น ณ อัตรา '+RATES_DATE+' · ไม่ใช่ใบเสนอขาย · เบี้ยสุขภาพไม่การันตี · ไม่รวม PBCI/WPCI'+(model().included('pa')?' · PA ขั้นอาชีพ '+S.want.paCls:'')+(S.hike?' · สมมติฐานเบี้ยตู้ 1–2 ขึ้น '+Math.round(S.hike*100)+'%/ปี':'')));
 const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
 a.download=fileBase()+'.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ---------- ชื่อไฟล์ตามมาตรฐาน S41: ชื่อ_ขบวนประกัน_DDMMYY ----------
function fileBase(){ const n=(S.client||'').replace(/[\\/:*?"<>|]/g,'').trim(); return (n||(isKid()?'ลูก':'ลูกค้า'))+'_ขบวนประกัน_'+ddmmyy(); }
function thaiDate(){ const d=new Date(); const M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.']; return d.getDate()+' '+M[d.getMonth()]+' '+(d.getFullYear()+543); }
// รายการในขบวน (ใช้ร่วมกันทั้ง Excel และ PDF)
// ขนาดกลุ่มของแถวที่อยู่ตู้เดียวกันติดกัน (ใช้รวมช่อง 'ประเภท' ใน PDF/Excel)
function groupSpans(rows){ const sp=rows.map(()=>0); let i=0; while(i<rows.length){ let j=i; while(j+1<rows.length&&rows[j+1].car===rows[i].car) j++; sp[i]=j-i+1; i=j+1; } return sp; }
function summaryRows(m){
 const rows=[{kind:'สัญญาหลัก',car:'หัวรถจักร',name:RATES.main[m.mainKey].name,detail:m.grp+' · จ่ายเบี้ย '+m.term+' ปี',sum:m.sum,prem:m.mp,color:'#002366'}];
 ALL.forEach(k=>{ if(!m.included(k)) return; const c=CAT[k];
