<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Self Tax Scan 2569 · S41</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5F2EC; --paper:#FBF9F5; --white:#FFFFFF; --navy:#002366; --navy2:#1a3a6e;
  --gold:#C8A94A; --gold2:#E8D08A; --goldS:#F3EAD0; --line:#E5E1D8; --muted:#7A7A8C; --text:#1C1C2E;
  --red:#C2503F; --green:#3E7C5A; --greenS:#E6F0E8;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Sarabun',sans-serif;color:var(--text);background:var(--cream);
  background-image:radial-gradient(circle at 18px 18px, rgba(200,169,74,.10) 1.2px, transparent 1.6px);
  background-size:36px 36px;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  font-variant-numeric:lining-nums tabular-nums}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font-family:inherit}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--paper);
  box-shadow:0 0 0 1px var(--line), 0 20px 60px rgba(0,35,102,.06)}

/* header */
.top{position:sticky;top:0;z-index:5;background:rgba(251,249,245,.94);backdrop-filter:blur(8px);padding:14px 20px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand img{height:30px;width:auto}
.brand .ver{font-size:12px;color:var(--muted);letter-spacing:.04em;text-align:right;line-height:1.3}
.chap{display:flex;gap:6px;margin-top:12px}
.chap div{flex:1}
.chap .bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.chap .bar i{display:block;height:100%;width:0;background:var(--navy);border-radius:4px;transition:width .5s ease}
.chap .lb{font-size:12px;color:var(--muted);margin-top:4px;text-align:center;white-space:nowrap}
.chap .on .lb{color:var(--navy);font-weight:600}
.top.hide-prog .chap{display:none}

/* screens */
main{flex:1;position:relative;overflow:hidden}
.scr{padding:26px 22px 150px;animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.art{display:flex;justify-content:center;margin:4px 0 14px}
.art svg{width:120px;height:106px}
.kick{font-size:13px;letter-spacing:.14em;color:var(--gold);font-weight:600;text-align:center;text-transform:uppercase}
h1{font-size:26px;line-height:1.35;color:var(--navy);font-weight:700;text-align:center;margin:6px 0 8px}
h2{font-size:21px;line-height:1.4;color:var(--navy);font-weight:600;text-align:center;margin:4px 0 6px}
.sub{color:var(--muted);text-align:center;font-size:15px;max-width:360px;margin:0 auto}
.en{font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.02em}

/* welcome */
.steps4{margin:26px 0 8px;display:grid;gap:10px}
.st4{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--white)}
.st4 b{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--navy);color:var(--navy);display:grid;place-items:center;font-size:13px;flex:none}
.st4 span{font-size:15px}.st4 small{display:block;color:var(--muted);font-size:13.5px;line-height:1.4}
.trust{display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--goldS);font-size:13px;color:#5a4a1a;line-height:1.5}
.trust svg{flex:none;margin-top:2px}

/* choice cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.card{position:relative;text-align:left;padding:14px 12px 12px;border:1.5px solid var(--line);border-radius:16px;background:var(--white);transition:.18s;min-height:112px;display:flex;flex-direction:column;gap:6px}
.card svg{width:40px;height:36px}
.card .t{font-weight:600;font-size:15px;line-height:1.35;color:var(--navy)}
.card .d{font-size:13.5px;color:var(--muted);line-height:1.4}
.card .sec{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:999px;background:var(--goldS);color:#8a6d1f;font-size:12.5px;font-weight:600;line-height:1.5;vertical-align:1px;white-space:nowrap}
.card:hover{border-color:var(--gold2)}
.card.on{border-color:var(--navy);background:#F4F6FB;box-shadow:0 0 0 3px rgba(0,35,102,.06)}
.card .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--white)}
.card.on .tick{background:var(--navy);border-color:var(--navy)}
.card.on .tick:after{content:'';width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.list1{display:grid;gap:10px;margin-top:20px}
.list1 .card{min-height:0;flex-direction:row;align-items:center;gap:14px;padding:14px 16px}
.list1 .card .tx{flex:1}

/* amount */
.amt{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--white)}
.amt+.amt{margin-top:12px}
.amt .lab{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--navy);font-size:15px}
.amt .lab svg{width:30px;height:27px;flex:none}
.amt .help{font-size:13.5px;color:var(--muted);margin:2px 0 10px 40px;line-height:1.45}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--cream);margin-bottom:10px}
.seg button{padding:5px 14px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--white);color:var(--navy);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.inp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:0 14px;transition:.15s}
.inp:focus-within{border-color:var(--navy);background:var(--white);box-shadow:0 0 0 3px rgba(0,35,102,.07)}
.inp input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:22px;font-weight:600;color:var(--navy);padding:10px 0;text-align:right}
.inp input::placeholder{color:#C9C5BC;font-weight:400}
.inp span{margin-left:8px;color:var(--muted);font-size:14px}
.calc{font-size:13px;color:var(--muted);margin-top:8px;text-align:right;min-height:20px}
.calc b{color:var(--navy)}
.warn{font-size:13px;color:var(--red);margin-top:6px;display:none;line-height:1.45}
.warn.show{display:block}
.okcap{font-size:13px;color:var(--green);margin-top:6px;line-height:1.45;display:none}
.okcap.show{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chip{padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;font-size:14px;background:var(--white)}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.skip{display:block;margin:10px 0 0 auto;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* stepper */
.row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--white);margin-top:10px}
.row svg.ic{width:38px;height:34px;flex:none}
.row .tx{flex:1;min-width:0}.row .tx b{display:block;color:var(--navy);font-weight:600;font-size:15px;line-height:1.35}
.row .tx small{color:var(--muted);font-size:13.5px;line-height:1.4;display:block}
.stp{display:flex;align-items:center;gap:6px;flex:none}
.stp button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);font-size:18px;line-height:1;color:var(--navy);background:var(--paper)}
.stp button:active{transform:scale(.94)}
.stp output{min-width:22px;text-align:center;font-weight:700;font-size:18px;color:var(--navy)}

/* bottom bar */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;pointer-events:none}
.foot .in{max-width:480px;margin:0 auto;padding:10px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 72%,rgba(251,249,245,0));pointer-events:auto}
.live{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;border-radius:14px;background:var(--white);border:1px solid var(--line);margin-bottom:10px;font-size:13px;color:var(--muted)}
.live .v{font-size:18px;font-weight:700;color:var(--navy)}
.live .dn{font-size:13px;color:var(--green);font-weight:600;display:block;text-align:right}
.live.hide{display:none}
.btns{display:flex;gap:10px}
.btn{flex:1;padding:15px 18px;border-radius:14px;font-size:16px;font-weight:600;background:var(--navy);color:#fff;transition:.15s}
.btn:disabled{background:#B9BFCC;cursor:not-allowed}
.btn.ghost{flex:0 0 auto;background:var(--white);color:var(--navy);border:1.5px solid var(--line);padding:15px 18px}
.btn.gold{background:var(--gold);color:#fff}

/* welcome v1.1 */
.art.hero svg{width:132px;height:116px}
.agent{display:flex;align-items:center;gap:12px;margin:18px auto 0;max-width:340px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--white)}
.agent .av{width:36px;height:36px;border-radius:50%;background:var(--goldS);color:#8a6d1f;display:grid;place-items:center;font-weight:700;flex:none}
.agent small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.agent b{color:var(--navy);font-size:15px;font-weight:600}
.agent>span:nth-child(2){flex:1;min-width:0}
.agent .seal{flex:none;width:34px;height:34px;border:1.5px solid var(--gold);color:var(--gold);border-radius:6px;display:grid;place-items:center;font-size:13px;transform:rotate(-6deg);opacity:.85}
.lead{text-align:center;color:var(--text);font-size:15px;margin:20px auto 0;max-width:360px}
.path{list-style:none;margin:18px 0 0;position:relative}
.path:before{content:'';position:absolute;left:27px;top:28px;bottom:28px;border-left:1.5px dashed var(--gold2)}
.path li{display:flex;align-items:center;gap:14px;padding:8px 0;position:relative}
.path .pi{width:56px;height:56px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;flex:none;position:relative;z-index:1}
.path .pi svg{width:44px;height:39px}
.path .pt{flex:1;min-width:0}
.path em{font-style:normal;font-size:12px;color:var(--gold);font-weight:700;letter-spacing:.08em;margin-right:6px}
.path b{color:var(--navy);font-size:16px;font-weight:600}
.path small{display:block;color:var(--muted);font-size:13.5px;line-height:1.4}
.path .how{flex:none;font-size:12px;color:var(--navy2);background:#EEF1F7;border-radius:999px;padding:3px 9px}
.time{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--navy);margin-top:10px}
.prep{margin-top:20px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--white)}
.prep .ph{font-weight:600;color:var(--navy);font-size:15px;margin-bottom:8px}
.prep ul{list-style:none;display:grid;gap:6px}
.prep li{display:flex;gap:10px;font-size:13.5px;line-height:1.45}
.prep .dot{width:7px;height:7px;border:1.5px solid var(--gold);border-radius:50%;margin-top:7px;flex:none}
.prep p{font-size:13.5px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
/* family v1.2 */
.q{margin-top:22px}
.ql{font-weight:600;color:var(--navy);font-size:16px;margin-bottom:8px}.ql span{font-weight:400;color:var(--muted);font-size:13px}
.inp.yr{max-width:220px}.inp.yr input{text-align:center;letter-spacing:.12em}
.inp.yr.sm{max-width:130px}.inp.yr.sm input{font-size:18px;padding:7px 0}
.q .calc{text-align:left}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card.sm{min-height:0;padding:14px 12px}
.card.sm .t{font-size:15px}.card .d{display:block}
.hint{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.reveal{display:none}.reveal.show{display:block;animation:in .35s ease both}
.live small{display:block;font-size:12px;color:var(--muted)}
.blk{margin-top:22px;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--white)}
.bh{display:flex;gap:12px;align-items:flex-start}.bh svg{width:40px;height:36px;flex:none}
.bh b{display:block;color:var(--navy);font-size:16px}.bh small{display:block;color:var(--muted);font-size:13.5px;line-height:1.45}
.add{width:100%;margin-top:12px;padding:12px;border:1.5px dashed var(--gold);border-radius:12px;color:#8a6d1f;font-weight:600;font-size:15px;background:#FFFDF6}
.kid{margin-top:12px;padding:12px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.kt{display:flex;justify-content:space-between;align-items:center}
.kn{font-weight:600;color:var(--navy);font-size:14px}
.kx{width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:18px;line-height:1}
.kr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:6px}
.kr label{font-size:13px;color:var(--muted);width:100%}
.kseg{margin:0}
.kseg button{padding:5px 10px;font-size:13.5px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:8px;color:var(--navy)}
.chk input{width:18px;height:18px;accent-color:var(--navy)}
.kres{margin-top:8px;font-size:13px;line-height:1.45}.kres.ok{color:var(--green);font-weight:600}.kres.no{color:var(--muted)}
.kres small{font-weight:400;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pc{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--paper);display:flex;flex-direction:column}
.pc.on{border-color:var(--green);background:var(--greenS)}
.pch{display:flex;align-items:center;gap:6px}.pch svg{width:28px;height:26px}.pch b{color:var(--navy);font-size:14.5px;flex:1}
.pv{font-size:13.5px;color:var(--green);font-weight:700}
.pc ul{list-style:none;margin:8px 0 10px;display:grid;gap:3px;flex:1}
.pc li{font-size:13px;color:var(--muted);line-height:1.35;padding-left:14px;position:relative}
.pc li:before{content:'';position:absolute;left:2px;top:6px;width:6px;height:6px;border:1.2px solid var(--gold);border-radius:50%}
.pbtn{padding:8px 6px;border-radius:10px;border:1.5px solid var(--navy);color:var(--navy);font-size:13px;font-weight:600;background:var(--white)}
.pc.on .pbtn{border-color:var(--green);color:var(--green);font-weight:500}
details.rare{margin-top:16px;border:1px dashed var(--line);border-radius:14px;padding:4px 14px}
details.rare summary{cursor:pointer;padding:10px 0;color:var(--navy);font-weight:600;font-size:14.5px;list-style:none}
details.rare summary::-webkit-details-marker{display:none}
details.rare summary:before{content:'+ ';color:var(--gold)}
details.rare[open] summary:before{content:'− '}
details.why44{margin-top:8px;border:none;padding:0}details.why44 summary{padding:6px 0 2px;font-size:14px}
.story{margin-top:8px;padding:14px 14px 10px;border-radius:14px;background:var(--cream);border:1px solid var(--line)}
.story h4{margin:0 0 10px;font-size:14.5px;color:var(--navy);font-weight:600}
.story .bar{display:flex;height:32px;border-radius:8px;overflow:hidden;margin:2px 0 4px;font-size:12px;color:#fff;font-weight:600}
.story .bar div{display:flex;align-items:center;justify-content:center;white-space:nowrap;min-width:0;overflow:hidden}
.story .bar .a{background:var(--navy)}.story .bar .b{background:var(--gold)}
.story .lg{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.story .st{display:flex;gap:10px;margin:0 0 10px}.story .st i{flex:0 0 24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-style:normal;font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.story .st p{margin:0;font-size:13.5px;line-height:1.5}.story .st p b{color:var(--navy);font-weight:600}
.sr.sub{font-size:13px;color:var(--muted);padding:1px 0 1px 12px}.sr.sub b{color:var(--muted);font-weight:500}.sr.hl b{color:var(--navy);font-weight:600}
.sr small{display:block;font-size:12px;color:var(--muted);font-weight:400;line-height:1.4}
.live .dn small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;text-align:right}
details.rare summary span{display:block;font-weight:400;color:var(--muted);font-size:13px}
details.rare .row{margin:0 0 12px}
@media (min-width:700px){ .app,.foot .in{max-width:560px} body{zoom:1.12} }
@media (min-width:1100px){ body{zoom:1.22} }
@media (max-width:360px){.pgrid,.two{grid-template-columns:1fr}}
/* v1.3 income/deduction detail */
.dochelp{margin:0 0 12px;border:1.5px solid #D9CBA3;border-radius:16px;background:var(--goldS);overflow:hidden}
.dochelp summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600;color:var(--navy);font-size:14.5px}
.dochelp summary::-webkit-details-marker{display:none}.dochelp summary small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.dochelp .db{padding:0 12px 12px}.dochelp .dq{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.dochelp .dr{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:12px;background:var(--white);border:1.5px solid var(--line);margin-top:6px;cursor:pointer}
.dochelp .dr.on{border-color:var(--navy);background:#F4F6FB}.dochelp .dr .ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center;background:#fff}
.dochelp .dr.on .ck{background:var(--navy);border-color:var(--navy)}.dochelp .dr.on .ck:after{content:'';width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.dochelp .dr b{display:block;font-size:13.5px;color:var(--text);line-height:1.35}.dochelp .dr small{display:block;font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:2px}.dochelp .dr em{font-style:normal;display:inline-block;margin-top:4px;padding:1px 8px;border-radius:999px;background:var(--goldS);color:#8a6d1f;font-size:12px;font-weight:600}
.amt[data-k="p94"] .seg,.amt[data-k="p94"] .calc{display:none}
.list1.tight{gap:8px}.list1.tight .card{padding:11px 14px}.list1.tight .card svg{width:34px;height:31px}
.expb{margin-top:12px;padding:12px;border-radius:12px;background:var(--paper);border:1px dashed var(--line)}
.eh{font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.04em}
.er{font-size:13.5px;color:var(--navy);margin:2px 0 6px;line-height:1.45}
.em{margin:2px 0 8px}
.actb .inp input{font-size:17px;padding:7px 0}
.actb .hint{margin:4px 0 6px}
.ex{display:flex;flex-direction:column;gap:2px;font-size:13.5px;color:var(--text)}
.ex b{color:var(--navy)}.ex small{font-size:13px;color:var(--muted);line-height:1.4}.ex small.bad{color:var(--red)}
.xnote{margin-top:10px;font-size:13.5px;color:#8a6d1f;background:var(--goldS);padding:8px 10px;border-radius:10px;line-height:1.45}
.xnote.chk{color:var(--red);background:#FBE9E7;font-weight:500}
.res44{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:#F4F6FB;border:1px solid #DCE2EE;margin:10px 0 2px}
.res44 span{font-size:13.5px;line-height:1.4}.res44 small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.res44.hide{display:none}.dvr.norate select{display:none}.res44 .yn{display:flex;gap:6px;flex:none}.res44 .yn button{padding:7px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:13.5px;color:var(--navy);cursor:pointer}.res44 .yn button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

details.fo summary:after{content:'ดูวิธีคิด ▾';display:block;position:absolute;right:12px;bottom:4px;font-size:11.5px;color:var(--muted)}
details.fo[open] summary:after{content:'ซ่อน ▴'}
details.fo summary{position:relative;padding-bottom:20px}
/* result */
.res{margin-top:18px;padding:22px 18px;border-radius:20px;background:var(--navy);color:#fff;text-align:center;position:relative;overflow:hidden}
.res:before{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;border:1px solid rgba(232,208,138,.35);border-radius:50%}
.res:after{content:'';position:absolute;right:-10px;top:-10px;width:80px;height:80px;border:1px solid rgba(232,208,138,.25);border-radius:50%}
.res .k{font-size:13px;opacity:.8}
.res .big{font-size:40px;font-weight:700;line-height:1.2;margin:4px 0}
.res .big small{font-size:16px;font-weight:400;opacity:.8}
.res .rf{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:999px;background:rgba(232,208,138,.18);color:var(--gold2);font-size:13.5px}
.mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.mini div{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.mini small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.mini b{font-size:15px;color:var(--navy)}
.sec{margin-top:26px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h3{font-size:17px;color:var(--navy);font-weight:600}
.sec span{font-size:13px;color:var(--muted)}
.ladder{margin-top:12px;padding:16px 14px 10px;border:1px solid var(--line);border-radius:16px;background:var(--white)}
.ladder .stairs{display:flex;align-items:flex-end;gap:4px;height:156px;padding-top:36px;box-sizing:border-box} /* v1.28: เผื่อที่ป้าย 'คุณอยู่ตรงนี้' ไม่ให้ถูกแท่งถัดไปบัง */
.ladder .s.you{z-index:2}
.ladder .s.you:first-child:after{left:0;transform:none}
.ladder .s.you:last-child:after{left:auto;right:0;transform:none}
.ladder .s{flex:1;border-radius:6px 6px 2px 2px;background:var(--cream);border:1px solid var(--line);position:relative;display:flex;align-items:flex-end;justify-content:center}
.ladder .s em{font-style:normal;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.ladder .s.on{background:var(--navy);border-color:var(--navy)}
.ladder .s.on em{color:#fff;font-weight:600}
.ladder .s.you:after{content:'คุณอยู่ตรงนี้';position:absolute;top:-34px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:var(--navy);font-weight:600;background:var(--goldS);padding:1px 7px;border-radius:999px}
.ladder .xs{display:flex;gap:4px;margin-top:6px}
.ladder .xs span{flex:1;text-align:center;font-size:11px;color:var(--muted);line-height:1.2}
.ladder p{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.opp{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--white);margin-top:10px}
.opp svg{width:42px;height:38px;flex:none}
.opp .tx{flex:1;min-width:0}
.opp .tx b{display:block;font-size:15px;color:var(--navy);line-height:1.35}
.opp .tx small{display:block;font-size:13.5px;color:var(--muted);line-height:1.4}
.opp .sv{text-align:right;flex:none}
.opp .sv b{display:block;font-size:16px;color:var(--green)}
.opp .sv small{font-size:12px;color:var(--muted)}
.none{padding:14px;border-radius:14px;background:var(--greenS);color:var(--green);font-size:14px;margin-top:10px}
.note{font-size:13px;color:var(--muted);line-height:1.55;margin-top:20px;padding-top:14px;border-top:1px dashed var(--line)}
.cta{margin-top:18px;padding:18px;border-radius:18px;border:1.5px dashed var(--gold);background:#FFFDF6;text-align:center}
.cta p{font-size:14px;color:#5a4a1a;margin-bottom:12px;line-height:1.5}
.cta .btns{flex-direction:column}
.credit{text-align:center;margin-top:22px;font-size:13.5px;color:var(--muted);line-height:1.5}
.credit b{color:var(--navy);font-weight:600}
.legal{font-size:11px;color:#A3A0AE;line-height:1.5;margin-top:8px;text-align:center}
.cta .step{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13.5px;color:var(--muted);margin:10px 0 0}
.cta .step em{font-style:normal;width:20px;height:20px;border-radius:50%;background:var(--goldS);color:#8a6d1f;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.cbtns{display:flex;gap:8px;margin-top:12px}
.cbtns a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 14px;border-radius:14px;font-size:15px;font-weight:600;text-decoration:none}
.cbtns a.line{background:#06C755;color:#fff}.cbtns a.tel{flex:0 0 auto;background:var(--white);color:var(--navy);border:1.5px solid var(--line)}
.cta .how2{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.mk .q label{display:block;font-weight:600;color:var(--navy);font-size:14.5px;margin-bottom:6px}
.mk .inp input{font-size:17px;text-align:left;font-weight:500}
.mk .hint2{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.mk .out{margin-top:20px;padding:14px;border-radius:14px;background:var(--white);border:1px solid var(--line);font-size:13.5px;word-break:break-all;color:var(--text)}
.mk .ok{color:var(--green);font-size:13px;margin-top:8px;min-height:18px;text-align:center}
.cta2{margin-top:18px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--white)}
.cta2 .ct{font-size:13.5px;color:var(--muted);margin-bottom:8px;text-align:center}
.cta2 .arow{display:flex;align-items:center;gap:10px}
.cta2 .av{width:32px;height:32px;border-radius:50%;background:var(--goldS);color:#8a6d1f;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.cta2 .an{flex:1;min-width:0}.cta2 .an b{display:block;color:var(--navy);font-size:14.5px;line-height:1.3}.cta2 .an small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.cta2 .ib{flex:none;height:34px;min-width:34px;padding:0 12px;border-radius:999px;display:grid;place-items:center;font-size:13px;font-weight:700;text-decoration:none}
.cta2 .ib.line{background:#06C755;color:#fff}.cta2 .ib.tel{padding:0;width:34px;border:1px solid var(--line);color:var(--navy);background:var(--white)}
.cta2 .pbtn2{width:100%;margin-top:10px;padding:13px;border-radius:12px;border:0;background:var(--navy);color:#fff;font-size:16px;font-weight:500;text-align:center;box-shadow:none} /* v1.29: ขนาดเท่าปุ่มส่งแผน ไม่ให้ดูบังคับ */
.cta2 .sbtn{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:0;background:#06C755;color:#fff;font-size:16px;font-weight:500;box-shadow:none;display:flex;align-items:center;justify-content:center;gap:8px}
.cta2 .sbtn:disabled{opacity:.6}
.cta2 .pbtn2.sec{background:var(--white);color:var(--navy);border:1.5px solid var(--navy);justify-content:center}
.cta2 .fb{margin-top:10px;padding:10px;border-radius:12px;background:var(--cream);border:1px solid var(--line)}
.cta2 .fb textarea{width:100%;height:120px;border:1px solid var(--line);border-radius:8px;padding:8px;font:13px/1.45 Sarabun,sans-serif;color:var(--text);background:#fff;resize:vertical}
.cta2 .fb .fr{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.cta2 .fb .fr button,.cta2 .fb .fr a{flex:1;padding:9px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-size:13px;font-weight:600;text-align:center;text-decoration:none}
.cta2 .fb .fr a.line{background:#06C755;color:#fff;border-color:#06C755}
.cta2 .fb .fr button.go{background:var(--navy);color:#fff;border-color:var(--navy)}
.cta2 .st2{font-size:13px;color:var(--green);margin-top:6px;text-align:center;min-height:16px}
.cta2 .ch{font-size:12.5px;color:var(--muted);margin-top:6px;text-align:center;line-height:1.45}
.mock{position:fixed;top:10px;right:10px;z-index:20;background:var(--red);color:#fff;font-size:12px;padding:3px 9px;border-radius:999px;letter-spacing:.03em}
@media (max-width:360px){ h1{font-size:23px} .grid2{grid-template-columns:1fr} .card{min-height:0} .res .big{font-size:34px} }
@media print{
  @page{size:A4;margin:11mm 12mm}
  html,body{background:#fff!important;background-image:none!important}
  body>*:not(#pdf){display:none!important}
  #pdf{display:block!important}
}
</style>

function capInfo(k){ const t=toTaxInput(), p=parts(t), r=taxCore(t), inc=p.income, sal=p.sal, ent=(D.has[k]?(+D.ded[k]||0):0)+(INRESULT?(+PLAN[WHO][k]||0):0);
  const pctTxt=(pct,base,bn,abs)=>`${Math.round(pct*100)}% ของ${bn} ${fmt(base)} = ${fmt(base*pct)}`+(abs?` · ไม่เกิน ${fmt(abs)}`:'');
  const hl=Math.min(+t.health||0,R.health);
  switch(k){
   case 'sso': return {max:R.sso, basis:'ไม่เกิน 10,500 บาทต่อปี', used:p.ss};
   case 'life': return {max:Math.max(0,R.lifeHealth-hl), basis:'ประกันชีวิตรวมกับประกันสุขภาพ ไม่เกิน 100,000 บาท', used:Math.min(ent,Math.max(0,p.lifeOwn-hl))};
   case 'health': return {max:R.health, basis:'ไม่เกิน 25,000 บาท และรวมกับประกันชีวิตไม่เกิน 100,000 บาท', used:Math.min(hl,p.lifeOwn)};
   case 'pension': { const room=Math.max(0,R.lifeHealth-p.lifeOwn); return {max:room+Math.min(inc*R.pensionPct,R.pensionMax), basis:pctTxt(R.pensionPct,inc,'รายได้',R.pensionMax)+(room>0?` · บวกส่วนที่ช่องประกันชีวิตยังว่าง ${fmt(room)}`:''), used:p.spill+p.pension, grp:1}; }
   case 'pvd': return {max:Math.min(sal*R.pvdPct,R.pvdMax), basis:pctTxt(R.pvdPct,sal,'เงินเดือน',R.pvdMax), used:p.pvd, grp:1};
   case 'rmf': return {max:Math.min(inc*R.rmfPct,R.rmfMax), basis:pctTxt(R.rmfPct,inc,'รายได้',R.rmfMax), used:p.rmf, grp:1};
   case 'gpf': return {max:Math.min(inc*R.gpfPct,R.gpfMax), basis:pctTxt(R.gpfPct,inc,'รายได้',R.gpfMax), used:p.gpf, grp:1};
   case 'nsf': return {max:R.nsfMax, basis:'ไม่เกิน 30,000 บาท', used:p.nsf, grp:1};
   case 'tfund': return {max:R.tfundMax, basis:'ตามจริง', used:p.tfund, grp:1};
   case 'esg': return {max:Math.min(inc*R.esgPct,R.esgMax), basis:pctTxt(R.esgPct,inc,'รายได้',R.esgMax), used:p.esg};
   case 'esgx': return {max:R.esgx, basis:'ไม่เกิน 50,000 บาทต่อปี', used:p.esgx};
   case 'mort': return {max:R.mort, basis:'ไม่เกิน 100,000 บาท', used:p.mort};
   case 'phealth': return {max:R.parentHealth, basis:'ไม่เกิน 15,000 บาท', used:p.parentHealth};
   case 'slife': return {max:t.spouseFlag?R.spouseLife:0, basis:t.spouseFlag?'ไม่เกิน 10,000 บาท':'ใช้ได้เฉพาะคู่สมรสไม่มีรายได้', used:p.spouseLife};
   case 'solar': return {max:R.solar, basis:'ตามจริง ไม่เกิน 200,000 บาท', used:p.solar};
   case 'art': return {max:R.art, basis:'ไม่เกิน 100,000 บาท', used:p.art};
   case 'se': return {max:R.se, basis:'ไม่เกิน 100,000 บาท', used:p.se};
   case 'party': return {max:R.party, basis:'ไม่เกิน 10,000 บาท', used:p.party};
   case 'prenatal': return {max:R.prenatal, basis:'ไม่เกิน 60,000 บาท', used:Math.min(ent,R.prenatal)};
   case 'donEdu': return {max:Math.floor(r.netBD*R.donPct/R.donEduX), basis:`นับ 2 เท่า ไม่เกิน 10% ของเงินได้หลังหักลดหย่อน (${fmt(r.netBD)})`, used:r.donEdu, x2:1};
   case 'don': { const left=Math.max(0,(+t.donEdu||0)-r.donEdu/R.donEduX), own=Math.min(ent,r.don); return {max:Math.max(0,(r.netBD-r.donEdu)*R.donPct), basis:`ไม่เกิน 10% ของเงินได้หลังหักลดหย่อน (${fmt(Math.max(0,r.netBD-r.donEdu))})`+(left>0?' · ใช้เพดานนี้ร่วมกับส่วนที่ล้นจากบริจาค 2 เท่า':''), used:own}; }
  } return {max:0,basis:'',used:0}; }

function kidInfo(){ const byIdx=D.kids.map(()=>({amt:0,txt:'กรอกปีเกิด'}));
  /* v1.5 (ตามกรมสรรพากร): ลำดับบุตรนับบุตรชอบด้วยกฎหมายที่มีชีวิตอยู่ทุกคนเรียงตามอายุ รวมคนที่ไม่เข้าเกณฑ์ · คนแรก หรือเกิดก่อน 2561 = 30,000 · คนที่ 2+ เกิดตั้งแต่ 2561 = 60,000

  let kA=0,kB=0,kOld=0;
  legit.forEach((o,p)=>{ const a=TAXYEAR-o.k.y;
    if(!elig(o.k)){ kOld++; byIdx[o.i]={amt:0,txt:`ลำดับที่ ${p+1} · อายุ ${a} ปี ไม่เข้าเงื่อนไขลดหย่อน (ยังนับเป็นลำดับบุตร)`}; return; }
    if(p===0||o.k.y<2561){ kA++; byIdx[o.i]={amt:30000,txt:`ลำดับที่ ${p+1} · ลดหย่อน 30,000 บาท`}; }

  return {byIdx,kA,kB,kOld,nAd}; }

  if(!NO44&&has44(WHO)){ const g=g44Of(WHO), c=CHO[WHO]||final44S(t,g).best, o=opt44(t,g,c.inD,c.inI);

function amtBox(o){ /* o:{key,store,t,h,ic,mon,cap,checkSal} */
  const yearly = o.store[o.key]||0;
  const monMode = o.monStore[o.key] ?? (o.mon?1:0);
  const shown = yearly? (monMode? Math.round(yearly/12): yearly) : '';
  return `<div class="amt" data-k="${o.key}">
    <div class="lab">${ART[o.ic]||''}<span>${o.t}</span></div>
    ${o.h?`<div class="help">${o.h}</div>`:''}
    ${o.sub||''}
    <div class="seg"><button data-m="1" class="${monMode?'on':''}">ต่อเดือน</button><button data-m="0" class="${monMode?'':'on'}">ทั้งปี</button></div>
    <div class="inp"><input inputmode="numeric" placeholder="0" value="${shown?fmt(shown):''}"><span>บาท</span></div>
    <div class="calc"></div><div class="warn"></div><div class="okcap"></div>
    ${o.tail||''}
  </div>`;

function wireAmt(root,store,monStore,meta){
  root.querySelectorAll('.amt').forEach(box=>{
    const k=box.dataset.k, m=meta[k]||{}, inp=box.querySelector('input'), calc=box.querySelector('.calc'), warn=box.querySelector('.warn'), ok=box.querySelector('.okcap');
    const upd=()=>{
      const mon = (monStore[k] ?? (m.mon?1:0));
      const v=parseN(inp.value), y = mon? v*12 : v;
      store[k]=y;
      calc.innerHTML = v ? (mon? `ทั้งปี <b>${fmt(y)}</b> บาท` : (y>=12000?`เฉลี่ยเดือนละ ${fmt(y/12)} บาท`:'')) : '';
      let w='';
      if(mon && v>=1000000) w='ตัวเลขนี้เป็นยอด "ต่อเดือน" ใช่หรือไม่ หากเป็นยอดทั้งปี กรุณาเลือก "ทั้งปี"';
      if(!mon && v>0 && v<12000 && m.mon && m.inc) w='ยอดทั้งปีดูน้อยกว่าปกติ หากเป็นยอดต่อเดือน กรุณาเลือก "ต่อเดือน"';
      if(m.k==='sso' && y>m.cap) w='';
      warn.textContent=w; warn.classList.toggle('show',!!w);
      let c='';
      if(m.cap && y>m.cap) c=`ใช้สิทธิ์ได้สูงสุด ${fmt(m.cap)} บาท ระบบจะคำนวณให้ที่ ${fmt(m.cap)} บาท`;
      ok.textContent=c; ok.classList.toggle('show',!!c);
      meta._after&&meta._after(); live(); /* v1.28: อัปเดตค่าก่อนคำนวณแถบล่าง (เดิมแถบล่างช้าไป 1 ตัวอักษรในหน้าภาษีหัก ณ ที่จ่าย) */
    };
    inp.addEventListener('input',()=>{ const pos=inp.value.length-inp.selectionStart; const n=parseN(inp.value); inp.value=n?n.toLocaleString('en-US'):''; const p=Math.max(0,inp.value.length-pos); inp.setSelectionRange(p,p); upd(); });
    box.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ monStore[k]=+b.dataset.m; box.querySelectorAll('.seg button').forEach(x=>x.classList.toggle('on',x===b)); upd(); });
    box.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ meta._sub&&meta._sub(k,c.dataset.v); box.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c)); upd(); });
    upd();
  });
}

/* ══════════ v3.18 · 40(4) ดอกเบี้ย/ปันผล: เลือกรวมยื่นหรือให้หัก ณ ที่จ่ายแล้วจบ (อ้อยเคาะ 22 ต.ค. 69)

function g44Tot(g){ g=g||{}; const has=v=>v!=null&&v!==''&&!isNaN(+v);

function household0(){

const OPPC={life:'ประกันชีวิต',pension:'ประกันบำนาญ',rmf:'กองทุน RMF',esg:'Thai ESG'};
const OPPU={rmf:p=>p.rmf,esg:p=>p.esg,pension:p=>p.spill+p.pension,life:(p,i)=>Math.max(0,p.lifeOwn-Math.min(+PD[i].ded.health||0,R.health))};
function oppor(i){ const keep=Object.assign({},PLAN[i]); PLAN[i]={};
  try{ const w=WHO; WHO=i; let p0,t0; try{ p0=withPlan(false,()=>parts(toTaxInput())); t0=withPlan(false,()=>taxS(toTaxInput()).tax); } finally{ WHO=w; }
    const items=[]; ['life','pension','rmf','esg'].forEach(k=>{ const mx=planMax(i,k), u=planUseful(i,k,mx); let save=0;
      if(u>0){ PLAN[i][k]=u; save=t0-planStat(i).after; PLAN[i][k]=0; }
      const used=OPPU[k](p0,i); items.push({k,t:OPPC[k],used,max:used+mx,add:u,save,pct:u>0?save/u:0}); });
    let add=0; ['life','pension','rmf','esg'].forEach(k=>{ const mx=planMax(i,k), u=planUseful(i,k,mx); if(u>0){ PLAN[i][k]=u; add+=u; } });
    const st=planStat(i); return {items,add,save:st.save,pct:add>0?st.save/add:0,tax:t0,after:st.after};
  } finally{ PLAN[i]=keep; } }
function oppSteps(i){ const keep=Object.assign({},PLAN[i]); PLAN[i]={};
  try{ const w=WHO; WHO=i; const t0=withPlan(false,()=>taxS(toTaxInput()).tax); WHO=w; let prev=t0; const steps=[];
    ['life','pension','rmf','esg'].forEach(k=>{ const mx=planMax(i,k), u=planUseful(i,k,mx); if(u>0) PLAN[i][k]=u; const st=planStat(i); steps.push({k,t:OPPC[k],add:u,tax:st.after,save:Math.max(0,prev-st.after)}); prev=st.after; });

/* อ่านตาราง TSD จากหัวคอลัมน์ (ไม่อิงตำแหน่ง) · ปันผล 40(4)(ข): คอลัมน์อัตรา % / ยกเว้นภาษี / ไม่ได้รับเครดิต / ร้อยละอื่น ๆ
   · ชีตเงินได้อื่น: 40(4)(ก) แยกตามภาษีที่ถูกหักรายแถว (≥ 13% = ดอกเบี้ย 15% เลือกได้ · ต่ำกว่า = DR/10% รวมยื่นเสมอ) · 40(4)(ง) และ 40(8) ไม่นำมาคิด */
function parseTSD(wb){ const out={dv:{},nc:0,oth:0,ex:0,intr:0,dr:0,odd:0,divTot:0,found:false,warn:[]};
  const num=v=>typeof v==='number'?v:(+(String(v).replace(/[,\s]/g,''))||0);
  wb.SheetNames.forEach(n=>{ const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
    const isData=r=>typeof r[0]==='number'||/^\d+$/.test(String(r[0]).trim());
    const d0=rows.findIndex(isData); if(d0<0) return;
    let hs=rows.findIndex(r=>/ลำดับ|^No\.?/i.test(String(r[0]))); if(hs<0||hs>d0) hs=0;
    const nc=rows.reduce((m,r)=>Math.max(m,r.length),0), C={rate:{}};
    for(let c=1;c<nc;c++){ const cells=rows.slice(hs,d0).map(r=>String(r[c]??'').trim()), tx=cells.join(' ').replace(/\s+/g,' ');
      const rc=cells.find(s=>/^\d+(\.\d+)?\s*%$/.test(s)); if(rc){ C.rate[c]=parseFloat(rc); continue; }
      if(/ยกเว้นภาษี|exemption/i.test(tx)) C.ex=c; else if(/ไม่ได้รับเครดิต|not receive/i.test(tx)) C.nc=c; else if(/ร้อยละ\s*อื่น|Percentage Other/i.test(tx)) C.oth=c;
      else if(/40\(4\)\(ก\)|40\(4\)\(a\)/i.test(tx)) C.intr=c; else if(/40\(4\)\(ง\)|40\(4\)\(d\)|40\(8\)/i.test(tx)) (C.odd=C.odd||[]).push(c);
      else if(/ภาษีหัก|Less Income Tax/i.test(tx)) C.wht=c; else if(/จำนวนเงิน\s*ที่จ่าย|Total\s*\(Baht\)/i.test(tx)) C.tot=c; }
    const data=rows.filter(isData), rateCols=Object.keys(C.rate).map(Number);
    if(rateCols.length){ let tot=0, parts=0;
      data.forEach(r=>{ rateCols.forEach(c=>{ const v=num(r[c]); if(v){ out.dv[C.rate[c]]=(out.dv[C.rate[c]]||0)+v; parts+=v; } });
        [['ex','ex'],['nc','nc'],['oth','oth']].forEach(([k,o])=>{ if(C[k]!=null){ const v=num(r[C[k]]); out[o]+=v; parts+=v; } });
        if(C.tot!=null) tot+=num(r[C.tot]); });
      out.divTot+=parts; if(C.tot!=null&&Math.abs(tot-parts)>1) out.warn.push('ยอดแยกตามอัตรารวมกันไม่เท่ายอดจ่าย ตรวจกับหนังสือรับรองอีกครั้ง');
      if(out.oth>0) out.warn.push('มีปันผลอัตราอื่น ๆ '+fmt(out.oth)+' นับเป็นไม่ได้เครดิต'); }
    if(C.intr!=null) data.forEach(r=>{ const a=num(r[C.intr]), w=C.wht!=null?num(r[C.wht]):a*.15; if(a>0){ if(w/a>=0.13) out.intr+=a; else out.dr+=a; } });
    if(C.odd) data.forEach(r=>C.odd.forEach(c=>{ out.odd+=num(r[c]); }));
  });
  out.found=out.divTot>0||out.intr>0||out.dr>0; return out; }
